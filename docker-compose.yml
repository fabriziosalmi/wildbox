# Wildbox Security Suite - Integration Testing Orchestrator
# Coordinates all services with shared networking for end-to-end testing
#
# 🚨 SECURITY WARNING: This configuration uses default values for testing!
# 📋 BEFORE PRODUCTION: 
#   1. Copy .env.example to .env
#   2. Generate secure random values for all secrets
#   3. Change all default passwords
#   4. Review SECURITY.md for complete security checklist
#
# See SECURITY.md for complete production security requirements

networks:
  wildbox:
    driver: bridge

services:
  # Identity Service (Authentication & Authorization)
  identity:
    build:
      context: ./open-security-identity
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    container_name: open-security-identity
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Shared secret the gateway presents to /internal/authorize. Without it
      # identity returns "Service misconfigured" and ALL gateway auth fails.
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - CREATE_INITIAL_ADMIN=${CREATE_INITIAL_ADMIN:-true}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
    depends_on:
      # condition: service_healthy, not bare start-order. Compose starts a
      # service as soon as its dependency's container exists, not when Postgres
      # accepts connections or Redis has loaded its AOF -- so the stack
      # converged by crash-looping, which made a real dependency failure
      # indistinguishable from ordinary startup churn (WILDBO-REL-04).
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Service (Security Tools Platform)
  api:
    build:
      context: ./open-security-tools
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    # No container_name: a fixed name makes `docker compose up --scale`
    # fail outright, so the first scaling action an operator reaches for was
    # unavailable in the shipped configuration (WILDBO-SCAL-02). The gateway
    # resolves upstreams by *service* name through Docker's DNS, which load-
    # balances across replicas, so nothing depended on the fixed name.
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - API_KEY=${API_KEY}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/2
      # Rate limits for the TOOLS service (this block builds ./open-security-tools;
      # the comment here used to say "AI agent service"). The value is no longer
      # duplicated: app/config.py declares no competing default, so this file is
      # the single place the effective limit is set (WILDBO-CONF-03).
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-500}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
    depends_on:
      wildbox-redis:
        condition: service_healthy
    networks:
      wildbox:
        aliases:
          # Keeps the hostname the gateway's upstreams use resolvable after
          # container_name was removed for scalability (WILDBO-SCAL-02).
          # A network alias round-robins across replicas; a container_name
          # cannot exist more than once.
          - open-security-tools
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker for Async Tool Execution
  tools-worker:
    build:
      context: ./open-security-tools
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    # No container_name: a fixed name makes `docker compose up --scale`
    # fail outright, so the first scaling action an operator reaches for was
    # unavailable in the shipped configuration (WILDBO-SCAL-02). The gateway
    # resolves upstreams by *service* name through Docker's DNS, which load-
    # balances across replicas, so nothing depended on the fixed name.
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=50 -I app.tasks
    environment:
      - API_KEY=${API_KEY}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/2
    depends_on:
      wildbox-redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      wildbox:
        aliases:
          # Keeps the hostname the gateway's upstreams use resolvable after
          # container_name was removed for scalability (WILDBO-SCAL-02).
          # A network alias round-robins across replicas; a container_name
          # cannot exist more than once.
          - open-security-tools-worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flower - Celery Monitoring UI (optional, for development)
  tools-flower:
    build:
      context: ./open-security-tools
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    container_name: open-security-tools-flower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: celery -A app.celery_app flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # app.config.Settings requires API_KEY (shared with api/tools-worker);
      # without it flower crashes on startup with "api_key Field required".
      - API_KEY=${API_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/2
    depends_on:
      wildbox-redis:
        condition: service_healthy
      tools-worker:
        condition: service_started
    networks:
      - wildbox
    # Override the image's HEALTHCHECK (curl :8000/health) — flower serves its
    # own UI + /healthcheck on 5555.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Service (Threat Intelligence & IOCs)
  data:
    build:
      context: ./open-security-data
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    # No container_name: a fixed name makes `docker compose up --scale`
    # fail outright, so the first scaling action an operator reaches for was
    # unavailable in the shipped configuration (WILDBO-SCAL-02). The gateway
    # resolves upstreams by *service* name through Docker's DNS, which load-
    # balances across replicas, so nothing depended on the fixed name.
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATA_DATABASE_URL:-${DATABASE_URL}}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      wildbox:
        aliases:
          # Keeps the hostname the gateway's upstreams use resolvable after
          # container_name was removed for scalability (WILDBO-SCAL-02).
          # A network alias round-robins across replicas; a container_name
          # cannot exist more than once.
          - open-security-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Scheduler (Threat Intelligence Collection Tasks)
  data-scheduler:
    build:
      context: ./open-security-data
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    container_name: open-security-data-scheduler
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: python -m app.scheduler.main
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATA_DATABASE_URL:-${DATABASE_URL}}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      data:
        condition: service_started
    networks:
      - wildbox
    healthcheck:
      # The data image has no procps (pgrep/ps); the scheduler is PID 1, so
      # check its cmdline directly.
      test: ["CMD-SHELL", "grep -q scheduler /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway (Request Routing & Security)
  gateway:
    build:
      context: ./open-security-gateway
      dockerfile: Dockerfile
    container_name: open-security-gateway
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./open-security-gateway/nginx:/etc/nginx:ro
      - ./open-security-gateway/logs:/var/log/nginx
      # writable so the entrypoint can generate a self-signed dev cert if none
      # is provided (mount real certs here in production)
      - ./open-security-gateway/ssl:/etc/ssl/wildbox
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - WILDBOX_ENV=${WILDBOX_ENV:-development}
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-info}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-http://open-security-identity:8001}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - AUTH_CACHE_TTL=${AUTH_CACHE_TTL:-300}
      - GATEWAY_DEBUG=${GATEWAY_DEBUG:-false}
      # Used to inject n8n's HTTP basic-auth on proxied /api/v1/automations/ requests
      # (only relevant when the optional "automations" profile is enabled).
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-}
    networks:
      - wildbox
    depends_on:
      - wildbox-redis
      - identity
      - guardian
      - responder
      - agents
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dashboard (Frontend)
  dashboard:
    build:
      context: ./open-security-dashboard
      dockerfile: Dockerfile.dev
    container_name: open-security-dashboard
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./open-security-dashboard:/app
      - /app/node_modules
      - /app/.next
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # This stack runs the Next.js dev server (Dockerfile.dev -> next dev),
      # so NODE_ENV must be development; production here breaks dev-mode CSP/HMR.
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_DEBUG=${NEXT_PUBLIC_DEBUG:-false}
      - NEXT_PUBLIC_USE_GATEWAY=true
      # Must match the origin the dashboard is opened from. The gateway is
      # HTTPS-only (80/8080 redirect to 443), so browser API calls go to
      # https://localhost — same-origin, no CORS. (http://localhost:8080 caused
      # cross-origin XHR to be blocked.)
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL:-https://localhost}
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:80/api/v1/tools
      - NEXT_PUBLIC_IDENTITY_API_URL=http://localhost:80/api/v1/identity
      - NEXT_PUBLIC_DATA_API_URL=http://localhost:80/api/v1/data
      - NEXT_PUBLIC_GUARDIAN_API_URL=http://localhost:80/api/v1/guardian
      # EXCLUDED FROM v1.0: - NEXT_PUBLIC_SENSOR_API_URL=http://localhost:80/api/v1/sensor
      - NEXT_PUBLIC_RESPONDER_API_URL=http://localhost:80/api/v1/responder
      - NEXT_PUBLIC_AGENTS_API_URL=http://localhost:80/api/v1/agents
      # EXCLUDED FROM v1.0: - NEXT_PUBLIC_CSPM_API_URL=http://localhost:80/api/v1/cspm
      # Internal URLs for server-side requests within Docker network
      - INTERNAL_GATEWAY_URL=http://open-security-gateway:8080
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
    networks:
      wildbox:
        aliases:
          - dashboard
    depends_on:
      - gateway
      - identity
    # node is always present in the image; use it (no curl in node:18-alpine).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (Identity Service)
  postgres:
    image: postgres:15
    container_name: wildbox-postgres
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-identity}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    # SECURITY: PostgreSQL not exposed to host. Access via Docker network only.
    # Uncomment for local development if needed:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provision per-service databases on first init (guardian, data; identity
      # uses POSTGRES_DB). See scripts/init-databases.sql.
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    networks:
      - wildbox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Shared Redis Cache (Consolidated for all services)
  wildbox-redis:
    image: redis:7-alpine
    container_name: wildbox-redis
    restart: unless-stopped
    # maxmemory-policy is noeviction, NOT allkeys-lru.
    #
    # This instance is not a cache: it holds the only copy of CSPM scan state,
    # responder run state and agents task ownership. Under allkeys-lru those
    # records were silently deleted when memory filled -- a completed scan
    # ceased to exist, and a running playbook lost the ownership key that
    # is_run_owner fails closed on (WILDBO-DATA-04). noeviction makes an
    # over-capacity write fail loudly so the service can report it, which is
    # backpressure rather than data loss (WILDBO-SCAL-05).
    #
    # The ceiling is raised too: 512MB was shared between that authoritative
    # state and four services' Celery/dramatiq queues.
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-1gb} --maxmemory-policy noeviction --databases 16 --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M
    volumes:
      - wildbox_redis_data:/data
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Guardian Service (Security Monitoring)
  guardian:
    build:
      context: ./open-security-guardian
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    container_name: open-security-guardian
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8013:8013"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${GUARDIAN_SECRET_KEY}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - DATABASE_URL=${GUARDIAN_DATABASE_URL:-${DATABASE_URL}}
      - REDIS_URL=${GUARDIAN_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - CELERY_BROKER_URL=${GUARDIAN_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - CELERY_RESULT_BACKEND=${GUARDIAN_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/guardian.log
      - ALLOWED_HOSTS=localhost,127.0.0.1,open-security-guardian
    volumes:
      - guardian_logs:/app/logs
    depends_on:
      # condition: service_healthy, not bare start-order. Compose starts a
      # service as soon as its dependency's container exists, not when Postgres
      # accepts connections or Redis has loaded its AOF -- so the stack
      # converged by crash-looping, which made a real dependency failure
      # indistinguishable from ordinary startup churn (WILDBO-REL-04).
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 30s
      timeout: 10s
      retries: 3



  # Responder Service (Incident Response)
  responder:
    build:
      context: ./open-security-responder
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    container_name: open-security-responder
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8018:8018"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${RESPONDER_DATABASE_URL:-${DATABASE_URL}}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - REDIS_URL=${RESPONDER_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/2}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      # condition: service_healthy, not bare start-order. Compose starts a
      # service as soon as its dependency's container exists, not when Postgres
      # accepts connections or Redis has loaded its AOF -- so the stack
      # converged by crash-looping, which made a real dependency failure
      # indistinguishable from ordinary startup churn (WILDBO-REL-04).
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 10s
      retries: 3



  # ============================================================================
  # CSPM Service (Cloud Security Posture Management)
  # ============================================================================
  cspm:
    build:
      context: ./open-security-cspm
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    # No container_name: a fixed name makes `docker compose up --scale`
    # fail outright, so the first scaling action an operator reaches for was
    # unavailable in the shipped configuration (WILDBO-SCAL-02). The gateway
    # resolves upstreams by *service* name through Docker's DNS, which load-
    # balances across replicas, so nothing depended on the fixed name.
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8019:8019"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # cspm requires SECRET_KEY (min 32 chars); without it the service crashes
      # on startup with a pydantic "secret_key Field required" error.
      - SECRET_KEY=${CSPM_SECRET_KEY}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - REDIS_URL=${CSPM_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      - CELERY_BROKER_URL=${CSPM_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      - CELERY_RESULT_BACKEND=${CSPM_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      # Encrypts cloud credentials before they are written to Redis, so they are
      # not recoverable from the AOF on the wildbox_redis_data volume
      # (WILDBO-SEC-02). Required: the service refuses to start a scan without it.
      - CSPM_CREDENTIAL_KEY=${CSPM_CREDENTIAL_KEY:?CSPM_CREDENTIAL_KEY is required}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      wildbox-redis:
        condition: service_healthy
    networks:
      wildbox:
        aliases:
          # Keeps the hostname the gateway's upstreams use resolvable after
          # container_name was removed for scalability (WILDBO-SCAL-02).
          # A network alias round-robins across replicas; a container_name
          # cannot exist more than once.
          - open-security-cspm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8019/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CSPM Celery Worker (Background Tasks)
  # cspm-worker:
  #   build:
  #     context: ./open-security-cspm
  #     dockerfile: Dockerfile
  #   container_name: open-security-cspm-worker
  #   restart: unless-stopped
  #   command: celery -A app.worker worker --loglevel=info --concurrency=4
  #   environment:
  #     - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3
  #     - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3
  #     - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3
  #     - LOG_LEVEL=INFO
  #   depends_on:
  #     - wildbox-redis
  #   networks:
  #     - wildbox

  # Agents Service (Security Agents)
  agents:
    build:
      context: ./open-security-agents
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    container_name: open-security-agents
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8006:8006"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Claude (Anthropic) — analysis is optional; the service starts without a
      # key and analysis tasks fail gracefully until one is set.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      - WILDBOX_API_URL=${WILDBOX_API_URL:-http://api:8000}  # Tools service endpoint
      # Authentication for tools service (must match API_KEY in tools service)
      - INTERNAL_API_KEY=${API_KEY}
      - REDIS_URL=${AGENTS_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/4}
      - CELERY_BROKER_URL=${AGENTS_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/4}
      - CELERY_RESULT_BACKEND=${AGENTS_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/4}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      wildbox-redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NOTE: Agents worker is now started by the entrypoint.sh script
  # in the main agents container, so no separate worker container needed.


  # ============================================================================
  # Sensor Service (System Monitoring)
  # ============================================================================
  sensor:
    build:
      context: ./open-security-sensor
      dockerfile: Dockerfile
      additional_contexts:
        shared: ../open-security-shared
    container_name: open-security-sensor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENSOR_LOGGING_LEVEL=${SENSOR_LOGGING_LEVEL:-INFO}
      - PYTHONPATH=/app
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./open-security-sensor/config.yaml.example:/etc/security-sensor/config.yaml:ro
      - sensor_logs:/var/log/security-sensor
      - sensor_data:/var/lib/security-sensor
      # Host monitoring (limited to safe read-only paths)
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      - /sys/class/net:/host/sys/class/net:ro
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Automations Service (n8n workflow automation) — OPTIONAL.
  # Off by default; enable with `docker compose --profile automations up -d`.
  # Nothing else hard-depends on it; the gateway resolves it dynamically and the
  # /api/v1/automations/ route simply 502s until this profile is started.
  automations:
    image: n8nio/n8n:1.74.0
    container_name: open-security-automations
    profiles: ["automations"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Bind to localhost only. N8N_BASIC_AUTH protects the editor/REST API but
      # NOT webhook endpoints (/webhook/*), which are unauthenticated by design —
      # exposing 0.0.0.0:5678 would let anyone on the network trigger workflows.
      # 127.0.0.1 keeps it reachable for local admin (e.g. via an SSH tunnel)
      # without exposing it to the network; containers still reach it over the
      # docker network by service name. Matches tools-flower (also 127.0.0.1).
      - "127.0.0.1:5678:5678"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=UTC
      - N8N_LOG_LEVEL=info
      - WEBHOOK_URL=http://localhost:5678
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      - N8N_SECURE_COOKIE=true
      - N8N_METRICS=true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - ./open-security-automations/n8n-data:/home/node/.n8n
    networks:
      - wildbox
    healthcheck:
      # The n8n image has no curl and its BusyBox wget is unreliable here; use
      # node (always present) to probe the /healthz liveness endpoint.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Scheduled backups (profile: backup)
  # ============================================================================
  # Nothing used to invoke backup_postgres.sh: no compose service, no CI job, no
  # Makefile target, no cron entry -- so the recovery point objective was
  # "whenever a human remembers" (WILDBO-DATA-05).
  #
  #   docker compose --profile backup up -d
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=wildbox-postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_HOST=wildbox-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - BACKUP_DIR=/backups/postgres
      - BACKUP_RETENTION=${BACKUP_RETENTION:-30}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts:/scripts:ro
      - wildbox_backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache bash redis >/dev/null 2>&1 || true
        while true; do
          echo "[backup] starting run at $$(date -Iseconds)"
          bash /scripts/backup_postgres.sh || echo "[backup] FAILED"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wildbox

  # ============================================================================
  # Monitoring (profile: monitoring)
  # ============================================================================
  # The deployed stack contained no prometheus, grafana or alertmanager, so
  # nothing watched the system when nobody was looking at it, and every failure
  # was found by a human noticing something (WILDBO-OBS-04). The services now
  # expose Prometheus exposition format at /metrics.
  #
  #   docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - wildbox

volumes:
  postgres_data:
  wildbox_backups:
  prometheus_data:
  wildbox_redis_data:
  guardian_logs:
  # Service-specific volumes
  sensor_logs:
  sensor_data:
