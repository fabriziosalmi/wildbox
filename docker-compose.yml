# Wildbox Security Suite - Integration Testing Orchestrator
# Coordinates all services with shared networking for end-to-end testing
#
# 🚨 SECURITY WARNING: This configuration uses default values for testing!
# 📋 BEFORE PRODUCTION: 
#   1. Copy .env.example to .env
#   2. Generate secure random values for all secrets
#   3. Change all default passwords
#   4. Review SECURITY.md for complete security checklist
#
# See SECURITY.md for complete production security requirements
#
# ENVIRONMENT has no default here, on purpose. Every service used to get
# ${ENVIRONMENT:-development}: a .env without the line, written by hand or
# older than the variable, started the whole stack as a development one,
# silently, with the API schemas published and none of the start-up checks
# for secrets (#736). Compose now refuses to start without it and says so.
# .env.example and `make generate-secrets` set ENVIRONMENT=production;
# docker-compose.prod.yml sets production itself on every service, whatever
# .env says.

networks:
  wildbox:
    driver: bridge

services:
  # Identity Service (Authentication & Authorization)
  identity:
    build:
      context: ./open-security-identity
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    container_name: open-security-identity
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      - DATABASE_URL=${DATABASE_URL}
      # Built here with the password, like every other service's. It was
      # ${REDIS_URL} from .env -- redis://wildbox-redis:6379/0, no password --
      # while Redis has required one since 0.10.0, so every call failed with
      # "Authentication required": the token blacklist was never written, and
      # logout revoked nothing (#475). The failures were logged and swallowed.
      - REDIS_URL=${IDENTITY_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Keys the HMAC of stored API-key digests, separately from the JWT
      # key, so rotating JWT_SECRET_KEY leaves API keys valid. It was
      # generated into .env but never passed here, so identity fell back to
      # JWT_SECRET_KEY and a JWT rotation invalidated every API key (#648).
      # An existing deployment seeds it from JWT_SECRET_KEY first; see
      # UPGRADING.md.
      - API_KEY_HASH_SECRET=${API_KEY_HASH_SECRET:?API_KEY_HASH_SECRET is required; see UPGRADING.md before setting it on an existing deployment}
      # Shared secret the gateway presents to /internal/authorize. Without it
      # identity returns "Service misconfigured" and ALL gateway auth fails.
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      # Where identity tells guardian that a member left a team, so guardian
      # stops accepting them as one of its users at once (#676). "-", not
      # ":-": unset means guardian's name on this network, while an empty
      # value in .env is kept and switches the notice off, for a deployment
      # that does not run guardian.
      - GUARDIAN_INTERNAL_URL=${GUARDIAN_INTERNAL_URL-http://open-security-guardian:8013/internal/team-memberships/revoke/}
      # What guardian-worker presents to POST /internal/team-contacts to
      # learn who may be e-mailed about a team (#705). A secret of its own:
      # the worker holds no GATEWAY_INTERNAL_SECRET, and identity does not
      # start when the two are equal. Empty: the route answers 503 and
      # guardian asks nothing.
      - GUARDIAN_CONTACTS_SECRET=${GUARDIAN_CONTACTS_SECRET:-}
      - CREATE_INITIAL_ADMIN=${CREATE_INITIAL_ADMIN:-true}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
    depends_on:
      # condition: service_healthy, not bare start-order. Compose starts a
      # service as soon as its dependency's container exists, not when Postgres
      # accepts connections or Redis has loaded its AOF -- so the stack
      # converged by crash-looping, which made a real dependency failure
      # indistinguishable from ordinary startup churn (WILDBO-REL-04).
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Service (Security Tools Platform)
  # SCALING CAVEAT: `api` keeps its execution history, per-tool statistics and
  # in-flight task registry in process memory (open-security-tools/app/
  # execution_manager.py). Two replicas therefore each report only the work that
  # landed on them: /stats and the tool statistics become per-replica views that
  # look like the whole picture. Tool *execution* is safe to scale -- the Celery
  # workers below are stateless and already scale -- but until that state moves
  # to Redis, run one `api` replica. The gateway load-balances by service name,
  # so raising this is a one-line change once the state is shared.
  api:
    build:
      context: ./open-security-tools
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    # No container_name: a fixed name makes `docker compose up --scale`
    # fail outright, so the first scaling action an operator reaches for was
    # unavailable in the shipped configuration (WILDBO-SCAL-02). The gateway
    # resolves upstreams by *service* name through Docker's DNS, which load-
    # balances across replicas, so nothing depended on the fixed name.
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - API_KEY=${API_KEY}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/2
      # No rate-limit variables: RATE_LIMIT_REQUESTS and RATE_LIMIT_WINDOW were
      # set here and never enforced by the tools service (#646). Requests are
      # limited per team by the gateway (RATE_LIMIT_PER_HOUR, on its service).
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      # Internal ranges and hosts the network tools may scan; empty refuses
      # every internal target (#614). The worker must get the same value.
      - TOOLS_ALLOWED_INTERNAL_TARGETS=${TOOLS_ALLOWED_INTERNAL_TARGETS:-}
    depends_on:
      wildbox-redis:
        condition: service_healthy
    networks:
      wildbox:
        aliases:
          # Keeps the hostname the gateway's upstreams use resolvable after
          # container_name was removed for scalability (WILDBO-SCAL-02).
          # A network alias round-robins across replicas; a container_name
          # cannot exist more than once.
          - open-security-tools
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker for Async Tool Execution
  tools-worker:
    build:
      context: ./open-security-tools
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    # No container_name: a fixed name makes `docker compose up --scale`
    # fail outright, so the first scaling action an operator reaches for was
    # unavailable in the shipped configuration (WILDBO-SCAL-02). The gateway
    # resolves upstreams by *service* name through Docker's DNS, which load-
    # balances across replicas, so nothing depended on the fixed name.
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=50 -I app.tasks
    environment:
      - API_KEY=${API_KEY}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/2
      # The same allowlist as the api service: asynchronous runs are checked
      # here, in the worker (#614).
      - TOOLS_ALLOWED_INTERNAL_TARGETS=${TOOLS_ALLOWED_INTERNAL_TARGETS:-}
    depends_on:
      wildbox-redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      wildbox:
        aliases:
          # Keeps the hostname the gateway's upstreams use resolvable after
          # container_name was removed for scalability (WILDBO-SCAL-02).
          # A network alias round-robins across replicas; a container_name
          # cannot exist more than once.
          - open-security-tools-worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flower - Celery Monitoring UI (optional, for development)
  tools-flower:
    build:
      context: ./open-security-tools
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    container_name: open-security-tools-flower
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: celery -A app.celery_app flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      # app.config.Settings requires API_KEY (shared with api/tools-worker);
      # without it flower crashes on startup with "api_key Field required".
      - API_KEY=${API_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/2
    depends_on:
      wildbox-redis:
        condition: service_healthy
      tools-worker:
        condition: service_started
    networks:
      - wildbox
    # Override the image's HEALTHCHECK (curl :8000/health) — flower serves its
    # own UI + /healthcheck on 5555.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Service (Threat Intelligence & IOCs)
  data:
    build:
      context: ./open-security-data
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    # No container_name: a fixed name makes `docker compose up --scale`
    # fail outright, so the first scaling action an operator reaches for was
    # unavailable in the shipped configuration (WILDBO-SCAL-02). The gateway
    # resolves upstreams by *service* name through Docker's DNS, which load-
    # balances across replicas, so nothing depended on the fixed name.
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      # app/config.py refuses to start without it in every environment but
      # development. Nothing passed it, so a freshly generated .env, which
      # says production, produced a data service that crash-looped on
      # "SECRET_KEY must be set".
      - SECRET_KEY=${DATA_SECRET_KEY:?DATA_SECRET_KEY is required}
      - DATABASE_URL=${DATA_DATABASE_URL:-${DATABASE_URL}}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      wildbox:
        aliases:
          # Keeps the hostname the gateway's upstreams use resolvable after
          # container_name was removed for scalability (WILDBO-SCAL-02).
          # A network alias round-robins across replicas; a container_name
          # cannot exist more than once.
          - open-security-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Scheduler (Threat Intelligence Collection Tasks)
  data-scheduler:
    build:
      context: ./open-security-data
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    container_name: open-security-data-scheduler
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: python -m app.scheduler.main
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      # app/config.py refuses to start without it in every environment but
      # development. Nothing passed it, so a freshly generated .env, which
      # says production, produced a data service that crash-looped on
      # "SECRET_KEY must be set".
      - SECRET_KEY=${DATA_SECRET_KEY:?DATA_SECRET_KEY is required}
      - DATABASE_URL=${DATA_DATABASE_URL:-${DATABASE_URL}}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      data:
        condition: service_started
    networks:
      - wildbox
    healthcheck:
      # The data image has no procps (pgrep/ps); the scheduler is PID 1, so
      # check its cmdline directly.
      test: ["CMD-SHELL", "grep -q scheduler /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway (Request Routing & Security)
  gateway:
    build:
      context: ./open-security-gateway
      dockerfile: Dockerfile
    container_name: open-security-gateway
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./open-security-gateway/nginx:/etc/nginx:ro
      - ./open-security-gateway/logs:/var/log/nginx
      # writable so the entrypoint can generate a self-signed dev cert if none
      # is provided (mount real certs here in production)
      - ./open-security-gateway/ssl:/etc/ssl/wildbox
      # The entrypoint copies the certificate (not the key) here, for the
      # containers that call the gateway over HTTPS and must trust it: the
      # sensor (#628).
      - gateway_cert:/etc/ssl/wildbox-public
    environment:
      # Only what the gateway reads. ENVIRONMENT, WILDBOX_ENV,
      # GATEWAY_LOG_LEVEL and NGINX_ENVSUBST_OUTPUT_DIR used to be passed
      # too: no nginx directive, Lua module or script of the gateway read
      # any of them (the last is a setting of the official nginx image's
      # entrypoint, which this image does not use), so setting them changed
      # nothing (#756).
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-http://open-security-identity:8001}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - AUTH_CACHE_TTL=${AUTH_CACHE_TTL:-300}
      # auth_handler.lua reads this; .env.example documents it, but nothing
      # passed it in, so the limit was always the 10000/hour built-in default
      # and the setting had no effect wherever it was written.
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-10000}
      # Requests per second the gateway accepts from one client address,
      # before authentication: everywhere, on the login, registration and
      # forgotten-password routes, and for the dashboard's static assets
      # (#756). The entrypoint writes them into the limit_req zones nginx
      # loads; the defaults are the limits the gateway always had. A value
      # that is not a whole number from 1 to 100000 stops the gateway at
      # startup. Operator settings: nothing a client sends changes them.
      - GATEWAY_RATE_LIMIT_PER_SECOND=${GATEWAY_RATE_LIMIT_PER_SECOND:-100}
      - GATEWAY_AUTH_RATE_LIMIT_PER_SECOND=${GATEWAY_AUTH_RATE_LIMIT_PER_SECOND:-5}
      - GATEWAY_STATIC_RATE_LIMIT_PER_SECOND=${GATEWAY_STATIC_RATE_LIMIT_PER_SECOND:-500}
      # The origins whose pages may call the API from a browser (#712). The
      # gateway answers their preflights and names them in its responses;
      # it reads the same setting the services do. The default is the
      # dashboard's development server. An entry that is not an origin
      # (scheme, host, optional port) stops the gateway at startup.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    networks:
      - wildbox
    # Every service whose hostname appears in an `upstream` block of
    # nginx/conf.d/wildbox_gateway.conf must be listed here.
    #
    # nginx resolves upstream hostnames once, when it loads the configuration,
    # and treats a name it cannot resolve as fatal: "host not found in upstream
    # ... " and the process exits. With `restart: unless-stopped` the gateway
    # then crash-loops. So a single missing backend does not degrade one route,
    # it takes the whole gateway down. This list used to name five of the nine
    # upstreams, so `docker compose up gateway` -- or any partial stack -- left
    # the gateway restarting forever.
    #
    # The same applies at runtime: stopping one backend and restarting the
    # gateway kills it. Making a single backend non-fatal means switching
    # proxy_pass to a variable plus `resolver 127.0.0.11`, which defers
    # resolution to request time; that is a larger change than this one and is
    # not done here.
    depends_on:
      - wildbox-redis
      - identity
      - guardian
      - responder
      - agents
      - api
      - data
      - cspm
      - dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dashboard (Frontend)
  dashboard:
    build:
      context: ./open-security-dashboard
      dockerfile: Dockerfile.dev
    container_name: open-security-dashboard
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    # Only the directories next dev watches are bind-mounted. The image runs
    # as nextjs (uid 1001) and next dev writes next-env.d.ts into the project
    # root at start-up; with the whole checkout mounted over /app that root
    # belonged to the host user, so on Linux any checkout not owned by uid
    # 1001 crash-looped on EACCES. /app itself, .next, node_modules and the
    # config files now come from the image, owned by nextjs, and nothing is
    # written into the checkout. Editing package.json or a root config file
    # (next.config.js, tsconfig.json, postcss.config.js) therefore takes
    # `docker compose up -d --build dashboard`.
    volumes:
      - ./open-security-dashboard/src:/app/src
      - ./open-security-dashboard/public:/app/public
    environment:
      # No ENVIRONMENT, NEXT_PUBLIC_DEBUG or NEXTAUTH_* here: the dashboard
      # reads none of them (#665). Its sessions are identity's tokens; it
      # has no NextAuth.
      # This stack runs the Next.js dev server (Dockerfile.dev -> next dev),
      # so NODE_ENV must be development; production here breaks dev-mode CSP/HMR.
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_USE_GATEWAY=true
      # Empty by default: the browser opens the dashboard through the gateway
      # (https://localhost) and calls the API on that same origin, whatever
      # host name it was reached by. Set it only to serve the dashboard from
      # another origin than the gateway. The gateway is HTTPS-only (80/8080
      # redirect to 443), so a value must be https://. The per-service
      # NEXT_PUBLIC_*_API_URL variables that used to follow are read by
      # nothing (WILDBO-ARCH-04, #559).
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL:-}
      # Internal URLs for server-side requests within Docker network
      - INTERNAL_GATEWAY_URL=http://open-security-gateway:8080
    networks:
      wildbox:
        aliases:
          - dashboard
    # `gateway` deliberately absent here. It is the *browser* that talks to the
    # gateway, not this container at start-up, and the edge created a cycle:
    # nginx must resolve open-security-dashboard before it will load its
    # configuration at all, so each waited for the other.
    depends_on:
      - identity
    # node is always present in the image; use it (no curl in node:18-alpine).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (Identity Service)
  postgres:
    image: postgres:15@sha256:724292da1f2e50bdccfc3302ce75bbba7f4a6076701b588cc795fcac65683550
    container_name: wildbox-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-identity}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    # SECURITY: PostgreSQL not exposed to host. Access via Docker network only.
    # Uncomment for local development if needed:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provision per-service databases on first init (guardian, data; identity
      # uses POSTGRES_DB). See scripts/init-databases.sql.
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    networks:
      - wildbox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Shared Redis Cache (Consolidated for all services)
  wildbox-redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: wildbox-redis
    restart: unless-stopped
    # maxmemory-policy is noeviction, NOT allkeys-lru.
    #
    # This instance is not a cache: it holds the only copy of CSPM scan state,
    # responder run state and agents task ownership. Under allkeys-lru those
    # records were silently deleted when memory filled -- a completed scan
    # ceased to exist, and a running playbook lost the ownership key that
    # is_run_owner fails closed on (WILDBO-DATA-04). noeviction makes an
    # over-capacity write fail loudly so the service can report it, which is
    # backpressure rather than data loss (WILDBO-SCAL-05).
    #
    # The ceiling is raised too: 512MB was shared between that authoritative
    # state and four services' Celery/dramatiq queues.
    #
    # docker-compose.prod.yml inherits this command; it used to replace it
    # with allkeys-lru (#530). scripts/check_redis_config.py asserts the
    # rendered production configuration keeps it.
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-1gb} --maxmemory-policy noeviction --databases 16 --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # At least twice REDIS_MAXMEMORY. maxmemory bounds the dataset, not
          # the process: an AOF rewrite forks, and copy-on-write under writes
          # can double the resident memory. With the limit equal to maxmemory
          # the kernel OOM-killed Redis (exit 137) before noeviction ever
          # refused a write; at 1.5x it was killed during a rewrite; at 2x it
          # refused writes with OOM errors and stayed up (#530).
          memory: ${REDIS_MEMORY_LIMIT:-2g}
        reservations:
          cpus: '0.25'
          memory: 128M
    volumes:
      - wildbox_redis_data:/data
    networks:
      - wildbox
    environment:
      # The password for redis-cli inside this container: the health check
      # below, and `docker compose exec wildbox-redis redis-cli ...`. In the
      # environment it is in no argument list; the check used to pass it
      # with -a, where it showed in the container's process list (#740).
      - REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      # The reply has to be PONG. redis-cli exits 0 when the server answers
      # with an error, so `redis-cli ping` alone was healthy on NOAUTH and
      # WRONGPASS: a server whose password no longer matched stayed healthy
      # (#740). A Redis that is still loading its data is not healthy yet,
      # so the services that wait for it start once it can serve them; the
      # start period gives a large append-only file the time to load before
      # a failed check counts.
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # Guardian Service (Security Monitoring)
  guardian:
    build:
      context: ./open-security-guardian
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    container_name: open-security-guardian
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8013:8013"
    environment:
      # No ENVIRONMENT: guardian reads none. What it does differently in
      # development (the API schema pages, Django's debug pages, no HTTPS
      # redirect) follows DEBUG below, which is false unless .env says
      # otherwise (#665).
      # :? so an unset value fails compose loudly instead of starting the
      # service with SECRET_KEY="", which Django rejects at boot anyway.
      - SECRET_KEY=${GUARDIAN_SECRET_KEY:?GUARDIAN_SECRET_KEY is required}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - DATABASE_URL=${GUARDIAN_DATABASE_URL:-${DATABASE_URL}}
      - REDIS_URL=${GUARDIAN_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - CELERY_BROKER_URL=${GUARDIAN_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - CELERY_RESULT_BACKEND=${GUARDIAN_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - DEBUG=${DEBUG:-false}
      # No LOG_FILE: guardian logs to the console only (guardian/settings.py),
      # and the guardian_logs volume that was mounted for it stayed empty
      # (#665).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_HOSTS=localhost,127.0.0.1,open-security-guardian
      # How many days a user stays one of a team's users without acting in
      # it, 1 to 365, default 30 (#676). The same value on guardian,
      # guardian-worker and guardian-beat: the API and the e-mails apply
      # one rule.
      - GUARDIAN_TEAM_MEMBERSHIP_MAX_AGE_DAYS=${GUARDIAN_TEAM_MEMBERSHIP_MAX_AGE_DAYS:-}
      # Requests one user may make to guardian per period, such as
      # 1000/hour, or off; empty means 1000/hour. A malformed value stops
      # guardian at start-up (guardian/rate_limit.py). The variable guardian
      # read before, API_RATE_LIMIT, was never passed here, so the setting
      # did nothing (#645). Only this service serves requests: the worker
      # and beat do not need it.
      - GUARDIAN_RATE_LIMIT_USER=${GUARDIAN_RATE_LIMIT_USER:-}
      # Internal ranges a discovery or a port scan may reach: CIDR ranges and
      # IP addresses, comma-separated. Empty refuses every internal target
      # (#748). guardian's own list, not TOOLS_ALLOWED_INTERNAL_TARGETS. This
      # service refuses the request; guardian-worker, which scans, must get
      # the same value. A malformed entry stops both at start-up
      # (guardian/scan_targets.py).
      - GUARDIAN_ALLOWED_INTERNAL_TARGETS=${GUARDIAN_ALLOWED_INTERNAL_TARGETS:-}
    volumes:
      # Generated reports: guardian-worker writes them, guardian serves
      # their downloads (#548).
      - guardian_media:/app/media
    depends_on:
      # condition: service_healthy, not bare start-order. Compose starts a
      # service as soon as its dependency's container exists, not when Postgres
      # accepts connections or Redis has loaded its AOF -- so the stack
      # converged by crash-looping, which made a real dependency failure
      # indistinguishable from ordinary startup churn (WILDBO-REL-04).
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      # /health/, the route itself: /health only answers APPEND_SLASH's 301,
      # and curl -f counts any 3xx as success, so the check passed even with
      # the database down. The route returns 503 when a dependency is
      # unhealthy, which -f turns into a failed check (#532).
      test: ["CMD", "curl", "-fsS", "http://localhost:8013/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Guardian Celery worker. guardian publishes tasks to Redis db 1 (port
  # scans on asset creation, assignment notices, alert-rule checks,
  # report generation, compliance notifications), and nothing consumed them
  # until this service existed: every task stayed queued forever (#537).
  # Same image as guardian; the entrypoint's migrate is a no-op once
  # guardian is healthy, which is why it waits for that.
  guardian-worker:
    build:
      context: ./open-security-guardian
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    # -Q: exactly the queues in guardian/celery.py TASK_QUEUES, so a routed
    # task is never published to a queue no worker reads (#545; a unit test
    # compares the two).
    command: celery -A guardian worker --loglevel=info --concurrency=2 -Q default,reporting,scanning,analytics
    # The reports it generates, for guardian to serve; without the shared
    # volume a download found no file (#548).
    volumes:
      - guardian_media:/app/media
    environment:
      - SECRET_KEY=${GUARDIAN_SECRET_KEY:?GUARDIAN_SECRET_KEY is required}
      - DATABASE_URL=${GUARDIAN_DATABASE_URL:-${DATABASE_URL}}
      - REDIS_URL=${GUARDIAN_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - CELERY_BROKER_URL=${GUARDIAN_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - CELERY_RESULT_BACKEND=${GUARDIAN_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # The worker is what sends guardian's e-mail (#705). No host, no mail
      # server: a notification is recorded as not sent, not printed to this
      # container's log as it was. With a host, a sender is required
      # (guardian/mailconf.py checks every value at start-up).
      - EMAIL_HOST=${GUARDIAN_EMAIL_HOST:-}
      - EMAIL_PORT=${GUARDIAN_EMAIL_PORT:-}
      - EMAIL_USE_TLS=${GUARDIAN_EMAIL_USE_TLS:-}
      - EMAIL_USE_SSL=${GUARDIAN_EMAIL_USE_SSL:-}
      - EMAIL_HOST_USER=${GUARDIAN_EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${GUARDIAN_EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${GUARDIAN_DEFAULT_FROM_EMAIL:-}
      # Where the worker asks identity who may be e-mailed about a team, and
      # the secret it presents: its own, not GATEWAY_INTERNAL_SECRET, which
      # this container does not hold. Empty URL: identity's name on this
      # network. Empty secret: guardian asks nothing, and e-mails only the
      # addresses typed into an alert rule or a report schedule.
      - GUARDIAN_TEAM_CONTACTS_URL=${GUARDIAN_TEAM_CONTACTS_URL:-}
      - GUARDIAN_CONTACTS_SECRET=${GUARDIAN_CONTACTS_SECRET:-}
      # The address users open the dashboard at: what a link in an e-mail
      # starts with. Empty: the e-mails carry no link.
      - GUARDIAN_BASE_URL=${GUARDIAN_BASE_URL:-}
      # Seconds between reminders of an alert rule that keeps firing, or
      # off; empty means one day (guardian/schedule.py, #549).
      - GUARDIAN_ALERT_RENOTIFY_INTERVAL=${GUARDIAN_ALERT_RENOTIFY_INTERVAL:-}
      # The SLA and assignment e-mails go to an assignee only while they
      # are a member of the vulnerability's team: the same window as on
      # guardian (#676).
      - GUARDIAN_TEAM_MEMBERSHIP_MAX_AGE_DAYS=${GUARDIAN_TEAM_MEMBERSHIP_MAX_AGE_DAYS:-}
      # The worker is what connects to the addresses a discovery or a port
      # scan names, from inside the stack's networks: it applies the policy
      # again when the task runs, with the same list as guardian (#748).
      # Empty: no internal address is scanned.
      - GUARDIAN_ALLOWED_INTERNAL_TARGETS=${GUARDIAN_ALLOWED_INTERNAL_TARGETS:-}
    depends_on:
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
      guardian:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      # This worker, by node name, not any worker on the broker.
      test: ["CMD-SHELL", "celery -A guardian inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Guardian Celery beat: sends guardian's periodic tasks (SLA check,
  # alert rules, cleanups, compliance reminders) to guardian-worker on the
  # schedule in open-security-guardian/guardian/schedule.py (#545). Each
  # interval can be changed with the GUARDIAN_SCHEDULE_* variable below; see
  # docs/guides/deployment.md. It reads the schedule from PostgreSQL
  # (django-celery-beat) and publishes to Redis, and talks to nothing else.
  #
  # Exactly one instance. Beat has no leader election: two of them would
  # each send every task, so every reminder would go out twice.
  # container_name makes `--scale guardian-beat=2` fail instead.
  guardian-beat:
    build:
      context: ./open-security-guardian
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    container_name: open-security-guardian-beat
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    # The scheduler is django-celery-beat's DatabaseScheduler plus a
    # heartbeat file for the health check (guardian/beat.py).
    command: celery -A guardian beat --loglevel=info --scheduler guardian.beat:HeartbeatDatabaseScheduler
    environment:
      - SECRET_KEY=${GUARDIAN_SECRET_KEY:?GUARDIAN_SECRET_KEY is required}
      - DATABASE_URL=${GUARDIAN_DATABASE_URL:-${DATABASE_URL}}
      - REDIS_URL=${GUARDIAN_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - CELERY_BROKER_URL=${GUARDIAN_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - CELERY_RESULT_BACKEND=${GUARDIAN_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Empty means the default in guardian/schedule.py. Read when beat
      # starts: restart guardian-beat after changing one.
      - GUARDIAN_SCHEDULE_SLA_CHECK=${GUARDIAN_SCHEDULE_SLA_CHECK:-}
      - GUARDIAN_SCHEDULE_ALERT_RULES=${GUARDIAN_SCHEDULE_ALERT_RULES:-}
      - GUARDIAN_SCHEDULE_RISK_SCORES=${GUARDIAN_SCHEDULE_RISK_SCORES:-}
      - GUARDIAN_SCHEDULE_REPORT_CLEANUP=${GUARDIAN_SCHEDULE_REPORT_CLEANUP:-}
      - GUARDIAN_SCHEDULE_HISTORY_CLEANUP=${GUARDIAN_SCHEDULE_HISTORY_CLEANUP:-}
      - GUARDIAN_SCHEDULE_ASSET_INVENTORY=${GUARDIAN_SCHEDULE_ASSET_INVENTORY:-}
      - GUARDIAN_SCHEDULE_OVERDUE_ASSESSMENTS=${GUARDIAN_SCHEDULE_OVERDUE_ASSESSMENTS:-}
      - GUARDIAN_SCHEDULE_EXPIRING_EXCEPTIONS=${GUARDIAN_SCHEDULE_EXPIRING_EXCEPTIONS:-}
      - GUARDIAN_SCHEDULE_USER_SCHEDULES=${GUARDIAN_SCHEDULE_USER_SCHEDULES:-}
      # Not used by the scheduler; passed so that an invalid value stops all
      # three guardian containers, not two of them (#676).
      - GUARDIAN_TEAM_MEMBERSHIP_MAX_AGE_DAYS=${GUARDIAN_TEAM_MEMBERSHIP_MAX_AGE_DAYS:-}
    depends_on:
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
      # guardian applies the migrations, django-celery-beat's tables
      # included; beat's own migrate is then a no-op.
      guardian:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      # The scheduler loop, not just the process: beat touches this file
      # after every tick (at least every 5 s), so a stale file means a beat
      # that is up but no longer scheduling anything.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.stat('/tmp/guardian-beat.heartbeat').st_mtime > 60)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s



  # Responder Service (Incident Response)
  responder:
    build:
      context: ./open-security-responder
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    container_name: open-security-responder
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8018:8018"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      # No DATABASE_URL: the responder has no SQL state. Its runs and its
      # worker queue are in Redis (REDIS_URL below). The variable that was
      # here named a `responder` database nothing creates, fell back to
      # identity's DATABASE_URL when unset, and so put a PostgreSQL password
      # in a container that opens no database connection (#654).
      #
      # Checked on the requests the responder receives, and sent, with the
      # identity of the user who started the run, on the requests its
      # playbooks make to the services below (#616). The playbook worker
      # runs in this container (scripts/entrypoint.sh), so it shares this
      # environment.
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      # The services the connectors call, directly on the internal network
      # as the agents service does. Without these every connector targeted
      # localhost inside this container (#616).
      - WILDBOX_API_URL=${RESPONDER_WILDBOX_API_URL:-http://open-security-tools:8000}
      - WILDBOX_DATA_URL=${RESPONDER_WILDBOX_DATA_URL:-http://open-security-data:8002}
      - WILDBOX_GUARDIAN_URL=${RESPONDER_WILDBOX_GUARDIAN_URL:-http://open-security-guardian:8013}
      - WILDBOX_AGENTS_URL=${RESPONDER_WILDBOX_AGENTS_URL:-http://open-security-agents:8006}
      - REDIS_URL=${RESPONDER_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/2}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      # condition: service_healthy, not bare start-order. Compose starts a
      # service as soon as its dependency's container exists, not when Postgres
      # accepts connections or Redis has loaded its AOF -- so the stack
      # converged by crash-looping, which made a real dependency failure
      # indistinguishable from ordinary startup churn (WILDBO-REL-04).
      # Redis only: the responder does not use PostgreSQL (#654).
      wildbox-redis:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 10s
      retries: 3



  # ============================================================================
  # CSPM Service (Cloud Security Posture Management)
  # ============================================================================
  cspm:
    build:
      context: ./open-security-cspm
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    # No container_name: a fixed name makes `docker compose up --scale`
    # fail outright, so the first scaling action an operator reaches for was
    # unavailable in the shipped configuration (WILDBO-SCAL-02). The gateway
    # resolves upstreams by *service* name through Docker's DNS, which load-
    # balances across replicas, so nothing depended on the fixed name.
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8019:8019"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      # cspm requires SECRET_KEY (min 32 chars); without it the service crashes
      # on startup with a pydantic "secret_key Field required" error.
      - SECRET_KEY=${CSPM_SECRET_KEY:?CSPM_SECRET_KEY is required}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - REDIS_URL=${CSPM_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      - CELERY_BROKER_URL=${CSPM_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      - CELERY_RESULT_BACKEND=${CSPM_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      # Encrypts cloud credentials before they are written to Redis, so they are
      # not recoverable from the AOF on the wildbox_redis_data volume
      # (WILDBO-SEC-02). Required: the service refuses to start a scan without it.
      - CSPM_CREDENTIAL_KEY=${CSPM_CREDENTIAL_KEY:?CSPM_CREDENTIAL_KEY is required}
      # Days a scan's metadata, team index entry and report are kept in Redis
      # (#591). The worker needs the same value.
      - CSPM_REPORT_RETENTION_DAYS=${CSPM_REPORT_RETENTION_DAYS:-90}
      # The time limit of one scan, in seconds (120 to 86400; the service
      # refuses to start otherwise). cspm-worker enforces it and gets as
      # long to stop.
      - SCAN_TIMEOUT_SECONDS=${CSPM_SCAN_TIMEOUT_SECONDS:-3600}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      wildbox-redis:
        condition: service_healthy
    networks:
      wildbox:
        aliases:
          # Keeps the hostname the gateway's upstreams use resolvable after
          # container_name was removed for scalability (WILDBO-SCAL-02).
          # A network alias round-robins across replicas; a container_name
          # cannot exist more than once.
          - open-security-cspm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8019/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CSPM Celery worker. cspm queues every scan, single or batch, as a task on
  # Redis db 3, and this is what runs it. It was commented out, so every scan
  # stayed queued forever and the compliance pages, the cloud security
  # overview and the reports never had data (#601).
  #
  # Same build as cspm, so the same image: the second build is all cache hits,
  # and the two images share every layer (Compose only labels each with its
  # service). Same settings too: it decrypts the credentials cspm encrypted
  # (CSPM_CREDENTIAL_KEY), writes the reports with the retention cspm reads
  # them with (CSPM_REPORT_RETENTION_DAYS) and enforces the scan time limit
  # (SCAN_TIMEOUT_SECONDS). Unit tests in open-security-cspm keep the builds
  # and the environments equal. Nothing connects to it, so it publishes no
  # port and needs no GATEWAY_INTERNAL_SECRET. No container_name, so it
  # scales: `docker compose up -d --scale cspm-worker=N`.
  cspm-worker:
    build:
      context: ./open-security-cspm
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    # Runs as the image's non-root user (cspm), like the API.
    # -Q: exactly the queues in app/worker.py TASK_QUEUES (a unit test
    # compares the two). --concurrency: scans run at the same time in this
    # container, each up to SCAN_TIMEOUT_SECONDS; see the cspm README before
    # raising it.
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=2 -Q celery
    # A stop lets the scans in progress finish (Celery's warm shutdown), and
    # none runs longer than its time limit. A scan killed earlier is not
    # acknowledged (task_acks_late), so Redis delivers it again later; it
    # then fails, since its credentials were deleted when it started.
    stop_grace_period: ${CSPM_SCAN_TIMEOUT_SECONDS:-3600}s
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      - SECRET_KEY=${CSPM_SECRET_KEY:?CSPM_SECRET_KEY is required}
      - REDIS_URL=${CSPM_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      - CELERY_BROKER_URL=${CSPM_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      - CELERY_RESULT_BACKEND=${CSPM_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/3}
      - CSPM_CREDENTIAL_KEY=${CSPM_CREDENTIAL_KEY:?CSPM_CREDENTIAL_KEY is required}
      - CSPM_REPORT_RETENTION_DAYS=${CSPM_REPORT_RETENTION_DAYS:-90}
      - SCAN_TIMEOUT_SECONDS=${CSPM_SCAN_TIMEOUT_SECONDS:-3600}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      wildbox-redis:
        condition: service_healthy
    networks:
      - wildbox
    healthcheck:
      # This worker, by node name, not any worker on the broker: the main
      # process answers even while every child is busy with a scan.
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Agents Service (Security Agents)
  agents:
    build:
      context: ./open-security-agents
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    container_name: open-security-agents
    restart: unless-stopped
    # Resource bound. Only postgres and redis used to carry one, so a
    # memory-hungry tool could consume the host and take the other
    # containers with it (WILDBO-OPS-02). Sized for ADR-001's 'Standard'
    # tier; raise via the prod overlay for larger deployments.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8006:8006"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      # Claude (Anthropic) — analysis is optional; the service starts without a
      # key and analysis tasks fail gracefully until one is set.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      - WILDBOX_API_URL=${WILDBOX_API_URL:-http://api:8000}  # Tools service endpoint
      # The services the agent's threat-intelligence and vulnerability tools
      # call, directly on the internal network as the responder's connectors
      # do. Neither was set, so both tools targeted localhost inside this
      # container (#652). Guardian is addressed by its container name, which
      # is in its ALLOWED_HOSTS. The two tools are given to the model only
      # when AGENT_TEAM_DATA_TOOLS, below, names them.
      - WILDBOX_DATA_URL=${AGENTS_WILDBOX_DATA_URL:-http://open-security-data:8002}
      - WILDBOX_GUARDIAN_URL=${AGENTS_WILDBOX_GUARDIAN_URL:-http://open-security-guardian:8013}
      # Tool calls carry the caller's gateway identity (X-Wildbox-* with
      # GATEWAY_INTERNAL_SECRET, above). INTERNAL_API_KEY, the fallback key the
      # client sent without one, is gone: the tools service stopped accepting
      # it in #566 (#567).
      #
      # Analysis submissions each user may make, and an optional ceiling for
      # a whole team (empty: none), in the `limits` notation. They were not
      # passed, so setting them in .env did nothing (#652). The service
      # refuses to start on a value it cannot parse. The counters are kept
      # in REDIS_URL below.
      - ANALYZE_RATE_LIMIT=${ANALYZE_RATE_LIMIT:-5/minute}
      - ANALYZE_TEAM_RATE_LIMIT=${ANALYZE_TEAM_RATE_LIMIT:-}
      # The team-data tools the model is given, comma-separated:
      # threat_intel_query_tool, vulnerability_search_tool. Empty, the
      # default, gives it neither, and the analysis runs on lookups of the
      # IOC alone. Opting in sends what the tool returns (the team's
      # indicators; the vulnerabilities Guardian records on its assets) to
      # the model provider, and puts it in the model's context beside text
      # fetched from the internet; see docs/guides/deployment.md before
      # setting it. Any other name stops the service at start.
      - AGENT_TEAM_DATA_TOOLS=${AGENT_TEAM_DATA_TOOLS:-}
      - REDIS_URL=${AGENTS_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/4}
      - CELERY_BROKER_URL=${AGENTS_CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/4}
      - CELERY_RESULT_BACKEND=${AGENTS_CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/4}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      wildbox-redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NOTE: Agents worker is now started by the entrypoint.sh script
  # in the main agents container, so no separate worker container needed.


  # ============================================================================
  # Sensor Service (System Monitoring)
  # ============================================================================
  sensor:
    build:
      context: ./open-security-sensor
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./open-security-shared
    container_name: open-security-sensor
    restart: unless-stopped
    # Stopping takes time: the collectors are stopped, the sender spends up
    # to 10 seconds on what it still holds, and the log positions are
    # written. Docker's default, 10 seconds, would kill it in the middle.
    # The sensor's own limits add up to 28 seconds at the worst, its last
    # writes included (open-security-sensor/sensor/core/stop_limits.py); the
    # other 2 are for its last log lines. Its tests fail if this is less
    # than that (#765, #777).
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    # No capability, as the sensor's README says and its standalone compose
    # file already did (#725). The sensor runs as uid 999, which has no
    # effective capability to begin with; this empties the bounding set too.
    # Checked in the built image: osquery's tables, the file monitor, the
    # log forwarder and the data volume behave the same with and without it.
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?set it in .env to production, or to development for a development stack}
      - SENSOR_LOGGING_LEVEL=${SENSOR_LOGGING_LEVEL:-INFO}
      # Enables the sensor's local API. Unset, _require_auth fails closed and
      # every route but /health answers 503, which left the sensor running and
      # unusable.
      - SENSOR_API_KEY=${SENSOR_API_KEY:?SENSOR_API_KEY is required}
      # Telemetry goes to the gateway's HTTPS listener, authenticated with a
      # personal API key (data:ingest scope) of the team member created for
      # the sensor; the gateway forwards it to the data service under that
      # member's team (#628). With no key the sensor runs and forwards
      # nothing. See open-security-sensor/README.md.
      - SENSOR_DATA_LAKE_ENDPOINT=${SENSOR_DATA_LAKE_ENDPOINT:-https://open-security-gateway}
      - SENSOR_DATA_LAKE_API_KEY=${SENSOR_DATA_LAKE_API_KEY:-}
      # The gateway's certificate, published by the gateway into the
      # gateway_cert volume below. `-`, not `:-`: an empty value selects the
      # system trust store, for a gateway with a publicly signed certificate.
      - SENSOR_DATA_LAKE_CA_BUNDLE=${SENSOR_DATA_LAKE_CA_BUNDLE-/etc/ssl/wildbox/wildbox.crt}
      # The sensor's name in the data service. It defaults to the hostname,
      # which in a container is its ID and changes when it is recreated:
      # each recreation would appear as a new sensor.
      - SENSOR_DATA_LAKE_SENSOR_ID=${SENSOR_DATA_LAKE_SENSOR_ID:-open-security-sensor}
      - PYTHONPATH=/app
      # No DEBUG or LOG_LEVEL: the sensor reads neither. Its log level is
      # SENSOR_LOGGING_LEVEL above (#665).
    volumes:
      - ./open-security-sensor/config.yaml.example:/etc/security-sensor/config.yaml:ro
      - sensor_logs:/var/log/security-sensor
      - sensor_data:/var/lib/security-sensor
      # The gateway's certificate, never its key: the gateway copies
      # wildbox.crt alone into this volume when it starts. Not a bind of
      # ./open-security-gateway/ssl/wildbox.crt, as automations has: that file
      # does not exist before the gateway's first start, and the sensor is
      # in the default stack, so the bind would fail a fresh `up`.
      - gateway_cert:/etc/ssl/wildbox:ro
      # Host monitoring (limited to safe read-only paths). Nothing of the
      # host's /etc, /bin, /usr/bin or /opt is mounted: the file monitor's
      # default paths (/host/etc...) do not exist here and it watches
      # nothing, which it says when it starts. To watch a host directory,
      # mount it read-only in an override file: see
      # open-security-sensor/README.md, "File integrity monitoring".
      - /proc/stat:/host/proc/stat:ro
      - /proc/meminfo:/host/proc/meminfo:ro
      - /proc/loadavg:/host/proc/loadavg:ro
      - /sys/class/net:/host/sys/class/net:ro
    networks:
      - wildbox
    depends_on:
      # Healthy, so its certificate is in gateway_cert before the sensor
      # validates its CA bundle.
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Automations Service (n8n workflow automation) — OPTIONAL.
  # Off by default; enable with `docker compose --profile automations up -d`.
  # Nothing depends on it and the gateway does not route to it (#714): its
  # workflows call the API outbound, through the gateway, and its editor is
  # reached on the loopback port below. Create n8n's owner account right
  # after the first start; see open-security-automations/README.md.
  automations:
    image: n8nio/n8n:1.74.0@sha256:18edccfb47c6cae9a193c5636662e1255f3aef0b484a10bb63bd2199f1ffc471
    container_name: open-security-automations
    profiles: ["automations"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Bind to localhost only: this port is the only way to n8n's editor.
      # n8n's own accounts protect the editor and the REST API, but not the
      # webhook endpoints (/webhook/*), which are unauthenticated by design,
      # and not the owner setup of an instance that has no owner yet --
      # exposing 0.0.0.0:5678 would let anyone on the network trigger
      # workflows, or claim a new instance. 127.0.0.1 keeps it reachable for
      # local admin (e.g. via an SSH tunnel) without exposing it to the
      # network; containers still reach it over the docker network by service
      # name. Matches tools-flower (also 127.0.0.1).
      - "127.0.0.1:5678:5678"
    environment:
      # No N8N_BASIC_AUTH_*: n8n 1.x has no basic auth and ignores them
      # (#714). The editor is protected by the owner account created on
      # first start.
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=UTC
      - N8N_LOG_LEVEL=info
      - WEBHOOK_URL=http://localhost:5678
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      - N8N_SECURE_COOKIE=true
      - N8N_METRICS=true
      # Read by the workflows in open-security-automations/workflows (#592).
      # They call the API through the gateway's HTTPS listener, with a
      # personal API key in X-API-Key; see open-security-automations/README.md.
      # The development certificate the gateway generates names
      # open-security-gateway and is trusted through NODE_EXTRA_CA_CERTS.
      - WILDBOX_API_GATEWAY_URL=${WILDBOX_API_GATEWAY_URL:-https://open-security-gateway}
      - WILDBOX_API_KEY=${AUTOMATIONS_WILDBOX_API_KEY:-}
      - NODE_EXTRA_CA_CERTS=/etc/ssl/wildbox/wildbox.crt
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - EXECUTIVE_REPORT_EMAIL_FROM=${EXECUTIVE_REPORT_EMAIL_FROM:-}
      - EXECUTIVE_REPORT_EMAIL_TO=${EXECUTIVE_REPORT_EMAIL_TO:-}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - ./open-security-automations/n8n-data:/home/node/.n8n
      # The gateway's certificate only, not its key, for NODE_EXTRA_CA_CERTS.
      # create_host_path: false, because the short form would create a
      # directory named wildbox.crt when the gateway has not written its
      # certificate yet, and the gateway would then fail to start. Start the
      # gateway once before this profile.
      - type: bind
        source: ./open-security-gateway/ssl/wildbox.crt
        target: /etc/ssl/wildbox/wildbox.crt
        read_only: true
        bind:
          create_host_path: false
    networks:
      - wildbox
    healthcheck:
      # The n8n image has no curl and its BusyBox wget is unreliable here; use
      # node (always present) to probe the /healthz liveness endpoint.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Scheduled backups (profile: backup)
  # ============================================================================
  # Nothing used to invoke backup_postgres.sh: no compose service, no CI job, no
  # Makefile target, no cron entry -- so the recovery point objective was
  # "whenever a human remembers" (WILDBO-DATA-05).
  #
  #   docker compose --profile backup up -d
  backup:
    # Must match the server major in the `postgres` service above: pg_restore
    # from a newer major can emit SQL the older server rejects, which turns a
    # restore drill into a surprise at the worst possible moment.
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      # This container is on the Compose network and has the client tools,
      # so the script connects directly. `make backup` on the host uses the
      # script's compose mode instead (#681).
      - BACKUP_MODE=host
      - POSTGRES_HOST=wildbox-postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_HOST=wildbox-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - BACKUP_DIR=/backups/postgres
      - BACKUP_RETENTION=${BACKUP_RETENTION:-30}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts:/scripts:ro
      - wildbox_backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache bash redis >/dev/null 2>&1 || true
        while true; do
          echo "[backup] starting run at $$(date -Iseconds)"
          bash /scripts/backup_postgres.sh || echo "[backup] FAILED"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wildbox

  # ============================================================================
  # Monitoring (profile: monitoring)
  # ============================================================================
  # The deployed stack contained no prometheus, grafana or alertmanager, so
  # nothing watched the system when nobody was looking at it, and every failure
  # was found by a human noticing something (WILDBO-OBS-04). The services now
  # expose Prometheus exposition format at /metrics.
  #
  #   docker compose --profile monitoring up -d
  prometheus:
    # 3.13 is the long-term support line (until 2027-07-31). 2.55.1, which
    # stood here, was the last 2.x release (November 2024) and gets no fixes:
    # the stored XSS in its web UI's heatmap (CVE-2026-44903) and the denial
    # of service through the remote-read endpoint (CVE-2026-42154) are fixed
    # in 3.5.3 and 3.11.3 only (#726). 3.x reads the TSDB of 2.55 as it is;
    # going back is possible to 2.55 and no earlier.
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The image's own flags, restated because `command` replaces them all,
    # plus the address this server is reached at: Prometheus writes it into
    # every alert as the link back to the expression that fired. Without it
    # the link names the container's ID. No --web.console.* flags: the 3.x
    # image ships no console templates, so the directories they named are
    # not there.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://127.0.0.1:9090}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      # Started, not healthy: with an Alertmanager that cannot start (an
      # invalid configuration file) Prometheus must still come up, because
      # its /alerts page is then the only place that says so
      # (WildboxAlertmanagerDown).
      alertmanager:
        condition: service_started
    networks:
      - wildbox
    healthcheck:
      # BusyBox wget, the only HTTP client in the image; it exits non-zero
      # when the server answers an error or does not answer. The URL is the
      # one scripts/lib/health_endpoints.sh and docs/guides/ports.md give.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus evaluated the alert rules and had nowhere to send them: no
  # Alertmanager existed and prometheus.yml had no `alerting:` section, so a
  # firing alert was a line on a page bound to 127.0.0.1 (#658).
  #
  # What this service does with an alert is decided by its configuration file.
  # The one shipped, monitoring/alertmanager.yml, routes everything to a
  # receiver named `no-notifications`: alerts are visible here and in
  # Prometheus, and nobody is told. To be told, point ALERTMANAGER_CONFIG_FILE
  # at a copy of monitoring/examples/alertmanager-email.yml or
  # alertmanager-webhook.yml (docs/guides/deployment.md, section 7).
  #
  # No secret reaches this service through `environment` or `command`:
  # Alertmanager expands neither in its configuration, and argv is readable by
  # anyone who can list processes. The configuration names files instead
  # (smtp_auth_password_file, url_file, credentials_file), which are read from
  # ALERTMANAGER_SECRETS_DIR at every notification.
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: ["monitoring"]
    restart: unless-stopped
    # The image's default user (nobody), stated so that it cannot become root
    # by an image change. Secret files must be readable by this UID.
    user: "65534:65534"
    # Nothing is written outside the data volume.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # The address the UI is reached at, for the links in notifications.
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://127.0.0.1:9093}
      # One instance: no gossip listener on 9094 for a cluster that does not
      # exist.
      - --cluster.listen-address=
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-./monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_SECRETS_DIR:-./monitoring/secrets}:/etc/alertmanager/secrets:ro
      # Silences and the notification log, so a restart neither forgets a
      # silence nor notifies again for what it already sent.
      - alertmanager_data:/alertmanager
    ports:
      # The UI and API have no authentication; localhost only, like
      # Prometheus. Reach it from elsewhere through an SSH tunnel.
      - "127.0.0.1:9093:9093"
    networks:
      - wildbox
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  wildbox_backups:
  prometheus_data:
  alertmanager_data:
  wildbox_redis_data:
  guardian_media:
  # Service-specific volumes
  sensor_logs:
  sensor_data:
  # The gateway's TLS certificate (no key), for the sensor to trust.
  gateway_cert:
