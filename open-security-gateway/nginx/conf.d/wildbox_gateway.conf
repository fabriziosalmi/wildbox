# Wildbox Security Gateway - Main Configuration
# Handles routing, authentication, and load balancing for all Wildbox services

# Upstream definitions for all Wildbox microservices
# Using resolver to handle dynamic service discovery
#
# keepalive_timeout 4s on every upstream (#609): nginx keeps an idle
# connection 60 s by default, while the services (uvicorn) close theirs
# after 5 s. A request written into a connection the service is closing
# fails -- nginx retries a GET on a fresh one, but not a POST, which got a
# 502. Below the services' timeout, nginx gives the connection up first.
resolver 127.0.0.11 valid=30s;

upstream identity_service {
    server open-security-identity:8001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 backup down;
    keepalive 32;
    keepalive_timeout 4s;
}

upstream data_service {
    server open-security-data:8002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8002 backup down;
    keepalive 32;
    keepalive_timeout 4s;
}

upstream cspm_service {
    server open-security-cspm:8019 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8019 backup down;
    keepalive 32;
    keepalive_timeout 4s;
}

upstream guardian_service {
    server open-security-guardian:8013 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8013 backup down;
    keepalive 32;
    keepalive_timeout 4s;
}

upstream responder_service {
    server open-security-responder:8018 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8018 backup down;
    keepalive 32;
    keepalive_timeout 4s;
}

upstream agents_service {
    server open-security-agents:8006 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8006 backup down;
    keepalive 32;
    keepalive_timeout 4s;
}

upstream api_service {
    server open-security-tools:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8000 backup down;
    keepalive 32;
    keepalive_timeout 4s;
}

upstream dashboard_service {
    server open-security-dashboard:3000 max_fails=3 fail_timeout=30s;
    server dashboard:3000 backup;
    # No host.docker.internal fallback here. nginx resolves every upstream
    # name when it loads the configuration and treats a failure as fatal,
    # and that name exists only under Docker Desktop -- so on Linux, CI
    # included, the gateway could not start at all:
    #   [emerg] host not found in upstream "host.docker.internal:3000"
    # It passed on macOS for exactly the same reason it failed everywhere
    # else. To proxy a dashboard running on the host, add the name with
    # extra_hosts in a local compose override instead.
    keepalive 32;
    keepalive_timeout 4s;
}

# ============================================================================
# EXCLUDED FROM v1.0 - ROADMAP FUTURE  
# ============================================================================
# upstream sensor_service {
#     server open-security-sensor:8004 max_fails=3 fail_timeout=30s;
#     server 127.0.0.1:8004 backup down;
#     keepalive 32;
# }

# No upstream for n8n (the optional "automations" compose profile): the
# gateway does not route to it (#714). See the note where its location was.

# HTTP to HTTPS redirect (Production security requirement)
# All traffic except health checks MUST use HTTPS
server {
    listen 80;
    server_name api.wildbox.local wildbox.local *.wildbox.local;

    # Health check endpoint (allow HTTP for load balancer checks)
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"wildbox-gateway","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # SECURITY: Force HTTPS for all other requests
    # This prevents authentication bypass via unencrypted HTTP
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# LEGACY HTTP SERVER — SECURITY HARDENED
# Previously this block exposed ALL API endpoints over unencrypted HTTP
# with inconsistent authentication, allowing auth bypass on multiple routes.
# Now all requests on port 8080 are rejected with a redirect to HTTPS.
server {
    listen 8080;
    server_name api.wildbox.local wildbox.local *.wildbox.local;

    # Health check (keep for load balancer probes over internal network)
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"wildbox-gateway","port":"8080-redirect-only"}';
        add_header Content-Type application/json;
    }

    # Reject ALL other requests — force HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# --- LEGACY HTTP/8080 ROUTES REMOVED (Security Fix) ---
# The original ~570 lines of HTTP/8080 location blocks have been removed.
# They exposed API endpoints with inconsistent authentication compared
# to the HTTPS/443 server block, enabling complete auth bypass.
# The full original content is preserved in git history.
# If you need to restore specific routes, add them to the HTTPS/443
# server block below with proper access_by_lua_file authentication.

# Main HTTPS server block
# Internal listener for service-to-gateway calls. Not published in
# docker-compose.yml, so only containers on the compose network reach it.
#
# identity used to call the purge endpoint at http://open-security-gateway/...,
# i.e. port 80, where everything but /health is a 301 to HTTPS: every purge got
# a 301, was logged and dropped, and a revoked token stayed authorised from the
# gateway's cache for up to AUTH_CACHE_TTL after logout (#475).
server {
    listen 8081;
    server_name _;

    set_by_lua_block $gateway_secret { return os.getenv("GATEWAY_INTERNAL_SECRET") or "" }

    include /etc/nginx/includes/internal_purge.conf;

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    # Default Host presented to upstreams; a location may override it (guardian).
    set $upstream_host $host;
    http2 on;
    server_name api.wildbox.local wildbox.local *.wildbox.local;

    # SSL Configuration
    ssl_certificate /etc/ssl/wildbox/wildbox.crt;
    ssl_certificate_key /etc/ssl/wildbox/wildbox.key;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Enhanced Security Headers (Blueprint Phase 1 - Gateway Hardening)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; object-src 'none'; media-src 'self'; frame-src 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    
    # Remove server identification
    more_clear_headers Server;
    server_tokens off;

    # Request methods and CORS. The method restriction used to be an `if`
    # here that answered 405 to everything but six methods, OPTIONS
    # included, so no CORS preflight was ever answered and a dashboard on
    # another origin could log in and do nothing else (#712). The include
    # keeps the restriction, answers a preflight from an origin listed in
    # CORS_ORIGINS, and labels the API's responses for that origin. The
    # test configuration includes the same file.
    include /etc/nginx/includes/cors.conf;

    # Global rate limiting
    limit_req zone=global burst=10 nodelay;
    limit_req_status 429;

    # Variables for dynamic routing (initialized by Lua)
    set $wildbox_user_id "";
    set $wildbox_team_id "";
    set $wildbox_role "";
    set $gateway_debug "false";

    # The path nginx chooses the location by, kept for auth_handler's scope
    # map. A `set` here runs before any location's own rewrite directives,
    # and those run before access_by_lua: by the time authenticate() reads
    # $uri, a location that rewrites it has already changed it, and the map
    # required the scope of the rewritten path (#647; the automations
    # location did, until it was removed in #714).
    set $wildbox_route_uri $uri;

    # Gateway-origin secret stamped onto every request the gateway
    # authenticated (see proxy_params). Backend services verify this so a
    # request reaching them directly (their ports are reachable) with forged
    # X-Wildbox-* headers is rejected — the client cannot supply it because
    # proxy_set_header overwrites any incoming value with this
    # server-controlled one. authenticate() copies $gateway_secret into
    # $wildbox_gateway_secret; a location that does not authenticate forwards
    # no secret at all (#664).
    set_by_lua_block $gateway_secret { return os.getenv("GATEWAY_INTERNAL_SECRET") or "" }
    set $wildbox_gateway_secret "";
    # The credential's type and scopes, for the services (#637). Filled in by
    # authenticate() only, like the secret above.
    set $wildbox_auth_type "";
    set $wildbox_scopes "";

    # Health check endpoint (no auth required)
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"wildbox-gateway","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Public endpoints (no authentication required)
    location /public/ {
        # Serve static content or documentation
        alias /var/www/public/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Dashboard authentication pages (no auth required) - must come before API endpoints
    location = /auth/login {
        # Exact match for login page
        proxy_pass http://dashboard_service;
        include /etc/nginx/includes/proxy_params.conf;
        include /etc/nginx/includes/dashboard_headers.conf;
    }
    
    location = /auth/signup {
        # Exact match for signup page
        proxy_pass http://dashboard_service;
        include /etc/nginx/includes/proxy_params.conf;
        include /etc/nginx/includes/dashboard_headers.conf;
    }
    
    # POST /auth/logout revokes the token at identity (WILDBO-AUTH-01); the GET
    # of the same path is the SPA's logout *page*. Split by method so both work.
    location = /auth/logout {
        if ($request_method = POST) {
            rewrite ^ /api/v1/auth/logout last;
        }

        # Exact match for logout page
        proxy_pass http://dashboard_service;
        include /etc/nginx/includes/proxy_params.conf;
        include /etc/nginx/includes/dashboard_headers.conf;
    }

    # User endpoints (identity service, requires auth) - use ^~ for precedence over regex
    # Internal rewrite target for the logout POST above.
    location = /api/v1/auth/logout {
        internal;
        proxy_pass http://identity_service/api/v1/auth/logout;
        include /etc/nginx/includes/proxy_params.conf;
        proxy_set_header Authorization $http_authorization;
    }

    location ^~ /auth/users/ {
        # Proxy to identity service with correct API path  
        proxy_pass http://identity_service/api/v1/users/;
        include /etc/nginx/includes/proxy_params.conf;
        # Identity validates the bearer token itself on these routes, so re-add
        # the header proxy_params.conf strips (WILDBO-AUTH-04).
        proxy_set_header Authorization $http_authorization;
    }
    
    # Authentication API endpoints (identity service, no gateway auth) - use ^~ for precedence
    location ^~ /auth/jwt/ {
        # Rate limiting for auth endpoints (brute-force protection)
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;

        # Proxy to identity service with correct API path
        proxy_pass http://identity_service/api/v1/auth/jwt/;
        include /etc/nginx/includes/proxy_params.conf;
        # Identity validates the bearer token itself on these routes, so re-add
        # the header proxy_params.conf strips (WILDBO-AUTH-04).
        proxy_set_header Authorization $http_authorization;
    }

    # Registration API endpoint (identity service, no gateway auth) - use ^~ for precedence
    location ^~ /auth/register {
        limit_req zone=auth burst=2 nodelay;
        limit_req_status 429;

        # Proxy to identity service with correct API path
        proxy_pass http://identity_service/api/v1/auth/register;
        include /etc/nginx/includes/proxy_params.conf;
        # Identity validates the bearer token itself on these routes, so re-add
        # the header proxy_params.conf strips (WILDBO-AUTH-04).
        proxy_set_header Authorization $http_authorization;
    }

    # Forgot password API endpoint (identity service, no gateway auth) - use ^~ for precedence
    location ^~ /auth/forgot-password {
        limit_req zone=auth burst=2 nodelay;
        limit_req_status 429;

        # Proxy to identity service with correct API path
        proxy_pass http://identity_service/api/v1/auth/forgot-password;
        include /etc/nginx/includes/proxy_params.conf;
        # Identity validates the bearer token itself on these routes, so re-add
        # the header proxy_params.conf strips (WILDBO-AUTH-04).
        proxy_set_header Authorization $http_authorization;
    }
    
    # Reset password API endpoint (identity service, no gateway auth) - use ^~ for precedence
    location ^~ /auth/reset-password {
        # Proxy to identity service with correct API path
        proxy_pass http://identity_service/api/v1/auth/reset-password;
        include /etc/nginx/includes/proxy_params.conf;
        # Identity validates the bearer token itself on these routes, so re-add
        # the header proxy_params.conf strips (WILDBO-AUTH-04).
        proxy_set_header Authorization $http_authorization;
    }

    # Public authentication pages (no auth required) - catch remaining auth pages
    location ~ ^/(login|register|signup)/ {
        # No authentication required for auth pages (but not API endpoints)
        proxy_pass http://dashboard_service;
        include /etc/nginx/includes/proxy_params.conf;
        include /etc/nginx/includes/dashboard_headers.conf;
    }
    
    # Hot-reload WebSocket of `next dev` (the stack docker-compose.yml starts).
    # It fell through to `location /`, which proxies without the upgrade
    # headers, and every handshake got a 404. A production build never opens
    # it, so in a deployment this location is simply unused.
    location ^~ /_next/hmr {
        proxy_pass http://dashboard_service;
        include /etc/nginx/includes/proxy_params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets (no auth required)
    #
    # Never under /api/ (the `(?!api/)`). A regex location outranks every
    # plain-prefix one, so without it any API path ending in one of these
    # extensions -- /api/v1/data/report.png, /api/v1/guardian/x.css, a tool
    # called x.js -- was taken from its own location and sent to the
    # dashboard, unauthenticated, and the service never saw it (#647). The
    # dashboard serves no asset under /api/.
    location ~ ^/(?!api/)(_next|favicon\.ico|.*\.(css|js|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico))$ {
        # No authentication required for static assets
        # Its own limit instead of the server-wide `global` one, which a
        # single page load exceeds; see the static_assets zone in nginx.conf.
        limit_req zone=static_assets burst=200 nodelay;

        proxy_pass http://dashboard_service;
        include /etc/nginx/includes/proxy_params.conf;
        
        # Cache static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dashboard (Next.js SPA) — intentionally NOT gateway-authenticated.
    # Browser navigations carry a cookie, not an `Authorization: Bearer` header,
    # so auth_handler (Bearer / API-key based) can't gate them and would block
    # the login page itself. The SPA enforces its own auth (middleware) and the
    # API calls it makes are authenticated at their own /api/* routes.
    # (Previously this used access_by_lua_file, which silently did nothing.)
    location / {
        # The dashboard (Next.js) sets its OWN Content-Security-Policy, which is
        # dev/prod-aware, so the gateway's must not be inherited here; see
        # includes/dashboard_headers.conf.
        include /etc/nginx/includes/dashboard_headers.conf;

        # Proxy to dashboard
        proxy_pass http://dashboard_service;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # API Routes - All require authentication

    # Identity Service API - Authentication endpoints (no auth required)
    location /api/v1/identity/auth/ {
        # No authentication required for auth endpoints
        proxy_pass http://identity_service/api/v1/auth/;
        include /etc/nginx/includes/proxy_params.conf;
        # Identity validates the bearer token itself on these routes, so re-add
        # the header proxy_params.conf strips (WILDBO-AUTH-04).
        proxy_set_header Authorization $http_authorization;
    }
    
    # Identity health probe, for the admin page's System Health card (#559).
    # identity serves it at /health, outside its /api/v1 tree, so the prefix
    # block below mapped /api/v1/identity/health to /api/v1/health, which does
    # not exist, and the card always showed identity Offline. Exact match, so
    # it wins over that block. Authenticated like the data service's probe:
    # it reports database and Redis status, which is for signed-in users only.
    location = /api/v1/identity/health {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://identity_service/health;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # Identity Service API - Other endpoints.
    # Identity is the auth authority: it authenticates the user itself from the
    # Bearer JWT. The gateway must NOT run auth_handler here — that strips the
    # Authorization header and injects X-Wildbox-* headers identity doesn't read,
    # producing a 401 even for valid tokens. Pass the request through unchanged;
    # identity enforces auth (and returns 401 itself for missing/invalid JWTs).
    # Since the gateway authenticated nobody here, it sends no X-Gateway-Secret
    # (proxy_params.conf): identity must not take the request for the gateway's
    # own, and none of its routes under /api/v1/ trusts that header (#664).
    location /api/v1/identity/ {
        proxy_pass http://identity_service/api/v1/;
        include /etc/nginx/includes/proxy_params.conf;
        # Identity validates the bearer token itself on these routes, so re-add
        # the header proxy_params.conf strips (WILDBO-AUTH-04).
        proxy_set_header Authorization $http_authorization;
    }

    # Data Service API (auth required). Path: /api/v1/data/<x> -> data /api/v1/<x>.
    #
    # Restored (WILDBO-ARCH-01): the dashboard's dataClient targets this prefix,
    # and while the block was commented out every one of those calls fell through
    # to the catch-all 404 at the bottom of this file.
    #
    # NOTE: authenticate() must be *called*. `access_by_lua_file auth_handler.lua`
    # only loads the module (it returns _M) and never invokes it, which is how
    # this route previously ran with no authentication at all.
    # Health probe: the data service serves it at /health, outside its /api/v1
    # tree. Exact-match location, so it wins over the prefix block below.
    location = /api/v1/data/health {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://data_service/health;
        include /etc/nginx/includes/proxy_params.conf;
    }

    location /api/v1/data/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://data_service/api/v1/;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # CSPM Service API (auth required). Path: /api/v1/cspm/<x> -> cspm /api/v1/<x>.
    # Restored (WILDBO-ARCH-01) for the same reason: cspmClient and the
    # cloud-security scans/compliance pages address this prefix.
    location /api/v1/cspm/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://cspm_service/api/v1/;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # Responder Service API (auth required). Path: /api/v1/responder/<x> -> responder /api/v1/<x>.
    # Restored (WILDBO-ARCH-01): responderClient and the /response pages use it.
    location /api/v1/responder/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        # The responder mounts its API at /v1/... (not /api/v1/...), and callers
        # address /api/v1/responder/v1/<x>, so strip only the gateway prefix.
        # /api/v1/responder/X -> /v1/X, the same shape the agents route uses.
        # This mapped to "/" instead, so the responder's real routes -- which
        # all live under /v1/ -- were only reachable as
        # /api/v1/responder/v1/playbooks. Every client and test that used the
        # obvious path got a 404 from a service that was running fine.
        proxy_pass http://responder_service/v1/;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # Guardian Service API (auth required)
    # JWT is validated by the gateway, which strips any client-supplied
    # X-Wildbox-* headers and injects trusted ones from the identity service.
    # The dashboard therefore no longer needs a browser-side Guardian API key
    # (#113). Path: /api/v1/guardian/<x> -> guardian /api/v1/<x>.
    #
    # NOTE: auth_handler.lua is a *module* (returns _M); `access_by_lua_file`
    # would only load it, never call authenticate() — i.e. no auth at all.
    # Must invoke authenticate() explicitly, as the tools/agents routes do.
    location /api/v1/guardian/ {
        # Guardian is the Django service, and Django validates the Host header
        # against ALLOWED_HOSTS before anything else runs. Forwarding the
        # client's Host meant every request that came through the gateway
        # arrived with a name guardian had never heard of, and Django answered
        # 400 DisallowedHost: guardian was unreachable through the gateway, on
        # every route, for every client.
        #
        # Presenting guardian its own name keeps ALLOWED_HOSTS tight -- it does
        # not have to enumerate every name the gateway may be reached by -- and
        # the caller's Host is still forwarded, as X-Forwarded-Host.
        set $upstream_host open-security-guardian;
        # Django builds absolute redirects from the Host it was given, so with
        # the line above APPEND_SLASH sent clients to
        # https://open-security-guardian/... -- an internal name they cannot
        # resolve, and a leak of the internal topology. Rewrite Location back to
        # the address the client actually used.
        proxy_redirect http://open-security-guardian/api/v1/ /api/v1/guardian/;
        proxy_redirect https://open-security-guardian/api/v1/ /api/v1/guardian/;
        proxy_redirect http://open-security-guardian/ /api/v1/guardian/;
        proxy_redirect https://open-security-guardian/ /api/v1/guardian/;
        # And the redirect a client meets most (#665): for a path without its
        # trailing slash, Django's APPEND_SLASH writes the path alone,
        # "/api/v1/assets/assets/", which none of the four lines above
        # matches. It went to the client as it was, and following it led to
        # this server's 404 for a path under /api/ that no location serves.
        proxy_redirect /api/v1/ /api/v1/guardian/;
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://guardian_service/api/v1/;
        include /etc/nginx/includes/proxy_params.conf;

        proxy_set_header X-Forwarded-Host $host;
        # proxy_redirect rewrites Location headers, not bodies, so the next
        # and previous links of a paginated list still read
        # https://open-security-guardian/api/v1/...: unusable, and the same
        # leak (#643). Guardian now writes them as relative references, and
        # this tells it the path its /api/v1 is served under here -- the one
        # part of the client's URL it cannot know. A literal, so it replaces
        # any X-Forwarded-Prefix the client sent: the client chooses nothing
        # in those links. It must be this location's path without the
        # trailing slash (a guardian unit test compares them). Guardian does
        # not read X-Forwarded-Host for them: $host is the Host the client
        # sent, and this server answers for any name.
        proxy_set_header X-Forwarded-Prefix /api/v1/guardian;
    }

    # Agents Service API - AI-powered threat intelligence.
    #
    # Authenticated by auth_handler.authenticate(), like every other route
    # (#630). This location used to carry its own copy of the authentication
    # in inline Lua, "for regex location compatibility", which it never
    # needed: the tools route below is a regex location and calls
    # authenticate(). The copy read X-API-Key only, so a JWT -- the
    # dashboard's session -- got 401 NO_API_KEY; it called identity at a
    # fixed address instead of IDENTITY_SERVICE_URL, cached nothing, did not
    # retry a connection identity had closed (#609), applied no rate limit
    # and no revocation marker but the API key's, and every later fix to
    # auth_handler had to be repeated here by hand. It also set the
    # X-Wildbox-* request headers but not $wildbox_user_id, $wildbox_team_id
    # and $wildbox_role, from which proxy_params.conf sets them again: they
    # were empty, nginx dropped the headers, and the service could not tell
    # who was calling.
    # What it did for a reason
    # -- the must-change-password refusal (#573), the API-key revocation
    # marker (#593), the tools:read / tools:execute scopes, stripping the
    # client's credentials and X-Wildbox-* headers before setting them from
    # identity's answer -- authenticate() does on every route.

    # The service's statistics live at /stats, outside its /v1 tree, so the
    # regex below mapped /api/v1/agents/stats to /v1/stats, which does not
    # exist. Exact match: it wins over the regex.
    location = /api/v1/agents/stats {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://agents_service/stats;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # Transforms /api/v1/agents/* to /v1/* on the backend (/v1/analyze).
    location ~ ^/api/v1/agents/(.*)$ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://agents_service/v1/$1$is_args$args;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # Security Tools API v1 (available to all authenticated users)
    # Transforms /api/v1/tools/* to /api/tools/* on the backend
    # The collection endpoint. The regex below requires a subpath, so
    # /api/v1/tools -- the list of tools, the first call any client makes --
    # fell through to the catch-all /api/ location and returned
    # {"error":"endpoint_not_found"}. /api/v1/tools/ was no better: it mapped to
    # /api/tools/ upstream, which answers 307.
    location = /api/v1/tools {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }
        proxy_pass http://api_service/api/tools$is_args$args;
        include /etc/nginx/includes/proxy_params.conf;
    }

    location ~ ^/api/v1/tools/(.*)$ {
        # Rate Limiting - DISABLED: investigating "zero size zone" error
        # limit_req zone=global burst=10 nodelay;
        # limit_req_status 429;
        
        # Authentication required - using inline block for regex location
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }
        
        # Transform path: /api/v1/tools/* -> /api/tools/*
        proxy_pass http://api_service/api/tools/$1$is_args$args;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # Asynchronous tool tasks (#567): /api/v1/tasks/* -> /api/tasks/* on the
    # tools service. POST /api/v1/tools/<name>/async submitted a task through
    # the block above, but nothing routed the task endpoints, so a caller could
    # never read the result, cancel the task or list their tasks.
    #
    # Their own prefix, not /api/v1/tools/tasks/: under /api/v1/tools/ the
    # segment after the prefix is a tool name, so "tasks" there would shadow,
    # or be shadowed by, a tool of that name (GET /api/v1/tools/tasks/info is
    # already "the info of a tool called tasks"). /api/v1/tasks/ is a separate
    # path on both sides of the proxy (/api/tasks/ upstream, beside
    # /api/tools/), so no tool name can reach it.
    #
    # Authenticated like the tools routes, and with the same API-key scopes
    # (auth_handler: tools:read to read and list, tools:execute to cancel). The
    # service answers only for tasks the caller submitted.
    location = /api/v1/tasks {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }
        proxy_pass http://api_service/api/tasks$is_args$args;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # ^~ so no regex location (the static-asset one matches any path ending
    # in .js or .css) takes a task path away from this block.
    location ^~ /api/v1/tasks/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }
        proxy_pass http://api_service/api/tasks/;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # /api/tools/, the deprecated alias of /api/v1/tools/ (WILDBO-API-05), was
    # removed after its announced sunset (1 July 2026) in #567; the catch-all
    # below answers it with 404.

    # The tools service's standalone web UI, served here until #581, is
    # removed: the dashboard's /toolbox lists the tools and /api/v1/tools/
    # runs them. /tools/ answers 404 here, explicitly. Without this block it
    # would fall to `location /` and reach the dashboard, and its asset-like
    # URLs to the static-asset regex above; `^~` keeps that regex out.
    # default_type, not add_header: an add_header here would drop the
    # server-level security headers for this location.
    location ^~ /tools/ {
        default_type application/json;
        return 404 '{"error":"endpoint_not_found","message":"The standalone tools UI was removed; use the dashboard toolbox or /api/v1/tools/"}';
    }

    # ============================================================================
    # EXCLUDED FROM v1.0 - ROADMAP FUTURE
    # ============================================================================
    # Sensor Service API - intentionally NOT routed in v1.0.
    # The sensor container runs and forwards telemetry to the data service
    # directly; it exposes no gateway-facing API in this release. The dashboard
    # has no sensorClient any more (removed in the same change), so nothing
    # addresses /api/v1/sensor/ and the catch-all 404 below is the correct
    # answer for it. Restore this block together with the sensor_service
    # upstream above if the API is exposed in a later release.
    # location /api/v1/sensor/ {
    #     access_by_lua_block {
    #         local auth_handler = require "auth_handler"
    #         auth_handler.authenticate()
    #     }
    #     proxy_pass http://sensor_service/api/v1/;
    #     include /etc/nginx/includes/proxy_params.conf;
    # }

    # Automations (n8n) - NOT routed, on purpose (#714).
    #
    # /api/v1/automations/ used to proxy to n8n's whole surface: its editor,
    # its REST API and its webhooks. n8n is a single-tenant tool with accounts
    # of its own, and the gateway serves many teams: every registered session
    # passed this location, whatever its team or role, and on an instance whose
    # owner account had not been created yet the first caller could create it
    # (POST /rest/owner/setup needs no credential until then) and with it run
    # code in a container that reaches every service. Header hygiene (#711)
    # does not make that safe, so the route is gone: the path falls to the
    # catch-all 404 below, with or without a credential.
    #
    # Nothing shipped needs an inbound path. The workflows in
    # open-security-automations/workflows start on a schedule and call the
    # API outbound, through this gateway, with an API key of their own. The
    # operator reaches n8n's editor on the port compose publishes on the
    # loopback interface (127.0.0.1:5678); see
    # open-security-automations/README.md.
    #
    # Do not restore this as it was. A workflow that needs an inbound webhook
    # needs a location for n8n's production webhook prefix only (/webhook/),
    # that does not call authenticate() -- it would send n8n the gateway's
    # secret -- and does not include proxy_params.conf; what authenticates
    # the caller is then the webhook's own authentication in n8n.

    # WebSocket endpoints for real-time features.
    # Browser WS handshakes can't carry an `Authorization: Bearer` header, so
    # auth_handler can't gate them; WS auth must be done at the app layer (token
    # in the connection params / cookie). Tracked separately.
    # (Was access_by_lua_file = no-op.)
    location /ws/ {
        proxy_pass http://dashboard_service;
        include /etc/nginx/includes/proxy_params.conf;

        # Override for WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache purge: see includes/internal_purge.conf. identity reaches it on the
    # internal listener below; kept here too so nothing that already calls it
    # over HTTPS breaks.
    include /etc/nginx/includes/internal_purge.conf;

    # Catch-all for undefined routes.
    # MUST be a plain-prefix location, not a regex (`~ ^/api/`): a regex
    # location outranks every plain-prefix location, so the regex form
    # shadowed the identity and guardian routes and made them all
    # return 404. As a plain prefix it only matches when no longer prefix
    # (e.g. /api/v1/guardian/) and no regex route (agents/tools) matches.
    location /api/ {
        return 404 '{"error":"endpoint_not_found","message":"The requested API endpoint does not exist"}';
        add_header Content-Type application/json;
    }
}
