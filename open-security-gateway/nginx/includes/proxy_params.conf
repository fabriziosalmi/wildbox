# Common proxy parameters for Wildbox services

proxy_http_version 1.1;
proxy_set_header Connection "";
# $upstream_host, not $host: a location that must present a different Host to
# its upstream (guardian, see below) overrides the variable with `set`. Adding a
# second `proxy_set_header Host` in the location instead makes nginx send both,
# joined by a comma -- Django then rejected
# "open-security-gateway,open-security-guardian" as not a valid domain name.
# The server block seeds it with `set $upstream_host $host;`.
proxy_set_header Host $upstream_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Pass authentication headers to backend services
# SECURITY: These headers MUST be set by Lua auth handlers (ngx.req.set_header),
# NOT read from client request ($http_*). Using nginx variables set by Lua
# ensures only gateway-validated values reach backend services.
# The Lua auth blocks call utils.clean_request_headers() to strip any
# client-supplied X-Wildbox-* headers before setting validated ones.
proxy_set_header X-Wildbox-User-ID $wildbox_user_id;
proxy_set_header X-Wildbox-Team-ID $wildbox_team_id;
proxy_set_header X-Wildbox-Role $wildbox_role;
# What the credential is and what it may do (#637): "session" or "api_key",
# and an API key's scopes. Set by authenticate() like the three above, so a
# service can check a scope the gateway already checked. Empty where the
# gateway authenticated nobody, or for the scopes of a session: nginx then
# sends no header, and the client's own is dropped either way.
proxy_set_header X-Wildbox-Auth-Type $wildbox_auth_type;
proxy_set_header X-Wildbox-Scopes $wildbox_scopes;
# Proof-of-origin: backends verify this matches GATEWAY_INTERNAL_SECRET. It
# vouches for a request the gateway authenticated, so it is sent only then:
# auth_handler.authenticate() copies the secret into $wildbox_gateway_secret
# once the caller is known, and the server block seeds it empty. On a
# location that does not authenticate (identity's passthrough, the
# dashboard) it stays empty, and nginx sends no X-Gateway-Secret at all --
# the client's own is replaced either way. It used to be $gateway_secret on
# every request, so an anonymous request through /api/v1/identity/ reached
# identity carrying the secret, and identity's admin metrics trusted it
# (#664).
proxy_set_header X-Gateway-Secret $wildbox_gateway_secret;

# Correlation id: generate one per request at the edge (nginx's $request_id) and
# forward it, so one operation can be followed across every service and into the
# workers (WILDBO-OBS-05). Services read X-Request-ID and only mint their own
# when it is absent.
proxy_set_header X-Request-ID $request_id;

# Strip the caller's bearer token (WILDBO-AUTH-04). The gateway has already
# validated it and forwards the trusted X-Wildbox-* identity headers instead, so
# a backend has no reason to hold a replayable credential. Identity's own
# /auth/users/ and /api/v1/identity/ routes DO need it -- those location blocks
# re-add it explicitly with `proxy_set_header Authorization $http_authorization;`.
proxy_set_header Authorization "";

# The caller's API key likewise (#711). authenticate() removes it on the
# routes it guards, but the locations that authenticate nobody -- the
# dashboard, identity's passthrough -- forwarded a client's X-API-Key as it
# came. Neither reads it: identity's own routes take the bearer token only.
proxy_set_header X-API-Key "";

# Timeout settings
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Buffer settings
proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 4k;
