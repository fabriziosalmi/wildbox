# Request methods and CORS, for a server block that serves the API (#712).
#
# Included at server level by the production configuration
# (conf.d/wildbox_gateway.conf) and by the test one
# (test/wildbox_gateway_test.conf), so that the two cannot disagree: the
# production configuration used to answer 405 to every OPTIONS request
# before any location ran, which left no CORS preflight ever answered, while
# the configuration the harness ran had no such rule and its CORS cases
# passed. The rules themselves are in lua/cors.lua.
#
# These directives run before any location is chosen:
#
#   $cors_allow_origin  the request's Origin when CORS_ORIGINS lists it and
#                       the request is for the API, else empty
#   $cors_request       "preflight" for a CORS preflight from a listed
#                       origin, "refused" for a method the gateway does not
#                       accept (any other OPTIONS included), else empty

set_by_lua_block $cors_allow_origin { return require("cors").allowed_origin() }
set_by_lua_block $cors_request { return require("cors").request_kind() }

# Only these methods reach a location (Blueprint Phase 1 requirement).
if ($cors_request = refused) {
    return 405 '{"error":"method_not_allowed","message":"HTTP method not supported","allowed":["GET","HEAD","POST","PUT","DELETE","PATCH"]}';
}

# A preflight is answered here: it carries no credentials, so it must not
# meet authenticate(), and no service has anything to say about it. The
# header filter below adds what the browser asked to know.
if ($cors_request = preflight) {
    return 204;
}

# Every response: the listed origin is named, the gateway's own refusals
# included; any CORS header a service set is replaced, so there is one
# authority and never two values; the API's responses vary on Origin.
header_filter_by_lua_block {
    require("cors").label_response()
}
