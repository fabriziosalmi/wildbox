# Gateway auth-cache purge, called by identity when a session is revoked or a
# user/API key is deactivated, so those changes apply at once instead of after
# the auth cache's TTL (WILDBO-AUTH-03).
#
# Included by the internal listener (port 8081, not published) -- which is the
# one identity calls -- and by the HTTPS server. Restricted to private ranges
# AND authenticated with the gateway's proof-of-origin secret.
location = /internal/gateway/purge-auth-cache {
    allow 127.0.0.0/8;
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    content_by_lua_block {
        local auth_handler = require "auth_handler"
        local utils = require "utils"

        local provided = ngx.var.http_x_gateway_secret or ""
        local expected = ngx.var.gateway_secret or ""
        if expected == "" or provided ~= expected then
            ngx.status = ngx.HTTP_FORBIDDEN
            ngx.header.content_type = "application/json"
            ngx.say((utils.json_encode({error = "forbidden"})))
            return ngx.exit(ngx.HTTP_FORBIDDEN)
        end

        local function bad_request(message)
            ngx.status = ngx.HTTP_BAD_REQUEST
            ngx.header.content_type = "application/json"
            ngx.say((utils.json_encode({error = message})))
            return ngx.exit(ngx.HTTP_BAD_REQUEST)
        end

        -- Bodies:
        --   {"users": [{"user_id": ..., "not_before": <epoch seconds>}],
        --    "ttl": <seconds>}                 end the sessions a user was
        --                                      issued up to not_before
        --                                      (password change, #569)
        --   {"memberships": [{"user_id": ..., "team_id": ...,
        --                     "not_before": <epoch seconds>}],
        --    "ttl": <seconds>}                 end, in that team only, the
        --                                      sessions a user was issued up
        --                                      to not_before (member removed
        --                                      from the team, #613)
        --   {"jtis": [...], "ttl": <seconds>}  revoke sessions by jti (logout)
        --   {"api_keys": [<key id>, ...], "ttl": <seconds>}
        --                                      revoke API keys by the id
        --                                      identity reports for them
        --                                      (#593)
        --   {"token": ..., "token_type": ...}   revoke one token given in full
        --   {}                                  flush every cached decision
        -- The answer counts what was revoked, so identity can tell a purge
        -- that took effect from one that did not (#571).
        ngx.req.read_body()
        local body = ngx.req.get_body_data()
        local payload = {}
        if body and body ~= "" then
            local decoded = utils.json_decode(body)
            if type(decoded) ~= "table" then
                return bad_request("invalid_json")
            end
            payload = decoded
        end

        local scope, revoked
        if payload.users ~= nil then
            local users = payload.users
            if type(users) ~= "table" or #users == 0 or #users > 100 then
                return bad_request("users must list 1 to 100 entries")
            end
            for _, entry in ipairs(users) do
                if type(entry) ~= "table"
                        or type(entry.user_id) ~= "string" or entry.user_id == ""
                        or #entry.user_id > 256
                        or type(entry.not_before) ~= "number" or entry.not_before <= 0 then
                    return bad_request("invalid user entry")
                end
            end
            revoked = auth_handler.revoke_user_sessions(users, payload.ttl)
            scope = "users"
        elseif payload.memberships ~= nil then
            local memberships = payload.memberships
            if type(memberships) ~= "table" or #memberships == 0 or #memberships > 1000 then
                return bad_request("memberships must list 1 to 1000 entries")
            end
            for _, entry in ipairs(memberships) do
                if type(entry) ~= "table"
                        or type(entry.user_id) ~= "string" or entry.user_id == ""
                        or #entry.user_id > 256
                        or type(entry.team_id) ~= "string" or entry.team_id == ""
                        or #entry.team_id > 256
                        or type(entry.not_before) ~= "number" or entry.not_before <= 0 then
                    return bad_request("invalid membership entry")
                end
            end
            revoked = auth_handler.revoke_team_sessions(memberships, payload.ttl)
            scope = "memberships"
        elseif payload.api_keys ~= nil then
            local api_keys = payload.api_keys
            if type(api_keys) ~= "table" or #api_keys == 0 or #api_keys > 1000 then
                return bad_request("api_keys must list 1 to 1000 ids")
            end
            for _, api_key_id in ipairs(api_keys) do
                if type(api_key_id) ~= "string" or api_key_id == "" or #api_key_id > 256 then
                    return bad_request("invalid api key id")
                end
            end
            revoked = auth_handler.revoke_api_keys(api_keys, payload.ttl)
            scope = "api_keys"
        elseif payload.jtis ~= nil then
            local jtis = payload.jtis
            if type(jtis) ~= "table" or #jtis == 0 or #jtis > 1000 then
                return bad_request("jtis must list 1 to 1000 ids")
            end
            for _, jti in ipairs(jtis) do
                if type(jti) ~= "string" or jti == "" or #jti > 256 then
                    return bad_request("invalid jti")
                end
            end
            revoked = auth_handler.revoke_jtis(jtis, payload.ttl)
            scope = "jtis"
        elseif type(payload.token) == "string" and payload.token ~= "" then
            auth_handler.purge_cache_entry(payload.token, payload.token_type, payload.ttl)
            revoked = 1
            scope = "token"
        else
            auth_handler.purge_all_cache()
            revoked = 0
            scope = "all"
        end

        -- json_encode returns (json, err): unparenthesized, ngx.say printed
        -- the nil error too, and the body ended in "nil", which identity
        -- cannot parse. The extra parentheses keep the first value only.
        ngx.status = ngx.HTTP_OK
        ngx.header.content_type = "application/json"
        ngx.say((utils.json_encode({purged = true, scope = scope, revoked = revoked})))
    }
}
