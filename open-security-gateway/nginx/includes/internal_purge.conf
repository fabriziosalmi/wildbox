# Gateway auth-cache purge, called by identity when a session is revoked or a
# user/API key is deactivated, so those changes apply at once instead of after
# the auth cache's TTL (WILDBO-AUTH-03).
#
# Included by the internal listener (port 8081, not published) -- which is the
# one identity calls -- and by the HTTPS server. Restricted to private ranges
# AND authenticated with the gateway's proof-of-origin secret.
location = /internal/gateway/purge-auth-cache {
    allow 127.0.0.0/8;
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    content_by_lua_block {
        local auth_handler = require "auth_handler"
        local utils = require "utils"

        local provided = ngx.var.http_x_gateway_secret or ""
        local expected = ngx.var.gateway_secret or ""
        if expected == "" or provided ~= expected then
            ngx.status = ngx.HTTP_FORBIDDEN
            ngx.header.content_type = "application/json"
            ngx.say(utils.json_encode({error = "forbidden"}))
            return ngx.exit(ngx.HTTP_FORBIDDEN)
        end

        ngx.req.read_body()
        local body = ngx.req.get_body_data()
        local purged_all = true
        if body then
            local payload = utils.json_decode(body)
            if payload and payload.token then
                auth_handler.purge_cache_entry(payload.token, payload.token_type)
                purged_all = false
            end
        end
        if purged_all then
            auth_handler.purge_all_cache()
        end

        ngx.status = ngx.HTTP_OK
        ngx.header.content_type = "application/json"
        ngx.say(utils.json_encode({purged = true, scope = purged_all and "all" or "token"}))
    }
}
