# Security headers for locations that serve dashboard (Next.js) pages.
#
# The HTTPS server declares its own Content-Security-Policy for the API. The
# dashboard sets one of its own, which differs between `next dev` (it needs
# 'unsafe-eval') and a production build. When a location declares no
# add_header at all it inherits the server's, the browser receives both
# policies, enforces both, and the stricter gateway one blocks the dashboard's
# scripts: the page renders "Loading..." and never hydrates.
#
# Declaring any add_header in a location stops that inheritance, so every
# dashboard page location includes this file: the other security headers are
# restated here, and the dashboard's own CSP (proxied from upstream) is the
# only one the browser sees.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
