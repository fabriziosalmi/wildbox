# Wildbox Security Gateway - Test Configuration
# Simplified config for the CI auth-test harness (see test/ci_auth_tests.sh):
# a single mock upstream (identity-test:8001, test/mock_identity.py) plays
# both the identity /internal/authorize role and the proxied backend, echoing
# requests back so tests can assert exactly which headers were forwarded.

resolver 127.0.0.11 valid=30s;

upstream identity_service {
    server identity-test:8001 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_timeout 4s;  # as in wildbox_gateway.conf (#609)
}

# NOTE: no limit_req_zone here — nginx.conf (http context) already defines
# the global/per_ip/auth zones, and redefining a zone name is a fatal
# duplicate-zone error at startup ("limit_req_zone \"auth\" is already
# bound"). Locations below reference the nginx.conf zones directly.

# Main server block
server {
    listen 80;
    server_name localhost;

    # Variables assigned by auth_handler.set_auth_headers(); assigning to an
    # undeclared nginx variable from Lua is a hard error, so declare them here
    # exactly like the production wildbox_gateway.conf does.
    set $wildbox_user_id "";
    set $wildbox_team_id "";
    set $wildbox_role "";
    set $gateway_debug "false";
    # The path the scope map reads, as in production (#647).
    set $wildbox_route_uri $uri;
    # What includes/proxy_params.conf reads, so the agents locations below
    # can include it as production does.
    set $upstream_host $host;
    set_by_lua_block $gateway_secret { return os.getenv("GATEWAY_INTERNAL_SECRET") or "" }
    # Filled in by authenticate() only, as in production (#664).
    set $wildbox_gateway_secret "";

    # Request methods and CORS, the file production includes (#712).
    include /etc/nginx/includes/cors.conf;
    # The credential's type and scopes, for the services (#637). Filled in by
    # authenticate() only, like the secret above.
    set $wildbox_auth_type "";
    set $wildbox_scopes "";

    client_max_body_size 10M;
    proxy_buffering off;
    proxy_request_buffering off;

    # Health check endpoint (unauthenticated)
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Public login route (mirrors the production /auth/jwt/ path).
    location /auth/jwt/ {
        proxy_pass http://identity_service/api/v1/auth/jwt/;
        proxy_set_header Host $host;
    }

    # Identity service routes (authentication required)
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;

        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://identity_service/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Tools-style route (authentication + API-key scope enforcement):
    # exercises required_scope_for_request's tools:read / tools:execute
    # mapping and scopes_satisfy's hierarchy against the mock echo backend.
    location /api/v1/tools/ {
        limit_req zone=global burst=20 nodelay;

        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://identity_service/api/v1/tools/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # A tools route with the path the scope map reads emptied (#647): what a
    # configuration that does not declare $wildbox_route_uri looks like to
    # auth_handler. The path is then unknown, and the map treats it as
    # unmapped rather than guess from $uri -- which here is under
    # /api/v1/tools, so a guess would require tools:read or tools:execute.
    location /api/v1/tools/unrouted/ {
        set $wildbox_route_uri "";

        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://identity_service/api/v1/tools/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # The agents routes, as wildbox_gateway.conf defines them (#630): a
    # regex location authenticated by authenticate(), with the path mapped
    # to the service's /v1 tree, and the exact /stats location beside it.
    # Both include proxy_params.conf, as production does: it forwards the
    # caller's identity from $wildbox_user_id, $wildbox_team_id and
    # $wildbox_role, which only authenticate() sets. The inline Lua this
    # route used to have set none of them, so the service got no
    # X-Wildbox-* headers whatever the credential.
    location = /api/v1/agents/stats {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }
        proxy_pass http://identity_service/stats;
        include /etc/nginx/includes/proxy_params.conf;
    }

    location ~ ^/api/v1/agents/(.*)$ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }
        proxy_pass http://identity_service/v1/$1$is_args$args;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # Identity's passthrough, as wildbox_gateway.conf defines it: no
    # authenticate(), identity reads the bearer token itself, and
    # proxy_params.conf included as production does. The gateway must not
    # vouch for these requests: no X-Gateway-Secret reaches identity, and a
    # client's own is dropped (#664).
    location /api/v1/identity/ {
        proxy_pass http://identity_service/api/v1/;
        include /etc/nginx/includes/proxy_params.conf;
        proxy_set_header Authorization $http_authorization;
    }

    # Data-style route (#628): the sensor's ingest path and its data:ingest
    # scope, against the mock echo backend.
    location /api/v1/data/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://identity_service/api/v1/data/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # Guardian- and automations-style routes, against the mock echo backend:
    # the scopes no other route here requires (data:read, data:write and
    # data:delete by method; tools:admin), for the scope hierarchy's table
    # (test/scope_vector_tests.sh, #637).
    location /api/v1/guardian/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://identity_service/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location /api/v1/automations/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }

        proxy_pass http://identity_service/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # A location that names a kind of upstream authenticate() does not know
    # (#711): a typo for "third_party". It must not be read as a backend,
    # which would hand the upstream the gateway's secret; it is a 500.
    location /api/v1/tools/unknown-upstream/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate({ upstream = "thirdparty" })
        }

        proxy_pass http://identity_service/api/v1/tools/;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # And one that names it: the automations location of
    # wildbox_gateway.conf, against the mock echo backend.
    location /api/v1/tools/third-party/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate({ upstream = "third_party" })
        }

        proxy_pass http://identity_service/api/v1/tools/;
        include /etc/nginx/includes/proxy_params.conf;
    }

    # The asynchronous task routes, as wildbox_gateway.conf defines them
    # (#567): the path mapping to the service's /api/tasks and the
    # tools:read / tools:execute scopes for reading and cancelling.
    location = /api/v1/tasks {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }
        proxy_pass http://identity_service/api/tasks$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location ^~ /api/v1/tasks/ {
        access_by_lua_block {
            local auth_handler = require "auth_handler"
            auth_handler.authenticate()
        }
        proxy_pass http://identity_service/api/tasks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # The removed standalone tools UI, as wildbox_gateway.conf answers it
    # (#581): an explicit 404 before any authentication.
    location ^~ /tools/ {
        default_type application/json;
        return 404 '{"error":"endpoint_not_found","message":"The standalone tools UI was removed; use the dashboard toolbox or /api/v1/tools/"}';
    }

    # Public authentication routes (no auth required)
    location /api/v1/auth/login {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://identity_service/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/register {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://identity_service/api/v1/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all for undefined routes
    location / {
        return 404 '{"error": "Not Found", "message": "Route not found in test gateway"}';
        add_header Content-Type application/json;
    }
}

# Internal listener, as in wildbox_gateway.conf: the auth-cache purge identity
# calls on logout. The harness publishes it on the loopback only, so the
# revocation tests can play identity's part (#571).
server {
    listen 8081;
    server_name _;

    set_by_lua_block $gateway_secret { return os.getenv("GATEWAY_INTERNAL_SECRET") or "" }

    include /etc/nginx/includes/internal_purge.conf;

    location / {
        return 404;
    }
}
