# OpenResty/Nginx Configuration for Wildbox Security Gateway
# Performance-optimized for high-throughput API traffic

user nginx;  # Worker processes run as non-root
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Export env vars to worker processes so Lua's os.getenv() can read them.
# Without this the gateway sends an empty X-Gateway-Secret to identity and all
# authorization fails with 403 "Invalid gateway secret".
#
# Every variable the gateway's Lua reads with os.getenv() must be listed here;
# scripts/check_gateway_config.py fails CI when one is not (#627).
env GATEWAY_INTERNAL_SECRET;
env IDENTITY_SERVICE_URL;
env AUTH_CACHE_TTL;
# Per-team request budget (auth_handler.lua). A value that is not a positive
# integer stops the gateway from starting.
env RATE_LIMIT_PER_HOUR;
# The origins whose pages may call the API from a browser (lua/cors.lua).
# An entry that is not an origin stops the gateway from starting.
env CORS_ORIGINS;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Add custom Lua module path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Idle connections Lua keeps to services (the /internal/authorize calls
    # to identity) are given up after 4 s, below the 5 s after which
    # uvicorn closes them: past it, a call could be written into a
    # connection identity was closing, fail with "broken pipe" or
    # "connection reset", and the request got a 503 (#609). utils.lua sets
    # the same per call; this covers every other cosocket.
    lua_socket_keepalive_timeout 4s;
    
    include       mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    #
    # The access log names the path of a request, not its query string. The
    # two formats below used "$request", the request line as the client sent
    # it: every search term, indicator and filter, and any token a client
    # put in a query string, went to a file that is kept, rotated and read
    # by more people than the request was meant for (#755). $request_path is
    # the URI the client asked for, cut at the first "?". Not $uri: that is
    # the path after the location's rewrite, which is not what was asked.
    # "$http_referer" went with it: a referer is a URL with a query of its
    # own.
    map $request_uri $request_path {
        default            $request_uri;
        "~^(?<p>[^?]*)[?]" $p;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Enhanced log format for API gateway. ua/us say which upstream answered
    # and with what (a comma-separated list when nginx tried more than one);
    # both are "-" when the gateway answered itself, as an access-phase Lua
    # refusal does. rid is the X-Request-ID forwarded to the services (#609).
    log_format gateway '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $request_path $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rid=$request_id ua="$upstream_addr" us="$upstream_status" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'team_id="$sent_http_x_wildbox_team_id" '
                      'user_id="$sent_http_x_wildbox_user_id"';

    access_log /var/log/nginx/access.log gateway;

    # Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer Settings for High Traffic
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Proxy Settings
    proxy_buffer_size 4k;
    proxy_buffers 16 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        text/css
        text/javascript
        text/xml
        text/plain;

    # Rate limiting zones, per client address ($binary_remote_addr, the
    # address of the connection: no header a client sends moves a request
    # to another counter). The per-team limit is Lua's (auth_handler.lua).
    #
    #   global         everything that has no zone of its own: 100 r/s
    #   auth           login, registration, forgotten password:  5 r/s
    #   static_assets  the dashboard's static assets:          500 r/s
    #
    # The static assets have a zone of their own because a page load fetches
    # its JavaScript chunks all at once -- dozens under `next dev`, more than
    # ten in a production build -- and under the server-wide `global` limit
    # (burst 10) every chunk past the eleventh got a 429, so the page never
    # hydrated and no one could sign in (#103). The assets are public and
    # cacheable; the zone only stops a single address from hammering them.
    #
    # The zones are not defined in this file. limit_req_zone takes its rate
    # as a literal, so scripts/render_rate_limits.sh writes them when the
    # container starts, with the rates above unless the operator set
    # GATEWAY_RATE_LIMIT_PER_SECOND, GATEWAY_AUTH_RATE_LIMIT_PER_SECOND or
    # GATEWAY_STATIC_RATE_LIMIT_PER_SECOND (#756). If nginx stops at the next
    # line with "open() ... failed", the container was not started by this
    # repository's entrypoint: the image is older than this configuration
    # and has to be rebuilt (docker compose build gateway).
    include /run/wildbox-gateway/limit_req_zones.conf;

    # No limit_conn_zone: the "addr" zone that was defined here was named by
    # no limit_conn, so it limited nothing and held 10 MB of shared memory
    # (#776). The gateway does not limit connections per address.

    # Shared memory zones for rate limiting and caching
    lua_shared_dict auth_cache 10m;           # JWT/API key validation cache
    # Revocation markers and the purge generation (auth_handler.lua, #571).
    # Separate from auth_cache so a full flush cannot erase them. A marker is
    # well under 200 bytes: tens of thousands of revoked sessions fit.
    lua_shared_dict auth_revoked 4m;
    lua_shared_dict rate_limit_cache 10m;     # Rate limiting counters
    lua_shared_dict config_cache 1m;          # Gateway configuration cache

    # CORS is decided in lua/cors.lua and applied by includes/cors.conf,
    # which the server blocks that serve the API include. The allowlist is
    # CORS_ORIGINS (declared with `env` above); it used to be a map written
    # here, localhost only, that no setting reached (#712).

    # Initialize Lua modules
    init_by_lua_block {
        -- Load utility functions
        require "utils"
        -- Validates RATE_LIMIT_PER_HOUR as it loads and raises on a bad
        -- value, which stops nginx here rather than serving with a limit
        -- the operator did not set (#627).
        require "auth_handler"
        -- Validates CORS_ORIGINS as it loads and raises on an entry that is
        -- not an origin, which stops nginx here (#712).
        require "cors"
        
        -- NOTE: do NOT pre-seed config_cache here. Gateway configuration
        -- (incl. GATEWAY_INTERNAL_SECRET) is built lazily from environment
        -- variables in auth_handler.get_config() on the first request; a
        -- partial config without `gateway_secret` would shadow that build and
        -- make the gateway send an empty X-Gateway-Secret to identity.
        
        ngx.log(ngx.INFO, "Wildbox Security Gateway initialized")
    }

    # Proxy Cache Configuration
    proxy_cache_path /var/cache/nginx/wildbox_cache levels=1:2 keys_zone=wildbox_cache:100m 
                     max_size=1g inactive=60m use_temp_path=off;

    # Include service-specific configurations
    include /etc/nginx/conf.d/*.conf;
}
