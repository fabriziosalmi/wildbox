# OpenResty/Nginx Configuration for Wildbox Security Gateway
# Performance-optimized for high-throughput API traffic

user nginx;  # Worker processes run as non-root
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Export env vars to worker processes so Lua's os.getenv() can read them.
# Without this the gateway sends an empty X-Gateway-Secret to identity and all
# authorization fails with 403 "Invalid gateway secret".
env GATEWAY_INTERNAL_SECRET;
env IDENTITY_SERVICE_URL;
env AUTH_CACHE_TTL;
env GATEWAY_DEBUG;
env N8N_BASIC_AUTH_USER;
env N8N_BASIC_AUTH_PASSWORD;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Add custom Lua module path
    lua_package_path "/etc/nginx/lua/?.lua;;";
    
    include       mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Enhanced log format for API gateway
    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'team_id="$sent_http_x_wildbox_team_id" '
                      'user_id="$sent_http_x_wildbox_user_id"';

    access_log /var/log/nginx/access.log gateway;

    # Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer Settings for High Traffic
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Proxy Settings
    proxy_buffer_size 4k;
    proxy_buffers 16 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        text/css
        text/javascript
        text/xml
        text/plain;

    # Rate Limiting Zones
    # Basic rate limiting - team-based limiting will be handled by Lua
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Connection Limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

        # Shared memory zones for rate limiting and caching
    lua_shared_dict auth_cache 10m;           # JWT/API key validation cache
    lua_shared_dict rate_limit_cache 10m;     # Rate limiting counters
    lua_shared_dict config_cache 1m;          # Gateway configuration cache

    # CORS (must be in http context).
    #
    # The dashboard talks to the gateway with credentialed requests
    # (cookies / Authorization). A credentialed CORS response must echo the
    # SPECIFIC requesting origin, never "*", and doing so for an arbitrary
    # origin would let any site make authenticated calls on a logged-in
    # user's behalf. So $cors_allow_origin is an ALLOWLIST keyed on the
    # request Origin: an origin that is not listed gets an empty value, and
    # no Access-Control-Allow-Origin header is emitted (the browser then
    # blocks the cross-origin response, which is the safe default).
    #
    # Same-origin deployments (dashboard served by this gateway) need none of
    # this. Add your dashboard origin below for split-origin deployments.
    map $http_origin $cors_allow_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$"      $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$"  $http_origin;
        # "https://dashboard.example.com"      $http_origin;
    }

    # Allowed request headers and methods for CORS (fixed policy).
    map $http_origin $cors_allow_headers {
        default "";
        "~."  "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,X-Wildbox-Team-ID,X-API-Key";
    }

    # Initialize Lua modules
    init_by_lua_block {
        -- Load utility functions
        require "utils"
        require "auth_handler"
        
        -- NOTE: do NOT pre-seed config_cache here. Gateway configuration
        -- (incl. GATEWAY_INTERNAL_SECRET) is built lazily from environment
        -- variables in auth_handler.get_config() on the first request; a
        -- partial config without `gateway_secret` would shadow that build and
        -- make the gateway send an empty X-Gateway-Secret to identity.
        
        ngx.log(ngx.INFO, "Wildbox Security Gateway initialized")
    }

    # Proxy Cache Configuration
    proxy_cache_path /var/cache/nginx/wildbox_cache levels=1:2 keys_zone=wildbox_cache:100m 
                     max_size=1g inactive=60m use_temp_path=off;

    # Include service-specific configurations
    include /etc/nginx/conf.d/*.conf;
}
