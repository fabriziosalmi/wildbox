version: '3.8'

# Development configuration for Wildbox Gateway
# Includes additional debugging and development tools

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wildbox-gateway-dev
    restart: unless-stopped
    # Loopback only, like docker-compose.yml in this directory: this is a
    # debugging stack with GATEWAY_DEBUG on and a mock identity behind it.
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8080:8080"  # Additional debug port
    volumes:
      - ./nginx:/etc/nginx
      - ./logs:/var/log/nginx
      - ./ssl:/etc/ssl/wildbox:ro
      - nginx_cache:/var/cache/nginx
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - WILDBOX_ENV=development
      - GATEWAY_LOG_LEVEL=debug
      - GATEWAY_DEBUG=true
    networks:
      - wildbox-net
    depends_on:
      - redis
      - mock-identity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Redis for caching (development settings)
  redis:
    image: redis:7-alpine
    container_name: wildbox-gateway-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --loglevel debug
    ports:
      - "127.0.0.1:6379:6379"  # Expose for debugging (no password: loopback only)
    volumes:
      - redis_data:/data
    networks:
      - wildbox-net

  # Mock identity service for testing
  mock-identity:
    image: nginx:1.30-alpine
    container_name: wildbox-mock-identity
    volumes:
      - ./test/mock-identity.conf:/etc/nginx/conf.d/default.conf:ro
      - ./test/mock-responses:/usr/share/nginx/html:ro
    networks:
      - wildbox-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # No log aggregator here: `docker compose -f docker-compose.dev.yml logs -f`
  # follows every container. The logspout container that stood here mounted
  # /var/run/docker.sock, which is root on the host for whatever runs in the
  # container (":ro" restricts the socket file, not the Docker API), and it
  # shipped to a syslog host that this file never defined (#680).

volumes:
  nginx_cache:
    driver: local
  redis_data:
    driver: local

networks:
  wildbox-net:
    external: false
