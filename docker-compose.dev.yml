# Docker Compose DEVELOPMENT overlay
#
# Renamed from docker-compose.override.yml. Compose applies a file with that name
# automatically, with no flag, so this development configuration was merged into
# EVERY deployment started with `docker-compose up` -- including production
# restarts, which then also dropped the prod overlay's restart: always, log
# rotation and resource limits (WILDBO-OPS-01).
#
# It is now opt-in and named in the command:
#
#     make start        # base + this file
#     make start-prod   # base + docker-compose.prod.yml
#
# Extends the main docker-compose.yml with development-specific settings

services:
  # API Service with development integration settings  
  api:
    environment:
      # Enable CORS for development (comma-separated string)
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,https://wildbox.local
      - CORS_ALLOW_CREDENTIALS=true
      # No addresses of other services: they were for the health-aggregate
      # route, removed in #646, and the tools service reads none of them
      # (#721).
      # Development settings
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source for hot reload
      - ./open-security-tools/app:/app/app:ro

  # ============================================================================
  # Data Service - ACTIVE for Phase 1 Infrastructure Stabilization
  # ============================================================================
  data:
    environment:
      - CORS_ENABLED=true
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,https://wildbox.local
      # This overlay is a development stack, so say so: .env from
      # generate_secrets.py sets ENVIRONMENT=production, and data refuses
      # DEBUG=true outside development ("DEBUG must be False"), so
      # `make start` left it crash-looping.
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # CRITICAL: Force correct PostgreSQL password from .env
      - DATABASE_URL=${DATA_DATABASE_URL:?DATA_DATABASE_URL is required}
    volumes:
      - ./open-security-data/app:/app/app:ro

  data-scheduler:
    environment:
      # As for data above: this overlay turns DEBUG on, and the scheduler
      # loads the same configuration, which refuses DEBUG anywhere but in
      # development. Without this line `make start` left it crash-looping
      # with the generated .env (#736).
      - ENVIRONMENT=development
      # CRITICAL: Align with Data service and .env password
      - DATABASE_URL=${DATA_DATABASE_URL:?DATA_DATABASE_URL is required}
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  # Dashboard with development settings (if running in Docker)
  dashboard:
    build:
      context: ./open-security-dashboard
      dockerfile: Dockerfile.dev
    container_name: open-security-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"  # For Next.js HMR
    environment:
      # The per-service NEXT_PUBLIC_*_API_URL and NEXTAUTH_* variables that
      # used to follow are read by nothing: the dashboard calls the gateway
      # (#559, #665).
      - NODE_ENV=development
    # No `volumes:` here: docker-compose.yml already bind-mounts src/ and
    # public/. Mounting the whole checkout over /app made next dev fail with
    # EACCES on next-env.d.ts unless the checkout was owned by uid 1001.
    networks:
      - wildbox
    depends_on:
      - api
      # data  # EXCLUDED FROM v1.0
      - identity
    command: npm run dev

networks:
  wildbox:
    external: false
