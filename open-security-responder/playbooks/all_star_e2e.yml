---
playbook_id: "all_star_e2e"
name: "🌟 All-Star Cross-Service Integration Test"
description: |
  End-to-end playbook that reaches every Wildbox service the responder has a
  connector for: Agents, Tools and Guardian.

  For a valid IP address it:
  - submits the address to the Agents service for AI analysis;
  - scans its common ports and queries threat intelligence (Tools service);
  - records a vulnerability in Guardian when the address is a known threat or
    exposes more than two services;
  - compiles a report of every step.

  Every call is made as the user who ran the playbook. Guardian records the
  vulnerability against the asset it knows by that address, and lets owners
  and admins create vulnerabilities: for an address that is not a Guardian
  asset, or a run started by a member, that step fails and the run carries
  on.

  The AI analysis runs asynchronously: the Agents service answers with a task
  (`task_id`, `result_url`), not a verdict, so the assessment does not wait
  for it. The finding cites the task, where the verdict can be read.

  An address that is not valid ends the run after validation, completed.

version: "1.2"
author: "Wildbox Security Team"
tags: ["integration", "e2e", "all-star"]

trigger:
  type: "api"
  description: "Manual execution via API with IP address"
  required_parameters:
    - ip

steps:
  # Step 1: Validate IP format
  - id: "validate_ip"
    name: "Validate IP Address"
    action: "system.validate"
    description: "Ensure IP address is properly formatted"
    input:
      type: "ip_address"
      value: "{{ trigger.ip }}"
    timeout: 5

  # Step 2: AI-Powered IOC Analysis (Agents Service)
  - id: "ai_analysis"
    name: "🤖 AI-Powered Threat Analysis"
    action: "wildbox.analyze_ioc"
    description: "Submit the IP to the Agents service for AI analysis"
    # The Agents service takes the IOC and a priority, nothing else
    # (AnalysisTaskRequest). The task it queues belongs to the user who ran
    # the playbook, who reads its verdict from the task's result_url.
    input:
      ioc_type: "ipv4"
      ioc_value: "{{ trigger.ip }}"
      priority: "normal"
    condition: "steps.validate_ip.output.valid"
    timeout: 60
    on_failure: "continue"

  # Step 3: Port Scan (Tools Service)
  - id: "port_scan"
    name: "🔍 Network Port Scan"
    action: "wildbox.run_tool"
    description: "Scan common ports to identify exposed services"
    input:
      tool_name: "port_scanner"
      params:
        target: "{{ trigger.ip }}"
        ports: [21, 22, 80, 443, 3389, 8080]
        scan_type: "tcp"
    condition: "steps.validate_ip.output.valid"
    timeout: 120
    on_failure: "continue"

  # Step 4: Threat Intelligence (Tools Service)
  - id: "threat_intel"
    name: "📋 Threat Intelligence"
    action: "wildbox.run_tool"
    description: "Score the address against threat intelligence sources"
    input:
      tool_name: "threat_intelligence_aggregator"
      params:
        indicator: "{{ trigger.ip }}"
        indicator_type: "ip"
    condition: "steps.validate_ip.output.valid"
    timeout: 30
    on_failure: "continue"

  # Step 5: Threat Assessment
  #
  # A step that failed under on_failure: continue is in the context with
  # `output: none`, so each signal checks for an output before reading it.
  - id: "threat_assessment"
    name: "⚖️ Aggregate Threat Assessment"
    action: "system.evaluate"
    description: "Flag the address when any signal holds"
    input:
      conditions:
        known_threat: >-
          {{ steps.threat_intel.output is not none
             and steps.threat_intel.output.overall_threat_score >= 70 }}
        exposed_services: >-
          {{ steps.port_scan.output is not none
             and steps.port_scan.output.open_ports | length > 2 }}
      min_true: 1
    condition: "steps.validate_ip.output.valid"
    timeout: 10

  # Step 6: Conditional Vulnerability Creation (Guardian Service)
  - id: "create_finding"
    name: "🚨 Create Security Vulnerability"
    action: "wildbox.create_vulnerability"
    description: "Create vulnerability in Guardian if threat detected"
    condition: >-
      steps.threat_assessment is defined
      and steps.threat_assessment.output.overall_result
    input:
      title: "All-Star Test: Potential Threat from {{ trigger.ip }}"
      description: |
        Cross-service integration test detected potential security threat.

        **Signals:** {{ steps.threat_assessment.output.matched | join(', ') }}

        **AI Analysis:**
        - Task ID: {{ steps.ai_analysis.output.task_id if steps.ai_analysis.output else 'not started' }}
        - Results: {{ steps.ai_analysis.output.result_url if steps.ai_analysis.output else 'none' }}

        **Network Scan:**
        - Open Ports: {{ steps.port_scan.output.open_ports | map(attribute='port') | join(', ') if steps.port_scan.output else 'scan failed' }}

        **Threat Intelligence:**
        - Score: {{ steps.threat_intel.output.overall_threat_score if steps.threat_intel.output else 'unavailable' }}/100
        - Classification: {{ steps.threat_intel.output.threat_classification if steps.threat_intel.output else 'unavailable' }}

        Responder run {{ run.id }}, started {{ run.started_at }}.
      severity: "{{ 'high' if steps.threat_assessment.output.conditions.known_threat else 'medium' }}"
      asset_name: "{{ trigger.ip }}"
    timeout: 30
    on_failure: "continue"

  # Step 7: Final Report
  #
  # Each entry is the step's whole context entry -- output, status and, for
  # a step that failed, its error -- as JSON. create_finding is absent from
  # `steps` when its condition did not hold.
  - id: "generate_report"
    name: "📊 Generate Test Report"
    action: "system.create_report"
    description: "Compile comprehensive test results"
    input:
      template: "all_star_summary"
      data:
        run_id: "{{ run.id }}"
        started_at: "{{ run.started_at }}"
        validate_ip: "{{ steps.validate_ip | tojson }}"
        ai_analysis: "{{ steps.ai_analysis | tojson }}"
        port_scan: "{{ steps.port_scan | tojson }}"
        threat_intel: "{{ steps.threat_intel | tojson }}"
        threat_assessment: "{{ steps.threat_assessment | tojson }}"
        create_finding: >-
          {{ (steps.create_finding if steps.create_finding is defined
              else {'skipped': true}) | tojson }}
    condition: "steps.validate_ip.output.valid"
    timeout: 10

# No `output:` block here.
#
# It used to map step results into a result document, and nothing in the engine
# has ever rendered one -- the playbook advertised a result shape it did not
# produce. The step models now reject keys the engine does not read, so leaving
# it would stop the service from starting. Output mapping is tracked as its own
# piece of work.
