# Open Security Automations - Docker Compose Configuration
#
# NOTE: This file is for standalone development of the automations service.
# When running the full Wildbox stack, use the main docker-compose.yml 
# which provides n8n with persistence via SQLite.

version: '3.8'

services:
  n8n:
    image: n8nio/n8n:1.74.0
    container_name: wildbox-automations-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # n8n Configuration
      # No N8N_BASIC_AUTH_*: n8n 1.x has no basic auth and ignores them
      # (#714). Create the owner account right after the first start.
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      
      # Webhook Configuration
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      
      # Database Configuration (SQLite by default)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      
      # Security Settings
      - N8N_SECURE_COOKIE=true
      - N8N_METRICS=false
      
      # Wildbox Integration Environment Variables (see .env.example). Nothing
      # listens on the old default, http://wildbox-gateway:8000: the gateway
      # serves the API on its HTTPS listener only.
      - WILDBOX_API_GATEWAY_URL=${WILDBOX_API_GATEWAY_URL:-https://open-security-gateway}
      - WILDBOX_API_KEY=${WILDBOX_API_KEY:-}

      # Executive Security Dashboard workflow
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - EXECUTIVE_REPORT_EMAIL_FROM=${EXECUTIVE_REPORT_EMAIL_FROM:-}
      - EXECUTIVE_REPORT_EMAIL_TO=${EXECUTIVE_REPORT_EMAIL_TO:-}
      
    volumes:
      # Persistent data storage
      - n8n_data:/home/node/.n8n
      # Custom nodes (for future extensions)
      - ./n8n-data/custom:/home/node/.n8n/custom
      # Workflow backups
      - ./workflows:/home/node/.n8n/workflows
      
    security_opt:
      - no-new-privileges:true

    networks:
      - wildbox-net

    # No reverse-proxy labels: n8n is reached on the loopback port above and
    # nowhere else (#714). The Traefik labels that were here would have let a
    # Traefik on the same Docker host publish the editor, the REST API and
    # the owner setup of a new instance under automations.wildbox.local.
      
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Local Redis for standalone development (optional but recommended)
  # When using main stack, automations can use shared wildbox-redis if needed
  redis:
    image: redis:7-alpine
    container_name: wildbox-automations-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --databases 16 --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    networks:
      - wildbox-net
    environment:
      # For the health check: redis-cli reads the password from here, so it
      # is in no argument list (#740).
      - REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      # redis-cli exits 0 on an error reply: the reply has to be PONG (#740).
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for production use (alternative to SQLite)
  # Uncomment if you prefer PostgreSQL over SQLite
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: wildbox-automations-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=n8n
  #     - POSTGRES_USER=n8n
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - wildbox-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U n8n"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

volumes:
  n8n_data:
    driver: local
  redis_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  wildbox-net:
    external: true
    name: wildbox-net
