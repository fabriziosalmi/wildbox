version: '3.8'

services:
  # Development version with hot reload
  wildbox-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      # Dockerfile.dev installs the shared package from this named build
      # context, as Dockerfile does (see docker-compose.yml).
      additional_contexts:
        shared: ../open-security-shared
    container_name: wildbox-security-api-dev
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - API_KEY=${API_KEY:-dev-api-key-change-this}
      - HOST=0.0.0.0
      - PORT=8000
      # /openapi.json is served in development only, and an environment
      # that is not declared is not development (#722).
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - .:/app  # Mount entire directory for development
      - /app/__pycache__  # Exclude pycache
    restart: unless-stopped
    networks:
      - wildbox-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Redis for development
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: wildbox-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped
    networks:
      - wildbox-network
    command: redis-server --appendonly yes

volumes:
  redis-dev-data:
    driver: local

networks:
  wildbox-network:
    driver: bridge
