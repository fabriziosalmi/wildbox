# Open Security API - Docker Compose Configuration
#
# NOTE: This file is for standalone development of the API service.
# When running the full Wildbox stack, use the main docker-compose.yml.

version: '3.8'

services:
  # Main application
  wildbox-api:
    build:
      context: .
    # additional_contexts is required: this service's Dockerfile does
    # `COPY --from=shared`, which is a named build context, not a stage. Without
    # this line `docker compose up` in this directory fails on that instruction
    # -- which it did, for eight of the services (WILDBO-BLD-02).
      additional_contexts:
        shared: ../open-security-shared
    container_name: wildbox-security-api-main
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - API_KEY=${API_KEY:-your-secure-api-key-here-change-this}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URL=redis://redis:6379
      - TOOLS_ALLOWED_INTERNAL_TARGETS=${TOOLS_ALLOWED_INTERNAL_TARGETS:-}
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app:ro  # Mount app directory as read-only
    restart: unless-stopped
    networks:
      - wildbox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Local Redis for standalone development
  # When using main stack, API service can optionally use shared wildbox-redis
  redis:
    image: redis:7-alpine
    container_name: wildbox-redis-api
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    # noeviction, as in the root stack: this Redis is not a cache. It holds
    # the task owner records and each caller's hourly operation count
    # (#721); under allkeys-lru a full instance would delete them, and a
    # deleted count is an allowance handed back.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --databases 16
    restart: unless-stopped
    networks:
      - wildbox-network
    healthcheck:
      # redis-cli exits 0 on an error reply: the reply has to be PONG (#740).
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:1.30-alpine
    container_name: wildbox-nginx-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - wildbox-api
    restart: unless-stopped
    networks:
      - wildbox-network
    profiles:
      - production  # Only start with --profile production

volumes:
  redis-data:
    driver: local

networks:
  wildbox-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
