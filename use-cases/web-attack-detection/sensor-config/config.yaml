# Wildbox Sensor Configuration for Web Attack Detection
# This configuration enables log forwarding from nginx access logs to the Wildbox Data Lake

# Where telemetry goes: the Wildbox gateway, which authenticates the sensor's
# API key and stores the events under the key's team. The sensor never talks
# to the data service directly. See open-security-sensor/README.md,
# "Sending telemetry to Wildbox".
data_lake:
  # Your gateway's HTTPS address. Overridden by SENSOR_DATA_LAKE_ENDPOINT.
  endpoint: "https://localhost"

  # An identity personal API key (wsk_...) with the data:ingest scope, of the
  # team member created for this sensor. Set it with SENSOR_DATA_LAKE_API_KEY
  # rather than here. Empty, the sensor runs and forwards nothing.
  api_key: ""

  # Verify the gateway's certificate. Leave it on.
  tls_verify: true

  # The gateway's certificate, when no public CA signed it. For the
  # development certificate of a local stack, the file the gateway writes:
  # <wildbox>/open-security-gateway/ssl/wildbox.crt.
  # Overridden by SENSOR_DATA_LAKE_CA_BUNDLE.
  ca_bundle: ""

  # This sensor's name in Wildbox (default: the hostname).
  sensor_id: "web-server-sensor"

  # Batch size for sending events
  batch_size: 100

  # How often to flush events (seconds)
  flush_interval: 30

# Telemetry Collection Settings
collection:
  # Enable/disable different collection types
  process_events: false
  network_connections: false
  file_monitoring: false
  user_events: false
  system_inventory: false

  # IMPORTANT: Enable log forwarding for this use case
  log_forwarding: true

# Log Forwarding Configuration
log_sources:
  # Nginx Access Logs
  - name: nginx_access
    type: file
    path: /var/log/nginx/access.log
    format: nginx
    enabled: true

  # Nginx Error Logs (optional)
  - name: nginx_error
    type: file
    path: /var/log/nginx/error.log
    format: syslog
    enabled: false

  # Apache Access Logs (if using Apache instead)
  - name: apache_access
    type: file
    path: /var/log/apache2/access.log
    format: apache
    enabled: false

  # System Authentication Logs (optional - for correlating with attacks)
  - name: auth
    type: file
    path: /var/log/auth.log
    format: syslog
    enabled: false

# Performance Tuning
performance:
  # Query interval in seconds
  query_interval: 10

  # Maximum memory usage (MB)
  max_memory_mb: 128

  # Maximum CPU usage percentage
  max_cpu_percent: 5

  # Maximum queue size before dropping events
  max_queue_size: 1000

  # Number of worker threads
  worker_threads: 2

# Logging Configuration
logging:
  level: INFO
  format: json
  output: /var/log/security-sensor/sensor.log

# Sensor Identity (the ID the data service shows is data_lake.sensor_id)
sensor:
  # Sensor name/description
  name: "web-server-sensor"

  # Tags for organization
  tags:
    - "web-server"
    - "nginx"
    - "production"
    - "attack-detection"
