# Open Security Sensor Configuration for Docker Deployment

# Data Lake Connection
# Through the gateway, with an identity API key scoped to data:ingest; see
# config.yaml.example and README.md.
data_lake:
  endpoint: "https://wildbox.example.com"  # your gateway; SENSOR_DATA_LAKE_ENDPOINT
  api_key: ""  # SENSOR_DATA_LAKE_API_KEY; unset, nothing is forwarded
  tls_verify: true
  ca_bundle: ""  # SENSOR_DATA_LAKE_CA_BUNDLE, if no public CA signed the gateway's certificate
  batch_size: 100
  flush_interval: 30
  timeout: 30
  # A batch the gateway does not take for a reason that may pass (a network
  # error, HTTP 429, a 5xx answer) is kept and sent again: after retry_delay
  # seconds, then twice as long each time, up to retry_max_delay.
  retry_delay: 5
  retry_max_delay: 300
  # What may wait for the gateway: this many events and this many bytes of
  # serialized events. When either is reached the sensor stops collecting
  # until a batch is accepted; it drops nothing to make room.
  buffer_max_events: 5000
  buffer_max_bytes: 16777216  # 16 MiB
  # The share of the team's request budget at the gateway (RATE_LIMIT_PER_HOUR
  # there, counted per minute) that this sensor uses when it has a backlog;
  # the rest is left to the team's dashboard sessions and other keys.
  rate_limit_share: 0.5

# Telemetry Collection
collection:
  process_events: true
  network_connections: true
  file_monitoring: true
  user_events: true
  system_inventory: true
  log_forwarding: false

# Where the sensor keeps what must outlive a restart: the log forwarder's
# read positions (log-positions.json) and the file monitor's baseline
# (fim-baseline.json). In the container this is the sensor_data volume.
# Overridden by SENSOR_DATA_DIR. The directory must exist and be writable by
# the sensor's user; one sensor per directory. Without it both are kept in
# memory only: read_from applies at every start, and a file changed while
# the sensor was stopped is not reported.
data_dir: /var/lib/security-sensor

# Log sources: what the log forwarder reads when log_forwarding is true.
# These are the container's paths, and the compose files mount no host log:
# mount the directory read-only first. See config.yaml.example and README.md,
# "Log forwarding".
#
# log_sources:
#   - name: nginx_access
#     path: /host/var/log/nginx/access.log
#     format: nginx

# File Integrity Monitoring (Docker-optimized paths)
fim:
  enabled: true
  paths:
    # The sensor's own paths; in the container, the container's. These four
    # are where a host's directories would be mounted, and no compose file
    # mounts them: as shipped, the monitor watches nothing, says so when it
    # starts and reports it in GET /api/v1/components. Mount the directories
    # to watch read-only first, for example "/etc:/host/etc:ro"; see
    # README.md, "File integrity monitoring".
    - "/host/etc"
    - "/host/bin"
    - "/host/usr/bin"
    - "/host/opt"
  exclude_patterns:
    - "*.tmp"
    - "*.log"
    - "*.cache"
    - "*.pid"
    - "*.lock"
  recursive: true
  max_depth: 10
  # The most files watched, all paths together. Beyond it files are not
  # watched, and the monitor's status says how many.
  max_files: 50000

# Performance Tuning (Docker-optimized)
performance:
  query_interval: 10
  # Thresholds, not limits: above either the sensor logs a warning and
  # reports over_limits in its statistics. Nothing is slowed down.
  max_memory_mb: 256
  max_cpu_percent: 10
  max_queue_size: 2000
  worker_threads: 4

# Logging Configuration
logging:
  level: "INFO"
  file: "/var/log/security-sensor/sensor.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Network Configuration
network:
  # 0.0.0.0 is required inside a container, but the compose file must
  # publish the port on 127.0.0.1 only (never 0.0.0.0:8004).
  bind_address: "0.0.0.0"
  bind_port: 8004
  enable_api: true
  api_key: null  # Set to require API key authentication

# Docker-specific osquery configuration
osquery:
  # Use host namespaces for system monitoring
  host_proc_path: "/host/proc"
  host_sys_path: "/host/sys"
  host_etc_path: "/host/etc"
