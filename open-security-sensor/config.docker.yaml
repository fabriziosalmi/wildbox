# Open Security Sensor Configuration for Docker Deployment

# Data Lake Connection
# Through the gateway, with an identity API key scoped to data:ingest; see
# config.yaml.example and README.md.
data_lake:
  endpoint: "https://wildbox.example.com"  # your gateway; SENSOR_DATA_LAKE_ENDPOINT
  api_key: ""  # SENSOR_DATA_LAKE_API_KEY; unset, nothing is forwarded
  tls_verify: true
  ca_bundle: ""  # SENSOR_DATA_LAKE_CA_BUNDLE, if no public CA signed the gateway's certificate
  batch_size: 100
  flush_interval: 30
  timeout: 30
  # A batch the gateway does not take for a reason that may pass (a network
  # error, HTTP 429, a 5xx answer) is kept and sent again: after retry_delay
  # seconds, then twice as long each time, up to retry_max_delay.
  retry_delay: 5
  retry_max_delay: 300
  # What may wait for the gateway: this many events and this many bytes of
  # serialized events. When either is reached the sensor stops collecting
  # until a batch is accepted; it drops nothing to make room.
  buffer_max_events: 5000
  buffer_max_bytes: 16777216  # 16 MiB

# Telemetry Collection
collection:
  process_events: true
  network_connections: true
  file_monitoring: true
  user_events: true
  system_inventory: true
  log_forwarding: false

# Log sources: what the log forwarder reads when log_forwarding is true.
# These are the container's paths, and the compose files mount no host log:
# mount the directory read-only first. See config.yaml.example and README.md,
# "Log forwarding".
#
# log_sources:
#   - name: nginx_access
#     path: /host/var/log/nginx/access.log
#     format: nginx

# File Integrity Monitoring (Docker-optimized paths)
fim:
  enabled: true
  paths:
    # Host paths (mounted as /host/*)
    - "/host/etc"
    - "/host/bin"
    - "/host/usr/bin"
    - "/host/opt"
  exclude_patterns:
    - "*.tmp"
    - "*.log"
    - "*.cache"
    - "*.pid"
    - "*.lock"
  recursive: true
  max_depth: 10

# Performance Tuning (Docker-optimized)
performance:
  query_interval: 10
  max_memory_mb: 256  # Higher for Docker
  max_cpu_percent: 10  # Slightly higher for containerized environment
  max_queue_size: 2000
  worker_threads: 4

# Logging Configuration
logging:
  level: "INFO"
  file: "/var/log/security-sensor/sensor.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Network Configuration
network:
  # 0.0.0.0 is required inside a container, but the compose file must
  # publish the port on 127.0.0.1 only (never 0.0.0.0:8004).
  bind_address: "0.0.0.0"
  bind_port: 8004
  enable_api: true
  api_key: null  # Set to require API key authentication

# Docker-specific osquery configuration
osquery:
  # Use host namespaces for system monitoring
  host_proc_path: "/host/proc"
  host_sys_path: "/host/sys"
  host_etc_path: "/host/etc"
