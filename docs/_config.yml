# Jekyll configuration for www.wildbox.io
#
# GitHub Pages builds this directory from `main` (legacy "deploy from branch"
# mode, github-pages gem). Two kinds of page are published:
#
#   - Standalone HTML pages without front matter (index.html, api-reference.html,
#     learn/, tools/, api/*.html ...) are copied as they are.
#   - Markdown pages (guides/, security/, api/) are rendered at build time by
#     kramdown through _layouts/doc.html, which carries the site navigation and
#     the documentation sidebar from _data/docs_nav.yml. docs.html is processed
#     too, only so that it can share that sidebar.
#
# Nothing is rendered in the browser from Markdown fetched at runtime.

# Site metadata
title: Wildbox Security Platform
description: "Open-source security platform with community-driven development"
author: "Wildbox Community"
url: "https://www.wildbox.io"
baseurl: ""
social:
  name: "Wildbox Community"
  links:
    - "https://github.com/fabriziosalmi/wildbox"

# Build settings
markdown: kramdown
kramdown:
  input: GFM

# The plugins below are enabled by GitHub Pages anyway; they are listed so that
# a local `jekyll build` with the github-pages gem produces the same site.
#   jekyll-optional-front-matter  renders Markdown files that have no front matter
#   jekyll-titles-from-headings   takes page.title from the first heading
#   jekyll-relative-links         rewrites links to .md files into page URLs
#   jekyll-readme-index           publishes api/README.md as /api/
plugins:
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-readme-index

# Publish only the rendered page, not a second copy of the .md source.
optional_front_matter:
  remove_originals: true
readme_index:
  remove_originals: true

# /guides/quickstart.md -> /guides/quickstart/
permalink: /:path/

defaults:
  - scope:
      path: ""
    values:
      layout: "doc"
  # One meta description per rendered page. Without these, jekyll-seo-tag
  # falls back to site.description and every Markdown page shares the same
  # description. Front matter in the page itself still takes precedence.
  - scope:
      path: "guides/quickstart.md"
    values:
      description: "Run the Wildbox stack on one machine with Docker Compose, log in, and make an authenticated API call."
  - scope:
      path: "guides/ports.md"
    values:
      description: "Reference list of the ports each Wildbox service listens on and how the stack is exposed, taken from docker-compose.yml."
  - scope:
      path: "guides/credentials.md"
    values:
      description: "How Wildbox generates its secrets and administrator credentials, and how clients authenticate to the API."
  - scope:
      path: "guides/ollama-llm.md"
    values:
      description: "How AI-assisted analysis is configured in Wildbox, and why the earlier Ollama setup no longer applies."
  - scope:
      path: "guides/deployment.md"
    values:
      description: "How to run Wildbox on a server you control: requirements, configuration, TLS, backups and operations."
  - scope:
      path: "api/README.md"
    values:
      description: "Endpoint references for the Wildbox microservices, with request examples, error handling and authentication details."
  - scope:
      path: "api/identity/endpoints.md"
    values:
      description: "Routes of the Wildbox identity service: users, JWT login, API keys, teams and the gateway's authorization checks."
  - scope:
      path: "api/tools/endpoints.md"
    values:
      description: "Hand-written endpoint reference for the Wildbox tools service API, reached through the gateway."
  - scope:
      path: "api/data/endpoints.md"
    values:
      description: "Hand-written endpoint reference for the Wildbox data service API, reached through the gateway."
  - scope:
      path: "api/guardian/endpoints.md"
    values:
      description: "Hand-written endpoint reference for the Wildbox guardian service API, reached through the gateway."
  - scope:
      path: "api/responder/endpoints.md"
    values:
      description: "Hand-written endpoint reference for the Wildbox responder service API, reached through the gateway."
  - scope:
      path: "api/agents/endpoints.md"
    values:
      description: "Hand-written endpoint reference for the Wildbox agents service API, reached through the gateway."
  - scope:
      path: "contributing.md"
    values:
      description: "Engineering notes for people working on Wildbox itself, with links to the contributor documents in the repository."
  - scope:
      path: "security/status.md"
    values:
      description: "What is known about Wildbox's security today, including open issues and how each check was made."
  - scope:
      path: "security/policy.md"
    values:
      description: "The security requirements and practices Wildbox aims for; gaps are tracked on the security status page."

# Files kept in the repository but intentionally NOT published.
exclude:
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  # Internal/engineering notes referenced by SECURITY.md, CI scripts, etc.
  - ARCHITECTURE_DECISIONS.md
  - ARCHITECTURE_STACK_JUSTIFICATION.md
  - DATA_SERVICE_API_DOCUMENTATION.md
  - DEPENDENCY_MANAGEMENT_GUIDE.md
  - DOCUMENTATION_QUALITY_AUDIT.md
  - DOCUMENTATION_STYLE_GUIDE.md
  - ENGINEERING_STANDARDS.md
  - ERROR_HANDLING_REFACTORING.md
  - FAANG_PATTERNS_IMPLEMENTATION.md
  - GATEWAY_AUTHENTICATION_GUIDE.md
  - GIT_COMMIT_SQUASH_GUIDE.md
  - GIT_SECURITY_AUDIT.md
  - OBSERVABILITY_ROADMAP.md
  - PRE_COMMIT_HOOKS.md
  - SECURITY_SECRETS_ROTATION.md
  - SERVICE_LIFECYCLE.md
  - TESTING_STRATEGY.md
  - vendor/README.md
  - vendor/fonts/README.md
  # The November 2024 platform audit: report, remediation checklist and
  # summary. They describe code that has since changed and are superseded by
  # security/status.md; kept in the repository, not published.
  - security/audit-report.md
  - security/remediation-checklist.md
  - security/improvements-summary.md
  # The tools service audit of November 2025, for the same reason: it
  # reports a "Production Ready" status and figures that no longer hold.
  - security/tools-service-audit.md
  # Superseded engineering notes, each with a banner naming the page that
  # replaces it. Kept in the repository for their history, not published.
  - archive/
  # A contributor template for writing API docs, not reference material.
  - api/TEMPLATE.md

# sitemap.xml is generated at build time from _data/docs_nav.yml plus a fixed
# list of standalone HTML pages.

# Include dot-folders (required by Jekyll for RFC 9116 security.txt)
include:
  - ".well-known"

timezone: UTC
encoding: UTF-8
