# Alembic configuration for the Wildbox data service.
#
# The service used to create its schema with Base.metadata.create_all(), which
# emits CREATE TABLE and never ALTER TABLE -- so any column added after a
# database was first created was missing from it forever. The tenancy columns
# sources.team_id and indicators.team_id, added in 48c953d, are exactly that
# case (WILDBO-DOM-01/DOM-02).
#
# Usage:  alembic upgrade head     (run from open-security-data/)

[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is taken from DATABASE_URL at runtime; see alembic/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
