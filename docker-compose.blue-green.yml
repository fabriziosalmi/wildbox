# Blue/Green deployment infrastructure for zero-downtime deployments
#
# Enables:
# - Zero-downtime deployments
# - Instant rollback on failure
# - Load balancer traffic switching
# - Health check validation before switch
#
# Based on AWS ELB and Netflix patterns
#
# Usage:
#   ./scripts/blue_green_deploy.sh identity v0.3.0
#   ./scripts/blue_green_health.sh
#   ./scripts/blue_green_rollback.sh identity

# Blue/Green deployment configuration
# 
# Architecture:
# - HAProxy load balancer on port 80/443
# - Blue environment: Current production (ports 8100-8119)
# - Green environment: New version staging (ports 8200-8219)
# - Zero-downtime switch via HAProxy config reload
#
# Deployment flow:
# 1. Deploy to green environment (parallel to blue)
# 2. Run health checks on green
# 3. Switch HAProxy to green
# 4. Monitor for errors
# 5. Keep blue running for rollback
# 6. After validation, scale down blue
#
# guardian's background tasks (#550). guardian is three processes: the API
# (guardian-<color>), its Celery worker (guardian-worker-<color>) and the
# scheduler that sends its periodic tasks (guardian-beat). The worker runs
# per color, from that color's image; there is one guardian-beat for both
# colors, because beat has no leader election and two of them would send
# every periodic task twice. guardian-beat runs the image of the active
# color, GUARDIAN_ACTIVE_COLOR (blue unless set), and
# scripts/shell-scripts/blue_green_guardian_tasks.sh moves the worker and
# beat together with the traffic. See docs/guides/deployment.md.

# Shared by the guardian API, worker and beat of both colors: the same
# settings docker-compose.yml gives guardian, guardian-worker and
# guardian-beat.
x-guardian-build: &guardian-build
  context: ./open-security-guardian
  dockerfile: Dockerfile
  additional_contexts:
    shared: ./open-security-shared

x-guardian-environment: &guardian-environment
  SECRET_KEY: ${GUARDIAN_SECRET_KEY:?GUARDIAN_SECRET_KEY is required}
  GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:-}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/guardian
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/1
  DEBUG: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ALLOWED_HOSTS: localhost,127.0.0.1,guardian-blue,guardian-green
  GUARDIAN_BASE_URL: ${GUARDIAN_BASE_URL:-}
  # Seconds between reminders of an alert rule that keeps firing, or off;
  # empty means one day (guardian/schedule.py, #549).
  GUARDIAN_ALERT_RENOTIFY_INTERVAL: ${GUARDIAN_ALERT_RENOTIFY_INTERVAL:-}

# The worker of one color. No build section: it runs the image its
# color's API was built into, so the API and the worker that executes its
# tasks are always the same code. -Q: exactly the queues in
# guardian/celery.py TASK_QUEUES (tests/unit/test_celery_routing.py checks
# this file too).
x-guardian-worker: &guardian-worker
  pull_policy: never
  command: celery -A guardian worker --loglevel=info --concurrency=2 -Q default,reporting,scanning,analytics
  # Warm shutdown: on stop, a worker finishes the tasks it is running
  # before it exits. Tasks are acknowledged late, so one killed half-way
  # is delivered again, but only after Redis' visibility timeout (an hour);
  # the grace period lets an ordinary task (a port scan, a report) finish
  # when the deploy script retires the old color's worker.
  stop_grace_period: 5m
  # The reports it generates, served by the API of either color (#548).
  volumes:
    - guardian-media:/app/media
  security_opt:
    - no-new-privileges:true
  networks:
    - wildbox-network
  healthcheck:
    test: ["CMD-SHELL", "celery -A guardian inspect ping -d celery@$$HOSTNAME"]
    interval: 30s
    timeout: 15s
    retries: 3
    start_period: 30s

services:
  # ===== LOAD BALANCER =====
  haproxy:
    image: haproxy:2.8-alpine
    container_name: wildbox-haproxy
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"  # Stats dashboard
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/etc/ssl/certs:ro
    networks:
      - wildbox-network
    depends_on:
      - identity-blue
      - identity-green
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== BLUE ENVIRONMENT (Current Production) =====
  identity-blue:
    build:
      context: ./open-security-identity
      dockerfile: Dockerfile
    container_name: wildbox-identity-blue
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/identity
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=blue
      - VERSION=0.2.0
    ports:
      - "8101:8001"  # Blue on 8101
    networks:
      - wildbox-network
    depends_on:
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  guardian-blue:
    build: *guardian-build
    image: wildbox-guardian:blue
    container_name: wildbox-guardian-blue
    environment:
      <<: *guardian-environment
      ENVIRONMENT: blue
      VERSION: 0.2.0
    ports:
      - "8113:8013"  # Blue on 8113
    # Generated reports, written by the workers (#548).
    volumes:
      - guardian-media:/app/media
    networks:
      - wildbox-network
    depends_on:
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8013/health/"]
      interval: 10s
      timeout: 5s
      retries: 3

  guardian-worker-blue:
    <<: *guardian-worker
    image: wildbox-guardian:blue
    environment:
      <<: *guardian-environment
      ENVIRONMENT: blue
      VERSION: 0.2.0
    depends_on:
      guardian-blue:
        condition: service_healthy

  # ===== GREEN ENVIRONMENT (New Version Staging) =====
  identity-green:
    build:
      context: ./open-security-identity
      dockerfile: Dockerfile
      args:
        - VERSION=0.3.0  # New version
    container_name: wildbox-identity-green
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/identity
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@wildbox-redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=green
      - VERSION=0.3.0
    ports:
      - "8201:8001"  # Green on 8201
    networks:
      - wildbox-network
    depends_on:
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Initially scaled to 0 (deploy on-demand)
    deploy:
      replicas: 0

  guardian-green:
    build:
      <<: *guardian-build
      args:
        - VERSION=0.3.0
    image: wildbox-guardian:green
    container_name: wildbox-guardian-green
    environment:
      <<: *guardian-environment
      ENVIRONMENT: green
      VERSION: 0.3.0
    ports:
      - "8213:8013"  # Green on 8213
    # Generated reports, written by the workers (#548).
    volumes:
      - guardian-media:/app/media
    networks:
      - wildbox-network
    depends_on:
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8013/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 0

  # Started by blue_green_guardian_tasks.sh when green takes the traffic,
  # not with guardian-green: until then green's code runs no task.
  guardian-worker-green:
    <<: *guardian-worker
    image: wildbox-guardian:green
    environment:
      <<: *guardian-environment
      ENVIRONMENT: green
      VERSION: 0.3.0
    depends_on:
      guardian-green:
        condition: service_healthy
    deploy:
      replicas: 0

  # ===== SHARED BY BOTH COLORS =====
  # guardian-beat: one instance for blue and green together. Beat has no
  # leader election, so a beat per color would send every periodic task
  # twice while both colors run. container_name keeps it to one container
  # (compose refuses `--scale guardian-beat=2`), and changing its image
  # recreates that container: compose stops the old beat before it starts
  # the new one.
  #
  # It runs the active color's image, so the schedule it writes into
  # django-celery-beat (guardian/schedule.py) and the task names it sends
  # are those of the code taking the traffic. GUARDIAN_ACTIVE_COLOR is set
  # by blue_green_guardian_tasks.sh; a plain `docker compose up -d` without
  # it puts beat back on blue, together with the rest of this file's
  # defaults (green scaled to 0). Never two beats either way.
  guardian-beat:
    image: wildbox-guardian:${GUARDIAN_ACTIVE_COLOR:-blue}
    # The image is built by guardian-blue or guardian-green; never pulled.
    pull_policy: never
    container_name: wildbox-guardian-beat
    command: celery -A guardian beat --loglevel=info --scheduler guardian.beat:HeartbeatDatabaseScheduler
    environment:
      <<: *guardian-environment
      ENVIRONMENT: ${GUARDIAN_ACTIVE_COLOR:-blue}
      # Empty means the default in guardian/schedule.py; see
      # docs/guides/deployment.md, "guardian's scheduled tasks".
      GUARDIAN_SCHEDULE_SLA_CHECK: ${GUARDIAN_SCHEDULE_SLA_CHECK:-}
      GUARDIAN_SCHEDULE_ALERT_RULES: ${GUARDIAN_SCHEDULE_ALERT_RULES:-}
      GUARDIAN_SCHEDULE_RISK_SCORES: ${GUARDIAN_SCHEDULE_RISK_SCORES:-}
      GUARDIAN_SCHEDULE_REPORT_CLEANUP: ${GUARDIAN_SCHEDULE_REPORT_CLEANUP:-}
      GUARDIAN_SCHEDULE_HISTORY_CLEANUP: ${GUARDIAN_SCHEDULE_HISTORY_CLEANUP:-}
      GUARDIAN_SCHEDULE_ASSET_INVENTORY: ${GUARDIAN_SCHEDULE_ASSET_INVENTORY:-}
      GUARDIAN_SCHEDULE_OVERDUE_ASSESSMENTS: ${GUARDIAN_SCHEDULE_OVERDUE_ASSESSMENTS:-}
      GUARDIAN_SCHEDULE_EXPIRING_EXCEPTIONS: ${GUARDIAN_SCHEDULE_EXPIRING_EXCEPTIONS:-}
      GUARDIAN_SCHEDULE_USER_SCHEDULES: ${GUARDIAN_SCHEDULE_USER_SCHEDULES:-}
    security_opt:
      - no-new-privileges:true
    networks:
      - wildbox-network
    depends_on:
      postgres:
        condition: service_healthy
      wildbox-redis:
        condition: service_healthy
      # On a full `up`, guardian-blue applies the migrations first (the
      # entrypoint of every guardian container runs migrate; two at once on
      # an empty database race). The deploy scripts recreate beat with
      # --no-deps, so this does not tie it to blue after a switch.
      guardian-blue:
        condition: service_healthy
    healthcheck:
      # The scheduler loop, not just the process (guardian/beat.py).
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.stat('/tmp/guardian-beat.heartbeat').st_mtime > 60)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===== SHARED INFRASTRUCTURE =====
  postgres:
    image: postgres:15-alpine
    container_name: wildbox-postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # guardian's database (and data's), as in docker-compose.yml.
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    networks:
      - wildbox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  wildbox-redis:
    image: redis:7-alpine
    container_name: wildbox-redis
    # The services connect with REDIS_PASSWORD; without requirepass Redis
    # rejects that AUTH ("called without any password configured").
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - wildbox-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  wildbox-network:
    driver: bridge

volumes:
  postgres-data:
  guardian-media:
