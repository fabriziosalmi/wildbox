# Chaos and load, on a schedule.
#
# tests/chaos/ injects one fault at a time into the running stack -- identity
# unreachable, PostgreSQL or Redis down, a service process dying, a burst of
# concurrent requests -- and asserts what the code says should happen and that
# the stack recovers (WILDBO-CONC-03, rewritten in #428). Nothing measured
# performance either (WILDBO-PERF-03).
#
# Nightly rather than per-PR: these bring up the whole stack and take minutes.
name: Chaos & Load

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: false
        default: 'all'
        type: choice
        options: [all, chaos, load]

# Least privilege: the token can read the repository and nothing else,
# unless a job below asks for more.
permissions:
  contents: read

jobs:
  chaos:
    name: Chaos experiments
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'chaos'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # observed max 10.8 min (34 runs, green or red)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The stack is started exactly as the integration job starts it: the
      # experiments measure the configuration that ships, not the development
      # override, and they log in with the admin account it provisions.
      - name: Generate secrets
        run: |
          cp .env.example .env
          python3 scripts/generate_secrets.py --force
          python3 scripts/validate_secrets.py

      - name: Raise the per-team rate limit
        run: sed -i "s/^RATE_LIMIT_PER_HOUR=.*/RATE_LIMIT_PER_HOUR=1000000/" .env

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f .github/compose.ci-ports.yml up -d --wait --wait-timeout 600
        # Image builds plus --wait-timeout above (10 min); observed max 10.7.
        timeout-minutes: 20

      - name: Install test dependencies
        timeout-minutes: 5
        run: pip install -r tests/requirements.txt

      - name: Run chaos suite
        run: |
          env_value() { sed -n "s/^$1=//p" .env | head -1; }
          INITIAL_ADMIN_EMAIL="$(env_value INITIAL_ADMIN_EMAIL)"
          INITIAL_ADMIN_PASSWORD="$(env_value INITIAL_ADMIN_PASSWORD)"
          export INITIAL_ADMIN_EMAIL INITIAL_ADMIN_PASSWORD
          python -m pytest tests/chaos -v -s -rA --tb=short -p no:cacheprovider -o addopts=""
        env:
          GATEWAY_URL: https://localhost
          REQUESTS_CA_BUNDLE: ${{ github.workspace }}/open-security-gateway/ssl/wildbox.crt
          IDENTITY_SERVICE_URL: http://localhost:8001
          TOOLS_SERVICE_URL: http://localhost:8000
          DATA_SERVICE_URL: http://localhost:8002
        timeout-minutes: 20  # observed max 4.9 min

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/compose.ci-ports.yml logs --tail=200 gateway identity data postgres wildbox-redis

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f .github/compose.ci-ports.yml down -v

  load:
    name: Load baseline
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'load'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # observed max 10.4 min (34 runs, green or red)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Generate secrets
        run: python3 scripts/generate_secrets.py

      - name: Start the stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
          chmod +x scripts/wait-for-services.sh
          ./scripts/wait-for-services.sh
        timeout-minutes: 15
        env:
          SERVICES: "gateway:localhost:80:/health data:localhost:8002:/health"
          # generate_secrets.py builds .env from .env.template, which sets
          # ENVIRONMENT=production because that is what a real deployment wants.
          # This job then layers docker-compose.dev.yml on top, and that file
          # forces DEBUG=true for `data`. app/config.py:186 refuses the pair:
          #
          #   ValueError: DEBUG must be False in production
          #
          # so `data` crash-looped, never went healthy, and both jobs died in
          # "Start the stack" after nine minutes of building images. The stack
          # here IS a development stack (it is the dev override), so say so.
          ENVIRONMENT: development

      - name: Install benchmark dependencies
        timeout-minutes: 5
        run: pip install -r tests/requirements.txt

      - name: Search latency baseline
        # The first repeatable measurement this repository has had. It answers
        # the question the performance review could not: whether the
        # leading-wildcard ILIKE search matters at realistic data volumes
        # (WILDBO-PERF-02/PERF-03).
        run: python tests/perf/bench_indicator_search.py --report bench-results.json

      # Without this the failure says "1 service did not become healthy" and
      # then suggests `docker compose logs data`, which nobody can run on a
      # runner that no longer exists. The chaos job already had this step, and
      # it is the only reason the cause of this failure was readable at all.
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench-results.json
          retention-days: 90

      - name: Tear down
        if: always()
        run: docker compose down -v
