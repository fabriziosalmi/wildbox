name: Documentation Quality Checks

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.cspell.json'
      - '.markdownlint.json'
      - '.proselintrc.json'
      - 'scripts/check_prose.py'
      - '.github/workflows/documentation-quality.yml'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'docs/**'

# Least privilege: the token can read the repository and nothing else,
# unless a job below asks for more.
permissions:
  contents: read

# One run per pull request: a new push cancels the run it supersedes. Any
# other event (push to main, schedule, dispatch) gets a group of its own,
# so it is never cancelled -- not even while pending, which a shared group
# with cancel-in-progress: false would still do to a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-lint:
    name: Markdown Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.4 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.1

      - name: Run markdownlint
        run: markdownlint '**/*.md' --config .markdownlint.json --ignore node_modules --ignore .git

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.3 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install cspell
        run: npm install -g cspell@10.3.6

      - name: Run spell checker
        run: cspell "**/*.md" --config .cspell.json

  link-check:
    name: Link Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 1.2 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.15.0

      - name: Check links in README
        run: markdown-link-check README.md --config .markdown-link-check.json

      - name: Check links in docs/
        run: find docs -name "*.md" -exec markdown-link-check {} --config .markdown-link-check.json \;
        continue-on-error: true

  prose-quality:
    name: Prose Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.5 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Pinned: proselint 0.16 replaced `proselint FILE` with
      # `proselint check FILE`, and an unpinned install broke the old
      # invocation without anyone noticing. Bump deliberately.
      - name: Install proselint
        run: pip install proselint==0.16.0

      # Rules live in .proselintrc.json. scripts/check_prose.py masks
      # code blocks, inline code and comments, prints each finding as an
      # annotation, and fails the job when there is any. Vendored
      # third-party docs are not ours to edit.
      - name: Run proselint on Markdown
        run: |
          git ls-files -z '*.md' ':!:docs/vendor/**' ':!:docs/api/vendor/**' \
            | xargs -0 python scripts/check_prose.py --config .proselintrc.json

  inclusive-language:
    name: Inclusive Language Check
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.6 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install alex
        run: npm install -g alex@11.0.1

      - name: Run alex
        run: alex '**/*.md' --quiet || true
        continue-on-error: true

  alt-text-check:
    name: Image Alt Text Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.7 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for images without alt text
        run: |
          echo "Checking for images without alt text..."
          
          # Find markdown images without alt text: ![]()
          if grep -r "!\[\](.*)" . --include="*.md" --exclude-dir=node_modules --exclude-dir=.git; then
            echo "❌ ERROR: Found images without alt text"
            echo "Please add descriptive alt text to all images for accessibility"
            exit 1
          else
            echo "✅ All images have alt text"
          fi

  documentation-coverage:
    name: Documentation Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.3 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate coverage metrics
        run: |
          echo "## Documentation Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count total markdown files
          TOTAL_FILES=$(find . -name "*.md" -not -path "*/node_modules/*" -not -path "*/.git/*" | wc -l)
          echo "📄 Total Markdown Files: $TOTAL_FILES" >> $GITHUB_STEP_SUMMARY
          
          # Count docs with code blocks
          FILES_WITH_CODE=$(grep -rl '```' . --include="*.md" --exclude-dir=node_modules --exclude-dir=.git | wc -l)
          echo "💻 Files with Code Examples: $FILES_WITH_CODE" >> $GITHUB_STEP_SUMMARY
          
          # Count files with tables
          FILES_WITH_TABLES=$(grep -rl '|.*|' . --include="*.md" --exclude-dir=node_modules --exclude-dir=.git | wc -l)
          echo "📊 Files with Tables: $FILES_WITH_TABLES" >> $GITHUB_STEP_SUMMARY
          
          # Count total images
          TOTAL_IMAGES=$(grep -r '!\[.*\](.*)'  . --include="*.md" --exclude-dir=node_modules --exclude-dir=.git | wc -l)
          echo "🖼️ Total Images: $TOTAL_IMAGES" >> $GITHUB_STEP_SUMMARY
          
          # Count external links
          EXTERNAL_LINKS=$(grep -r '\[.*\](http' . --include="*.md" --exclude-dir=node_modules --exclude-dir=.git | wc -l)
          echo "🔗 External Links: $EXTERNAL_LINKS" >> $GITHUB_STEP_SUMMARY

  security-scan:
    # Not a duplicate of gitleaks (secret-scan.yml): .gitleaks.toml allowlists
    # docs/ and every README.md for their sample curl calls, so these three
    # patterns are the only secret check documentation gets.
    name: Documentation Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.6 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan for exposed secrets in docs
        run: |
          echo "Scanning for common secret patterns in documentation..."

          # -E is required: in grep's default basic syntax {16} and {36} are
          # literal braces, so these two patterns matched nothing at all.
          # Check for AWS keys
          if grep -rE 'AKIA[0-9A-Z]{16}' . --include="*.md" --exclude-dir=node_modules; then
            echo "⚠️ WARNING: Potential AWS access key found"
            exit 1
          fi
          
          # Check for private keys
          if grep -rE 'BEGIN.*PRIVATE KEY' . --include="*.md" --exclude-dir=node_modules; then
            echo "⚠️ WARNING: Potential private key found"
            exit 1
          fi
          
          # Check for GitHub tokens
          if grep -rE 'ghp_[0-9a-zA-Z]{36}' . --include="*.md" --exclude-dir=node_modules; then
            echo "⚠️ WARNING: Potential GitHub token found"
            exit 1
          fi
          
          echo "✅ No secrets detected in documentation"
