name: Pip Security Upgrades

# Replaces Dependabot for pip (#420): Dependabot regenerates the hash-pinned
# locks with pip-compile instead of uv, so none of its PRs could pass the
# Dependency Integrity gate. This job moves only the packages with a known
# advisory, with the same uv invocation compile_requirements.sh uses, and opens
# (or refreshes) a single PR.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pip-security-upgrades
  cancel-in-progress: false

env:
  BRANCH: deps/pip-security-upgrades

jobs:
  upgrade:
    name: Upgrade vulnerable pins
    runs-on: ubuntu-latest
    timeout-minutes: 20  # one green run so far, 2.4 min; resolving every lock
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Upgrade vulnerable packages
        run: SUMMARY_FILE="$RUNNER_TEMP/summary.md" ./scripts/upgrade_vulnerable_requirements.sh

      - name: Verify the locks still match requirements.in
        run: ./scripts/compile_requirements.sh --check

      - name: Publish summary
        run: cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # A PR opened with GITHUB_TOKEN does not trigger other workflows, so its
      # required checks would never start. The fix is a GitHub App installation
      # token: it lasts one hour, is scoped to this repository and to the two
      # permissions below, and is not tied to a person -- unlike a personal
      # access token, which this workflow deliberately does not use.
      #
      # Configure once: create a GitHub App with Contents and Pull requests
      # (read & write), install it on this repository, then set the repository
      # variable DEPS_APP_CLIENT_ID and the secret DEPS_APP_PRIVATE_KEY. Until then the
      # job falls back to GITHUB_TOKEN: the PR is still opened, and CI starts at
      # the next push to the branch.
      - name: Mint a GitHub App token
        id: app-token
        if: vars.DEPS_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if git diff --quiet -- 'open-security-*/requirements.txt'; then
            echo "No pin moved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add open-security-*/requirements.txt
          git commit -m "build(deps): upgrade pip packages with known advisories"
          git push --force "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          {
            echo "Opened by \`.github/workflows/pip-security-upgrades.yml\`."
            echo "Only packages with a known advisory move, to the newest version \`requirements.in\` allows."
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/body.md"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "build(deps): upgrade pip packages with known advisories" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
