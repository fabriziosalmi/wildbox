name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

# Least privilege: the token can read the repository and nothing else,
# unless a job below asks for more.
permissions:
  contents: read

# One run per pull request: a new push cancels the run it supersedes. Any
# other event (push to main, schedule, dispatch) gets a group of its own,
# so it is never cancelled -- not even while pending, which a shared group
# with cancel-in-progress: false would still do to a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Validate docker-compose configuration
  validate-docker:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.8 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "ERROR: docker-compose.yml is missing!"
            exit 1
          fi
          # compose interpolation uses ${VAR:?} for secrets (no insecure
          # defaults), and ${VAR:?} rejects an empty value as well as an unset
          # one -- so the template alone is not enough: its secret entries are
          # deliberately blank. Generate them the way the documented setup does,
          # which also proves that path still works.
          cp .env.example .env
          python3 scripts/generate_secrets.py --force
          docker compose config --quiet
          rm -f .env .env.env.backup
          echo "✓ docker-compose.yml is valid"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Every tracked Compose file renders and points at what exists
        # The step above renders docker-compose.yml and nothing else. The
        # overlays and the per-service files were never rendered, and three
        # of the latter could not start: they mounted paths that were not in
        # the repository or built a stage their Dockerfile lacks, which
        # `docker compose config` does not notice (#726). This renders every
        # tracked Compose file, alone or with the files it overlays, every
        # profile included, and checks in the result that each build
        # context, Dockerfile, stage and bind-mount source exists.
        run: |
          pip install --quiet --require-hashes -r tests/ci-tools/requirements.txt
          python3 scripts/check_compose_files.py

  # Check for critical files
  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.9 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for critical service files
        run: |
          MISSING_FILES=()

          # List of critical files that must exist
          CRITICAL_FILES=(
            "docker-compose.yml"
            "open-security-agents/app/main.py"
            "open-security-cspm/app/main.py"
            "open-security-data/app/api/main.py"
            "open-security-guardian/guardian/settings.py"
            "open-security-identity/app/main.py"
            "open-security-responder/app/main.py"
            "open-security-sensor/sensor/api/local_api.py"
            "open-security-tools/app/tools/hash_generator/main.py"
          )

          for file in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
            fi
          done

          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "ERROR: The following critical files are missing:"
            printf '%s\n' "${MISSING_FILES[@]}"
            exit 1
          fi

          echo "✓ All critical service files exist"

  # Security scanning is not repeated here. Trivy (SARIF report and the
  # critical-advisory gate) and Bandit run once per pull request in the
  # "Security Scanning" job of test.yml, a required check; gitleaks runs in
  # secret-scan.yml. The job that stood here ran Trivy a second time and
  # finished with a grep for hardcoded secrets that ended in `|| true`, so it
  # could not fail.

  # Dependency lockfiles must be current, and the SBOM must be producible.
  dependency-integrity:
    name: Dependency Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.3 min
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify lockfiles match requirements.in
        # Every service ships a hash-pinned requirements.txt compiled from
        # requirements.in. Seven of the eight used to have no lockfile at all,
        # so the transitive tree was re-resolved at every image build
        # (WILDBO-DEP-04/DEP-05).
        run: ./scripts/compile_requirements.sh --check

      - name: Locks provide what the shared modules each service imports need
        # open-security-shared declared five dependencies for the whole
        # package and every image installed it with --no-deps: `pip check`
        # failed in seven images of eight, and nothing ran it (#722). The
        # package now has one extra per group of modules, and each Dockerfile
        # installs it with the extras of the modules its service imports,
        # resolved offline against the lock, then runs `pip check`: the image
        # build (Docker Build Validation) fails when the environment does not
        # satisfy them. This step keeps that arrangement true without
        # building: extras equal to what the service imports, no --no-deps,
        # `pip check` present, every requirement of those extras pinned in
        # the lock at a version the package accepts, and every module of the
        # package importing only what its extras require.
        run: >-
          uv run --no-project --python 3.11 --with packaging --with pyyaml
          python scripts/check_shared_dependencies.py

  # Python linting and type checking
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 1.7 min
    strategy:
      matrix:
        service:
          - open-security-agents
          - open-security-cspm
          - open-security-data
          - open-security-identity
          - open-security-responder
          - open-security-sensor
          - open-security-tools
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # Same dependency path, hence the same cache key, as the service's
          # Unit Tests leg in test.yml. That one also runs on main, and a
          # pull request can restore what main saved; this workflow runs on
          # pull requests only, so the actions/cache step it used before
          # saved into the PR's own scope and every new PR started cold.
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        timeout-minutes: 5  # observed max 1.2 min
        run: |
          cd ${{ matrix.service }}
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # On top of the service's lock; versions as in
          # tests/ci-tools/requirements.in (scripts/check_workflow_pins.py).
          pip install flake8==7.4.1 mypy==2.4.0

      - name: Run mypy
        # mypy and pylint were installed in all seven matrix legs and never
        # invoked (WILDBO-QUAL-08). pylint is dropped; mypy runs, reporting
        # rather than gating for now so the ratchet can start from a known count.
        continue-on-error: true
        run: |
          cd ${{ matrix.service }}
          mypy app --ignore-missing-imports --no-strict-optional || true

      - name: Run flake8
        run: |
          cd ${{ matrix.service }}
          # Syntax errors, undefined names and f-string/comparison bugs: always fatal.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          # Complexity GATES. This pass used to carry --exit-zero, so its
          # findings were printed into the log and discarded (WILDBO-QUAL-05).
          #
          # Complexity only. The first attempt at making this gate also enforced
          # --max-line-length=127, which no service comes close to satisfying --
          # between 283 and 3921 violations each -- so the "gate" would have
          # failed every build from the moment it was armed. Complexity is a
          # different matter: nothing in the tree exceeds 29, so 30 holds today
          # and is a ratchet that can be tightened.
          flake8 . --count --select=C901 --max-complexity=30 --show-source --statistics

          # Line length and the rest of the style backlog: reported, not gated.
          # Arming this needs the backlog cleared first, service by service.
          flake8 . --count --max-line-length=127 --statistics --exit-zero

  # Integration test - Disabled (requires full environment setup with secrets)
  # TODO: Re-enable with proper CI environment configuration
  # integration-test:
  #   name: Integration Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7
  #
  #     - name: Build and start services
  #       run: |
  #         docker compose up -d --build
  #         sleep 30
  #
  #     - name: Check services health
  #       run: |
  #         echo "Integration tests disabled - requires environment setup"

  # Summary job
  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5  # observed max 0.1 min
    needs:
      - validate-docker
      - validate-structure
      - dependency-integrity
      - python-quality
    if: always()
    steps:
      - name: Check validation results
        # This job is the one branch protection requires, so a job missing from
        # this test does not gate anything. A security job was once listed in
        # needs but never tested, and dependency-integrity was not listed at
        # all: both went red on PRs that could still be merged (#430). The
        # critical-advisory gate now lives in "Security Scanning" (test.yml),
        # which is itself a required check.
        run: |
          if [ "${{ needs.validate-docker.result }}" != "success" ] || \
             [ "${{ needs.validate-structure.result }}" != "success" ] || \
             [ "${{ needs.dependency-integrity.result }}" != "success" ] || \
             [ "${{ needs.python-quality.result }}" != "success" ]; then
            echo "❌ PR validation failed. Please fix the issues above."
            exit 1
          fi
          echo "✅ All PR validations passed!"
