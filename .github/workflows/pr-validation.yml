name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

jobs:
  # Validate docker-compose configuration
  validate-docker:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo "ERROR: docker-compose.yml is missing!"
            exit 1
          fi
          # compose interpolation uses ${VAR:?} for secrets (no insecure
          # defaults), and ${VAR:?} rejects an empty value as well as an unset
          # one -- so the template alone is not enough: its secret entries are
          # deliberately blank. Generate them the way the documented setup does,
          # which also proves that path still works.
          cp .env.example .env
          python3 scripts/generate_secrets.py --force
          docker compose config --quiet
          rm -f .env .env.env.backup
          echo "✓ docker-compose.yml is valid"

  # Check for critical files
  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check for critical service files
        run: |
          MISSING_FILES=()

          # List of critical files that must exist
          CRITICAL_FILES=(
            "docker-compose.yml"
            "open-security-agents/app/main.py"
            "open-security-cspm/app/main.py"
            "open-security-data/app/api/main.py"
            "open-security-guardian/guardian/settings.py"
            "open-security-identity/app/main.py"
            "open-security-responder/app/main.py"
            "open-security-sensor/sensor/api/local_api.py"
            "open-security-tools/app/tools/hash_generator/main.py"
          )

          for file in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
            fi
          done

          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "ERROR: The following critical files are missing:"
            printf '%s\n' "${MISSING_FILES[@]}"
            exit 1
          fi

          echo "✓ All critical service files exist"

  # Security checks
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          # Gates on CRITICAL. This used to be exit-code: '0' with the comment
          # "Don't fail on vulnerabilities yet", so a PR introducing a critical
          # advisory was indistinguishable from one that did not (WILDBO-DEP-03).
          # Starting at CRITICAL keeps the gate achievable; widen to
          # CRITICAL,HIGH once the current HIGH backlog is triaged.
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns (basic check)
          echo "Checking for hardcoded secrets..."

          # Skip .env files as they're examples
          git ls-files | grep -v "\.env\." | xargs grep -niE "password\s*=\s*['\"][^'\"]{3,}['\"]" || true
          git ls-files | grep -v "\.env\." | xargs grep -niE "api[_-]?key\s*=\s*['\"][^'\"]{8,}['\"]" || true
          git ls-files | grep -v "\.env\." | xargs grep -niE "secret[_-]?key\s*=\s*['\"][^'\"]{8,}['\"]" || true

          echo "✓ Basic secret scan complete (review output above)"

  # Dependency lockfiles must be current, and the SBOM must be producible.
  dependency-integrity:
    name: Dependency Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify lockfiles match requirements.in
        # Every service ships a hash-pinned requirements.txt compiled from
        # requirements.in. Seven of the eight used to have no lockfile at all,
        # so the transitive tree was re-resolved at every image build
        # (WILDBO-DEP-04/DEP-05).
        run: ./scripts/compile_requirements.sh --check

  # Python linting and type checking
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - open-security-agents
          - open-security-cspm
          - open-security-data
          - open-security-identity
          - open-security-responder
          - open-security-sensor
          - open-security-tools
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles(format('{0}/**/requirements*.txt', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install flake8 mypy

      - name: Run mypy
        # mypy and pylint were installed in all seven matrix legs and never
        # invoked (WILDBO-QUAL-08). pylint is dropped; mypy runs, reporting
        # rather than gating for now so the ratchet can start from a known count.
        continue-on-error: true
        run: |
          cd ${{ matrix.service }}
          mypy app --ignore-missing-imports --no-strict-optional || true

      - name: Run flake8
        run: |
          cd ${{ matrix.service }}
          # Syntax errors, undefined names and f-string/comparison bugs: always fatal.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity and line length now GATE. This pass used to carry
          # --exit-zero, so its findings were printed into the log and discarded,
          # which is how functions at CCN 36 passed validation unremarked
          # (WILDBO-QUAL-05). The threshold is set just above the current worst
          # first-party function (CCN 36) so it holds today and can be ratcheted
          # down; lowering it is a one-line change here.
          flake8 . --count --max-complexity=37 --max-line-length=127 --statistics

  # Integration test - Disabled (requires full environment setup with secrets)
  # TODO: Re-enable with proper CI environment configuration
  # integration-test:
  #   name: Integration Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7
  #
  #     - name: Build and start services
  #       run: |
  #         docker compose up -d --build
  #         sleep 30
  #
  #     - name: Check services health
  #       run: |
  #         echo "Integration tests disabled - requires environment setup"

  # Summary job
  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs:
      - validate-docker
      - validate-structure
      - security-scan
      - python-quality
    if: always()
    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.validate-docker.result }}" != "success" ] || \
             [ "${{ needs.validate-structure.result }}" != "success" ] || \
             [ "${{ needs.python-quality.result }}" != "success" ]; then
            echo "❌ PR validation failed. Please fix the issues above."
            exit 1
          fi
          echo "✅ All PR validations passed!"
