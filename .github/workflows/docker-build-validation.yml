name: Docker Build Validation

# Build (but never push) each service image on pull requests, so changes that
# touch the Docker builds — Dockerfiles, requirements, service code, the shared
# package, or compose — are validated before merge. The existing
# "Build Docker Images" job (test.yml) still builds and pushes on main only.
#
# The build is also the check that an image's environment satisfies what it
# installs (#722): each Python Dockerfile installs the shared package with the
# extras of the modules its service imports, offline, so pip must find their
# requirements in what the hash-checked lock installed, and then runs
# `pip check`. An image whose lock lacks a requirement, or pins it below the
# floor the shared package declares, does not build.
#
# Path-filtered so it doesn't run on docs-only PRs.

on:
  pull_request:
    paths:
      - 'open-security-*/Dockerfile'
      - 'open-security-*/Dockerfile.*'
      - 'open-security-*/requirements.txt'
      - 'open-security-*/app/**'
      - 'open-security-*/sensor/**'
      - 'open-security-*/setup.py'
      - 'open-security-*/pyproject.toml'
      - 'open-security-*/manage.py'
      - 'open-security-shared/**'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-build-validation.yml'

# Newer pushes to the same PR cancel in-flight builds.
concurrency:
  group: docker-build-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15  # observed max 3.8 min over the last 30 green runs
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity
          - tools
          - data
          - guardian
          - responder
          - agents
          - cspm
          # The sensor's image was built by no workflow: nothing in CI ran
          # its Dockerfile, hence nothing checked its environment.
          - sensor
          - gateway
          - dashboard
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./open-security-${{ matrix.service }}
          build-contexts: |
            shared=open-security-shared
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
