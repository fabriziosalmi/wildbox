name: Production Stack
permissions:
  contents: read

# The production configuration (docker-compose.yml + docker-compose.prod.yml)
# was never started by any job, which is how its network segmentation could be
# documented as PASS while every service still shared one flat network (#494),
# and how the overlay carried a guardian settings module that does not exist.
# This job renders it, starts it, runs the integration suite against it, and
# asserts the segmentation both on the rendered configuration and from inside
# the running containers.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/compose.ci-*.yml'
      - 'open-security-gateway/nginx/**'
      - 'scripts/check_network_segmentation.py'
      - 'scripts/check_redis_config.py'
      - 'scripts/generate_secrets.py'
      - '.env.example'
      - '.github/workflows/production-stack.yml'
  workflow_dispatch:

concurrency:
  group: production-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-stack:
    name: Production stack and network segmentation
    runs-on: ubuntu-latest
    timeout-minutes: 30  # observed max 7.9 min (21 green runs)
    env:
      # Every `docker compose` call in this job, including the ones inside
      # check_network_segmentation.py's runtime probes, addresses the same
      # stack. compose.ci-ports.yml and compose.ci-prod.yml publish PostgreSQL
      # on loopback for the cross-tenant test; see the comments in both.
      COMPOSE_FILE: docker-compose.yml:docker-compose.prod.yml:.github/compose.ci-ports.yml:.github/compose.ci-prod.yml
      # guardian-beat sends the alert-rule sweep every 15 s instead of every
      # 15 minutes, so the integration suite can watch a scheduled run happen
      # (#545). The suite reads it too, to size its deadline.
      GUARDIAN_SCHEDULE_ALERT_RULES: "15"
      # Likewise the user-schedule dispatcher, every 15 s instead of every
      # minute (#548).
      GUARDIAN_SCHEDULE_USER_SCHEDULES: "15"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Docker and Compose versions
        # docker-compose.prod.yml needs Compose 2.24.4+ for `!override`.
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version

      - name: Install test dependencies
        timeout-minutes: 5
        run: |
          pip install --quiet pytest pytest-asyncio requests httpx python-dotenv psycopg2-binary

      - name: Generate secrets
        # Same as integration-tests.yml: generated the way a fresh install
        # does it, no fallback secret.
        run: |
          cp .env.example .env
          python3 scripts/generate_secrets.py --force
          python3 scripts/validate_secrets.py

      - name: Raise the rate limit for the suite
        # See integration-tests.yml: the suite makes several hundred requests
        # with one key and would otherwise meet the limiter part-way through.
        run: sed -i "s/^RATE_LIMIT_PER_HOUR=.*/RATE_LIMIT_PER_HOUR=1000000/" .env

      - name: Segmentation in the rendered production configuration
        # base + prod only, every profile included: the configuration an
        # operator deploys, not the CI variant.
        run: python3 scripts/check_network_segmentation.py config

      - name: Redis keeps its state in the rendered production configuration
        # noeviction, a maxmemory, AOF, and a container limit of at least
        # twice maxmemory (#530): the overlay once set allkeys-lru, which
        # could evict the token blacklist, lockout counters and queues.
        run: python3 scripts/check_redis_config.py config

      - name: Start the production stack
        run: docker compose up -d --wait --wait-timeout 900
        # Image builds plus --wait-timeout above (15 min); observed max 5.0.
        timeout-minutes: 25

      - name: Show what came up
        if: always()
        run: |
          docker compose ps
          for n in frontend backend data egress; do
            echo "== $n"
            docker network inspect "$(docker compose config --format json | python3 -c "import json,sys;print(json.load(sys.stdin)['networks']['$n']['name'])")" \
              --format '{{range .Containers}}{{.Name}} {{end}}'
          done

      - name: Segmentation from inside the running containers
        run: python3 scripts/check_network_segmentation.py runtime

      - name: guardian-worker consumes the routed queues; guardian-beat is alone
        # The queues the running worker actually reads, against the ones
        # guardian/celery.py routes to (#545); and one beat container, since
        # a second would send every periodic task twice.
        run: |
          docker compose exec -T guardian-worker sh -c \
            'celery -A guardian inspect active_queues --json -d "celery@$HOSTNAME"' > queues.json
          python3 - <<'EOF'
          import json
          raw = open("queues.json").read()
          replies = json.loads(raw[raw.index("{"):])
          (queues,) = replies.values()
          got = sorted(q["name"] for q in queues)
          print("guardian-worker consumes:", got)
          assert got == ["analytics", "default", "reporting", "scanning"], got
          EOF
          beats="$(docker compose ps -q guardian-beat | wc -l)"
          echo "guardian-beat containers: $beats"
          test "$beats" -eq 1

      - name: identity applies the production CORS_ORIGINS
        # .env carries CORS_ORIGINS comma-separated; identity used to crash-loop
        # on that form and the overlay stopped passing it (#531). A preflight
        # from each configured origin must be allowed and one from elsewhere
        # refused, which shows the value is parsed and applied.
        run: |
          preflight() {
            curl -sS -o /dev/null -w '%{http_code}' -D headers.txt -X OPTIONS \
              -H "Origin: $1" -H 'Access-Control-Request-Method: GET' \
              http://localhost:8001/health
          }
          origins="$(sed -n 's/^CORS_ORIGINS=//p' .env | tail -1)"
          test -n "$origins"
          IFS=',' read -ra list <<< "$origins"
          for origin in "${list[@]}"; do
            origin="$(echo "$origin" | xargs)"
            code="$(preflight "$origin")"
            echo "allowed? $origin -> $code"
            test "$code" = 200
            grep -qi "^access-control-allow-origin: $origin" headers.txt
          done
          code="$(preflight https://not-configured.example)"
          echo "refused? https://not-configured.example -> $code"
          test "$code" = 400
          ! grep -qi '^access-control-allow-origin' headers.txt

      - name: Run Integration Tests
        run: |
          env_value() { sed -n "s/^$1=//p" .env | head -1; }
          INITIAL_ADMIN_EMAIL="$(env_value INITIAL_ADMIN_EMAIL)"
          INITIAL_ADMIN_PASSWORD="$(env_value INITIAL_ADMIN_PASSWORD)"
          GATEWAY_INTERNAL_SECRET="$(env_value GATEWAY_INTERNAL_SECRET)"
          SENSOR_API_KEY="$(env_value SENSOR_API_KEY)"
          DATA_DB_DSN="postgresql://postgres:$(env_value POSTGRES_PASSWORD)@localhost:5432/data"
          export INITIAL_ADMIN_EMAIL INITIAL_ADMIN_PASSWORD GATEWAY_INTERNAL_SECRET SENSOR_API_KEY DATA_DB_DSN
          python -m pytest tests/integration/ \
            -v -rs \
            --tb=short \
            --junit-xml=pytest-results.xml \
            -o addopts=""
        env:
          GATEWAY_URL: https://localhost
          REQUESTS_CA_BUNDLE: ${{ github.workspace }}/open-security-gateway/ssl/wildbox.crt
          IDENTITY_SERVICE_URL: http://localhost:8001
          TOOLS_SERVICE_URL: http://localhost:8000
          DATA_SERVICE_URL: http://localhost:8002
          RESPONDER_SERVICE_URL: http://localhost:8018
          CSPM_SERVICE_URL: http://localhost:8019
          AGENTS_SERVICE_URL: http://localhost:8006
          GUARDIAN_SERVICE_URL: http://localhost:8013
          SENSOR_SERVICE_URL: http://localhost:8004
          DASHBOARD_URL: http://localhost:3000
          # See integration-tests.yml: an unreachable service the stack starts
          # fails its tests rather than skipping them (#532).
          REQUIRE_ALL_SERVICES: "1"
        timeout-minutes: 20

      - name: Redis settings and memory use after the suite
        # The live CONFIG GET values and the limit Docker applied, plus the
        # peak memory the suite reached: the evidence for REDIS_MAXMEMORY.
        if: ${{ !cancelled() }}
        run: python3 scripts/check_redis_config.py runtime --env-file .env

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-stack-test-results
          path: pytest-results.xml
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v
