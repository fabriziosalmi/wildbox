name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  
# Least privilege: the token can read the repository and nothing else,
# unless a job below asks for more.
permissions:
  contents: read

# One run per pull request: a new push cancels the run it supersedes. Any
# other event (push to main, schedule, dispatch) gets a group of its own,
# so it is never cancelled -- not even while pending, which a shared group
# with cancel-in-progress: false would still do to a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 2.9 min
    strategy:
      matrix:
        python-version: ["3.11"]
        service:
          - identity
          - tools
          - data
          - guardian
          - responder
          - agents
          - cspm
          # The sensor was never in this matrix, so its unit tests -- and
          # until now it had none -- ran nowhere. Its package is sensor/,
          # not app/; see the coverage case below.
          - sensor
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # One key per service. Without a path the key hashed every
          # requirements file in the tree, so all eight legs shared one key
          # and the cache held whichever leg saved first.
          cache-dependency-path: open-security-${{ matrix.service }}/requirements.txt
      
      - name: Install dependencies for ${{ matrix.service }}
        timeout-minutes: 5  # observed max 0.9 min
        run: |
          cd open-security-${{ matrix.service }}
          # Python services import open_security_shared; install it so unit
          # tests that touch service code can import it (harmless otherwise).
          # The package has no dependency of its own (#722): what its modules
          # need comes from the service's lock on the next line, as in the
          # image, so a module the lock does not provide for fails here too.
          pip install ../open-security-shared || true
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Run unit tests
        run: |
          cd open-security-${{ matrix.service }}
          # Truthful gating: a service WITH unit tests must pass them (no
          # continue-on-error masking); a service WITHOUT them emits a visible
          # warning instead of a silent pytest exit-4. Coverage gaps for the
          # services that have no tests/unit/ are tracked in #245.
          # --cov=app is wrong for guardian, whose code lives in apps/ and
          # guardian/ (it is the one Django service): coverage was measured
          # against a package that does not exist there, so its report was
          # always empty while looking like it had been collected.
          case "${{ matrix.service }}" in
            guardian) COV="--cov=apps --cov=guardian" ;;
            sensor)   COV="--cov=sensor" ;;
            *)        COV="--cov=app" ;;
          esac
          if [ -d tests/unit ] && [ -n "$(find tests/unit -name 'test_*.py' -print -quit)" ]; then
            pytest tests/unit/ -v $COV --cov-report=xml --cov-report=term
          else
            echo "::warning title=No unit tests::open-security-${{ matrix.service }} has no tests/unit/ — coverage gap tracked in #245"
          fi

      - name: Upload coverage to Codecov
        if: ${{ hashFiles(format('open-security-{0}/coverage.xml', matrix.service)) != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ./open-security-${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}-unit
          name: ${{ matrix.service }}-unit-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  shared-package-tests:
    name: Shared Package Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.4 min
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: open-security-shared/pyproject.toml

      - name: Install
        timeout-minutes: 5
        run: |
          # The extras of the modules tests/shared imports: the package
          # itself requires nothing (#722).
          pip install "./open-security-shared[fastapi,auth,metrics]"
          # pyyaml: tests/scripts reads the workflows (check_test_collection).
          # packaging: check_shared_dependencies compares pins and floors.
          pip install pytest pytest-asyncio httpx pyyaml packaging

      - name: Run shared package tests
        # open_security_shared holds gateway_auth and tenancy -- the trust and
        # tenancy boundary for four services -- and had no tests of its own
        # (WILDBO-TEST-03). These are pure-function tests; they need no stack.
        run: pytest tests/shared -v -p no:cacheprovider -o addopts=""

      - name: Run script tests
        # scripts/generate_secrets.py has to produce values the validators that
        # read them back will accept. It did not: 2.89% of generated API keys
        # tripped the tools service's weak-pattern check and killed it at
        # start-up. tests/scripts had no CI step at all; this is where it runs.
        #
        # The backup, restore and rotation tests also start a throwaway
        # PostgreSQL and Redis with the runner's Docker, under their own
        # Compose project names, and skip where Docker is missing. Here they
        # must run: with this variable tests/scripts/conftest.py fails every
        # test of the directory that would be skipped, whatever skipped it
        # (#723). tests/scripts/test_docker_tests_must_run.py fails if this
        # step loses the variable.
        env:
          WILDBOX_REQUIRE_DOCKER_TESTS: "1"
        run: pytest tests/scripts -v -p no:cacheprovider -o addopts=""

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20  # observed max 8.3 min (Playwright's apt dependencies)
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: open-security-dashboard/package-lock.json
      
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          cd open-security-dashboard
          npm ci
      
      - name: Install Playwright Browsers
        timeout-minutes: 15  # see e2e-fullstack.yml: once 8.0 min on apt mirrors
        run: |
          cd open-security-dashboard
          npx playwright install --with-deps chromium
      
      - name: Build dashboard
        run: |
          cd open-security-dashboard
          npm run build

      - name: Run Playwright frontend smoke tests
        run: |
          cd open-security-dashboard
          # Frontend-only smoke: these specs are backend-free by design (they
          # assert the dashboard builds, the login UI renders, form validation,
          # and the client-side auth-guard redirects), plus tool-schema.spec.ts,
          # the toolbox's schema-to-form mapping, which needs no page (#585).
          # The backend-dependent specs are tagged @backend and run against
          # the full compose stack in e2e-fullstack.yml (#103).
          npx playwright test --project=chromium \
            tests/e2e/admin-ui-only.spec.ts \
            tests/e2e/quick-login-test.spec.ts \
            tests/e2e/tool-schema.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: open-security-dashboard/playwright-report/
          retention-days: 30

  dashboard-lint:
    # The Code Quality job below is Python-only; the dashboard's ESLint,
    # Prettier and TypeScript checks ran nowhere and drifted (#528).
    name: Dashboard Lint / Format / Types
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.8 min
    defaults:
      run:
        working-directory: open-security-dashboard

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: open-security-dashboard/package-lock.json

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npx tsc --noEmit

  security-scan:
    # The one job that runs Trivy and Bandit, on pull requests and on main.
    #
    # Trivy used to run in two jobs on every pull request -- this one and
    # "Security Scan" in pr-validation.yml -- uploading the same scan to code
    # scanning twice under two automatic categories, and Bandit's report went
    # to an artifact nobody read. Each tool now runs once and uploads under a
    # fixed category, so the analysis of a pull request is compared with the
    # analysis of main under the same name.
    #
    # "Security Scanning" is a required status check: keep the name.
    permissions:
      contents: read
      security-events: write
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.7 min here + 1.2 min for the gate

    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: Trivy, every finding (SARIF for code scanning)
        # All severities, reported rather than gated; the gate is a separate
        # pass below, because `severity` and SARIF output do not combine (the
        # SARIF writer reports every severity whatever the filter says).
        run: trivy fs --quiet --format sarif --output trivy-results.sarif --exit-code 0 .

      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"

      - name: Fail on critical advisories this PR introduces
        # Gates (WILDBO-DEP-03), but only on what the PR adds (#430). Failing
        # on every critical in the tree turned all open PRs red the day an
        # advisory was published against something already on main, whatever
        # they touched; those are reported on main by main-advisories.yml
        # instead. Starting at CRITICAL keeps the gate achievable; widen to
        # CRITICAL,HIGH once the current HIGH backlog is triaged.
        if: github.event_name == 'pull_request'
        run: ./scripts/critical_advisories.sh new . "$RUNNER_TEMP/base"

      - name: Upload Trivy results
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Bandit (SARIF for code scanning)
        # Every Python service's own package. Guardian's code is in apps/ and
        # guardian/, the sensor's in sensor/ and the shared package's at its
        # root, so the old `open-security-*/app` skipped all three. Reported,
        # not gated. Medium severity and confidence and up: below that, Bandit
        # reports patterns such as try/except/pass and string constants named
        # like passwords, which would bury the findings worth acting on.
        timeout-minutes: 5
        run: |
          pip install --quiet "bandit[sarif]==1.8.6"
          bandit --quiet --recursive --exit-zero \
            --severity-level medium --confidence-level medium \
            --exclude '*/tests/*,*/migrations/*' \
            --format sarif --output bandit-results.sarif \
            open-security-agents/app open-security-cspm/app \
            open-security-data/app open-security-identity/app \
            open-security-responder/app open-security-tools/app \
            open-security-guardian/apps open-security-guardian/guardian \
            open-security-sensor/sensor open-security-shared

      - name: Upload Bandit results
        if: ${{ !cancelled() && hashFiles('bandit-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.4 min

    steps:
      - uses: actions/checkout@v7
        with:
          # Need history to diff against the base for the new-files gate.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install black flake8 isort pyyaml

      # A test file that no workflow collects never runs: it cannot catch a
      # regression and drifts from the code unnoticed. tests/test_basic.py in
      # the agents service did both (#582). The check derives what CI collects
      # from the workflows' own pytest commands; deliberate exceptions go in
      # scripts/test_collection_allowlist.txt with a reason.
      - name: Every test file is collected by a workflow
        run: python scripts/check_test_collection.py

      # Prometheus evaluated monitoring/alert_rules.yml and had nowhere to
      # send what fired: no Alertmanager, no `alerting:` section (#658). And
      # nothing ever read the rules: a rule on a metric that does not exist
      # loads without a word. This checks the monitoring profile statically
      # (Alertmanager defined and hardened, Prometheus pointed at it, a
      # default receiver that sends nowhere named for it, no secret inline),
      # then runs `promtool check config`, `promtool test rules` and
      # `amtool check-config` from the images docker-compose.yml names, so a
      # broken rule or configuration fails here and not on a server.
      - name: Monitoring profile delivers alerts; rules and Alertmanager config are valid
        run: python3 scripts/check_monitoring_config.py

      # WILDBO-QUAL-03: every step in this job used to carry
      # continue-on-error: true, so "Code Quality" reported success no matter
      # how many violations existed, and build-images did not even depend on it.
      #
      # The whole tree is not style-clean -- black would reformat 455 files and
      # a full flake8 reports ~8200 violations -- so a single tree-wide style
      # gate would fail every build and be switched off within a week. Instead
      # there are three tiers, and the first two genuinely block:
      #
      #   1. correctness, whole tree      -- syntax errors, undefined names,
      #                                      broken comparisons. Zero today.
      #   2. style, open-security-shared  -- the package every service imports.
      #                                      Clean today, kept clean.
      #   3. style, files added by the change -- new code must be formatted, so
      #                                      the backlog stops growing.
      #
      # Style on *modified* legacy files is reported but not enforced (tier 4),
      # because touching one line of an unformatted 400-line module would
      # otherwise force an unrelated reformat into the diff. To widen tier 2,
      # reformat a service and add its path to that step.

      # The n8n workflows are JSON that nothing else executes in CI, so a
      # removed or renamed endpoint broke them silently: the executive
      # dashboard workflow called two endpoints that did not exist (#592).
      # This resolves every HTTP node's URL against the gateway's locations
      # and the target service's routes. Standard library only.
      - name: Automation workflows call existing API routes
        run: python3 scripts/check_automation_workflows.py

      # The gateway's development Compose file mounted /var/run/docker.sock
      # into gliderlabs/logspout:latest (#680): root on the host for an
      # unmaintained image at whatever version the registry served. Only the
      # root Compose file was ever validated, so nothing noticed. This reads
      # every tracked Compose file and refuses a runtime socket mount, an
      # image that names no version, a privileged setting and a port
      # published on every interface; deliberate exceptions go in
      # scripts/container_hygiene_allowlist.txt with a reason.
      #
      # The same script reads every tracked Dockerfile (#657): four images
      # ran `pip install --upgrade pip` before the hash-checked install, and
      # all eight let pip download setuptools to build the shared package.
      # It refuses a pip install that is not hash-checked or offline, an npm
      # install that is not `npm ci`, a base image without a digest, and a
      # download that is piped to a shell or that nothing verifies.
      - name: Compose files and Dockerfiles pin and verify what they run
        run: python3 scripts/check_container_hygiene.py

      # Tier 1 -- real defects, whole tree, always blocking.
      - name: Flake8 (correctness, whole tree)
        run: |
          flake8 open-security-*/app open-security-*/tests scripts tests \
            --select=E9,F63,F7,F82 \
            --extend-exclude=build,node_modules

      # Tier 2 -- full style gate on the shared package.
      - name: Black / isort / Flake8 (shared package)
        run: |
          black --check open-security-shared --extend-exclude 'build/'
          isort --check-only --profile black open-security-shared --skip build
          flake8 open-security-shared --max-line-length=120 \
            --extend-ignore=E203,W503 --extend-exclude=build

      - name: Determine Python files added by this change
        id: added
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          added=$(git diff --name-only --diff-filter=A "$base" HEAD -- '*.py' | tr '\n' ' ')
          modified=$(git diff --name-only --diff-filter=M "$base" HEAD -- '*.py' | tr '\n' ' ')
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "modified=$modified" >> "$GITHUB_OUTPUT"
          echo "Added: ${added:-none}"
          echo "Modified: ${modified:-none}"

      # Tier 3 -- new files must be clean. Blocking.
      - name: Black / isort / Flake8 (files added by this change)
        if: steps.added.outputs.added != ''
        run: |
          black --check ${{ steps.added.outputs.added }}
          isort --check-only --profile black ${{ steps.added.outputs.added }}
          flake8 ${{ steps.added.outputs.added }} --max-line-length=120 --extend-ignore=E203,W503

      # Tier 4 -- backlog visibility on modified legacy files. Reported only.
      - name: Style report (modified files, informational)
        if: steps.added.outputs.modified != ''
        continue-on-error: true
        run: |
          echo "::group::black"
          black --check --diff ${{ steps.added.outputs.modified }} || true
          echo "::endgroup::"
          echo "::group::flake8"
          flake8 ${{ steps.added.outputs.modified }} --max-line-length=120 --extend-ignore=E203,W503 || true
          echo "::endgroup::"

  build-images:
    # Pushes images to GHCR (main only).
    permissions:
      contents: read
      packages: write
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20  # observed max 6.3 min
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # lint is in needs so a failing quality gate actually blocks the image
    # build; it used to be absent, which made the gate decorative twice over
    # (WILDBO-QUAL-03).
    needs: [unit-tests, shared-package-tests, e2e-tests, lint, dashboard-lint]
    
    strategy:
      matrix:
        service:
          - identity
          - tools
          - data
          - guardian
          - responder
          - agents
          - cspm
          - gateway
          - dashboard
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/open-security-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      # Build the image locally first: the SBOM has to come from the image, not
      # from the source tree. A filesystem scan lists 141 components for the
      # data service and a licence for none of them, so a licence gate reading
      # it can never fire (WILDBO-DEP-06).
      - name: Build image locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: ./open-security-${{ matrix.service }}
          build-contexts: |
            shared=open-security-shared
          load: true
          push: false
          tags: wildbox-${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        # No SBOM was produced for any image, so a consumer could not enumerate
        # what was inside one (WILDBO-DEP-06). Scanning the image resolves the
        # installed distributions and their licences.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'wildbox-${{ matrix.service }}:scan'
          format: 'cyclonedx'
          output: 'sbom-${{ matrix.service }}.cdx.json'
          exit-code: '0'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90

      - name: Check dependency licences
        # Blocking. Fails when a copyleft dependency reaches a service that
        # ships under MIT. Scoped to language packages: the Alpine/Debian base
        # is GPL by nature and is not linked into our code.
        #
        # This step used to be `pip install pip-licenses` followed by an echo,
        # with continue-on-error on top -- it inspected nothing and could not
        # fail (WILDBO-DEP-06, WILDBO-QUAL-03).
        run: |
          python scripts/check_sbom_licences.py --list sbom-${{ matrix.service }}.cdx.json
          python scripts/check_sbom_licences.py sbom-${{ matrix.service }}.cdx.json

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./open-security-${{ matrix.service }}
          build-contexts: |
            shared=open-security-shared
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bakes the commit into the image so it can be traced without the
          # registry tag (WILDBO-BLD-03).
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
