name: Integration Tests
permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-level env: block here, deliberately.
#
# There used to be one setting POSTGRES_PASSWORD, DATABASE_URL, JWT_SECRET_KEY,
# API_KEY, GATEWAY_INTERNAL_SECRET and others from repository secrets with
# hardcoded fallbacks. Shell environment variables win over .env in docker
# compose interpolation, so once this job started generating its own .env the
# two mechanisms disagreed -- and they disagreed *partially*, which is worse
# than either alone:
#
#   postgres        <- POSTGRES_PASSWORD from the workflow env
#   identity        <- DATABASE_URL from the workflow env      (matches)
#   guardian, data  <- GUARDIAN_/DATA_DATABASE_URL from .env   (does not)
#
# so PostgreSQL was created with one password while guardian and data connected
# with another, and every run ended in
#   FATAL: password authentication failed for user "postgres"
# with the gateway unhealthy behind them because it depends on both.
#
# scripts/generate_secrets.py now produces every required value, which also
# removes the reason those fallbacks existed: a fork PR or a dependabot run
# receives no repository secrets, and does not need any.

# One run per pull request: a new push cancels the run it supersedes. Any
# other event (push to main, schedule, dispatch) gets a group of its own,
# so it is never cancelled -- not even while pending, which a shared group
# with cancel-in-progress: false would still do to a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35  # observed max 11.7 min (54 green runs)

    # The whole stack, through docker compose, instead of five services started
    # by hand with pip.
    #
    # The old shape started identity, tools, data, responder and cspm as bare
    # processes and no gateway, with GATEWAY_URL pointing at a port nothing
    # listened on. Every test that goes through the gateway -- which is most of
    # them, because the services answer 403 GATEWAY_AUTH_REQUIRED to a direct
    # connection -- was skipped by the reachability guard. That is how the suite
    # stayed green for months while asserting against endpoints no service had
    # ever published.
    #
    # It costs more: ten images build here. The "Build the images" step reads
    # and writes their layers through the GitHub Actions cache.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        timeout-minutes: 5
        run: |
          pip install --quiet pytest pytest-asyncio requests httpx python-dotenv psycopg2-binary

      - name: Generate secrets
        # Every required variable, generated the way a fresh install does it.
        # There is no fallback secret here on purpose: a run that cannot make
        # its own secrets should fail rather than test a half-configured stack.
        run: |
          cp .env.example .env
          python3 scripts/generate_secrets.py --force
          python3 scripts/validate_secrets.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose the Actions cache to BuildKit
        # The gha cache backend authenticates with the runner's cache token
        # and URLs, which only JavaScript actions receive (docker/build-push-
        # action does the same internally).
        uses: actions/github-script@v9
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL',
                                'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      - name: Build the images
        # Separate from start-up so its duration is the build alone. The
        # cache file adds cache_from/cache_to per image; see the comment in it.
        timeout-minutes: 20
        run: |
          docker compose -f docker-compose.yml -f .github/compose.ci-ports.yml \
            -f .github/compose.ci-cache.yml build

      - name: Raise the rate limit for the suite
        # The gateway allows RATE_LIMIT_PER_HOUR/60 requests per minute per team
        # (166 by default) and the suite makes several hundred with one key, so
        # tests part-way through the run started failing with 429 -- the limiter
        # working correctly, on a workload it was never meant to shape. Rate
        # limiting itself is covered by test_rate_limiting, which reads the
        # budget headers rather than trying to exhaust them.
        # Replaced in place, not appended: .env.example already defines the
        # key, and two definitions leave which one wins up to the reader.
        run: sed -i "s/^RATE_LIMIT_PER_HOUR=.*/RATE_LIMIT_PER_HOUR=1000000/" .env

      - name: Start the stack
        # No `. ./.env`: docker compose reads it from the project directory by
        # itself, and sourcing it as shell makes every secret a potential
        # syntax error.
        # The extra file publishes PostgreSQL on loopback so the cross-tenant
        # test can seed rows directly; see the comment in it.
        run: docker compose -f docker-compose.yml -f .github/compose.ci-ports.yml up -d --wait --wait-timeout 600
        # --wait-timeout above (10 min) and a margin. Before the build had a
        # step of its own this step took up to 8.2 min, builds included.
        timeout-minutes: 15
        env:
          # guardian-beat sends the alert-rule sweep every 15 s instead of
          # every 15 minutes, so that test_scheduled_task_runs_on_its_own can
          # watch a scheduled run happen (#545). Not a secret and not in .env,
          # so it cannot disagree with it (see the note at the top).
          GUARDIAN_SCHEDULE_ALERT_RULES: "15"
          # The user-schedule dispatcher every 15 s instead of every minute,
          # so the report-schedule and discovery-rule tests finish sooner
          # (#548).
          GUARDIAN_SCHEDULE_USER_SCHEDULES: "15"

      - name: Show what came up
        if: always()
        run: docker compose -f docker-compose.yml -f .github/compose.ci-ports.yml ps

      - name: Run Integration Tests
        run: |
          # Read the two values this step needs out of .env rather than sourcing
          # the file: `. ./.env` executes it, and a generated secret is not
          # shell syntax.
          env_value() { sed -n "s/^$1=//p" .env | head -1; }
          INITIAL_ADMIN_EMAIL="$(env_value INITIAL_ADMIN_EMAIL)"
          INITIAL_ADMIN_PASSWORD="$(env_value INITIAL_ADMIN_PASSWORD)"
          GATEWAY_INTERNAL_SECRET="$(env_value GATEWAY_INTERNAL_SECRET)"
          SENSOR_API_KEY="$(env_value SENSOR_API_KEY)"
          # An `env` context expression is evaluated before any step runs, so
          # it cannot carry a value this job generated.
          DATA_DB_DSN="postgresql://postgres:$(env_value POSTGRES_PASSWORD)@localhost:5432/data"
          # test_team_removal_sessions seeds a second team membership, which
          # no API can create (#613).
          IDENTITY_DB="$(env_value POSTGRES_DB)"
          IDENTITY_DB_DSN="postgresql://postgres:$(env_value POSTGRES_PASSWORD)@localhost:5432/${IDENTITY_DB:-identity}"
          export INITIAL_ADMIN_EMAIL INITIAL_ADMIN_PASSWORD GATEWAY_INTERNAL_SECRET SENSOR_API_KEY DATA_DB_DSN IDENTITY_DB_DSN
          python -m pytest tests/integration/ \
            -v -rs \
            --tb=short \
            --junit-xml=pytest-results.xml \
            -o addopts=""
        env:
          # The API is served over HTTPS only: port 80 answers /health and
          # 301-redirects everything else, so authentication cannot happen in
          # clear. The gateway's development certificate is generated at
          # start-up and trusted here rather than turning verification off --
          # otherwise the suite would also pass against a gateway presenting no
          # valid certificate, which is one of the things it exists to catch.
          GATEWAY_URL: https://localhost
          REQUESTS_CA_BUNDLE: ${{ github.workspace }}/open-security-gateway/ssl/wildbox.crt
          IDENTITY_SERVICE_URL: http://localhost:8001
          TOOLS_SERVICE_URL: http://localhost:8000
          DATA_SERVICE_URL: http://localhost:8002
          RESPONDER_SERVICE_URL: http://localhost:8018
          CSPM_SERVICE_URL: http://localhost:8019
          AGENTS_SERVICE_URL: http://localhost:8006
          GUARDIAN_SERVICE_URL: http://localhost:8013
          SENSOR_SERVICE_URL: http://localhost:8004
          DASHBOARD_URL: http://localhost:3000
          # Every service this job starts must answer: an unreachable one fails
          # its tests instead of skipping them, which is how guardian's tests
          # went unrun on every green build (#532). Services behind a compose
          # profile the job does not enable (automations) still skip.
          REQUIRE_ALL_SERVICES: "1"
          # The intervals the stack was started with (step above); the
          # scheduled-run tests size their deadlines on them.
          GUARDIAN_SCHEDULE_ALERT_RULES: "15"
          GUARDIAN_SCHEDULE_USER_SCHEDULES: "15"
        timeout-minutes: 20

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      # The tail above is 200 lines per service, interleaved, so the request
      # that failed is often already out of it: the 500 of #619 left only
      # "HTTP request failed" from the tools service. Every service's full
      # log goes into an artifact, one file each, with the tools service's
      # failures and tracebacks printed here. Container logs and states
      # only: nothing here prints the environment or .env.
      - name: Collect service diagnostics
        if: failure()
        run: |
          out=integration-diagnostics
          mkdir -p "$out"
          docker compose ps -a > "$out/compose-ps.txt" 2>&1 || true
          for svc in $(docker compose ps -a --format '{{.Service}}' | sort -u); do
            docker compose logs --timestamps --no-color "$svc" > "$out/$svc.log" 2>&1 || true
          done
          for svc in api tools-worker; do
            echo "--- $svc: failed requests and tracebacks ---"
            grep -nE '" 5[0-9]{2} |request failed|Traceback|Error' "$out/$svc.log" | tail -50 || true
          done

      - name: Upload service diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics
          path: integration-diagnostics/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: pytest-results.xml
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v

  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10  # observed max 0.2 min
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Security Validation Script
        run: |
          chmod +x scripts/shell-scripts/security_validation_v2.sh
          ./scripts/shell-scripts/security_validation_v2.sh

      - name: Check for hardcoded secrets
        run: |
          # Fail if any hardcoded passwords found
          if grep -r "PASSWORD=.*[^$]" docker-compose.yml open-security-*/docker-compose.yml | grep -v "\${" | grep -v "^#"; then
            echo "❌ Hardcoded secrets detected!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Check for unpinned dependencies
        run: |
          # This step used to grep only for ":latest" in the compose files and
          # then print "All Docker images pinned" -- a conclusion it had not
          # checked, and one that was false: every Dockerfile FROM used a
          # floating tag (WILDBO-TEST-02). It now verifies both, and its message
          # matches what it verified.
          fail=0

          if grep -r "image:.*:latest" docker-compose.yml open-security-*/docker-compose.yml | grep -v "^#"; then
            echo "❌ :latest image tag found in a compose file"
            fail=1
          fi

          # Every FROM in a Dockerfile must be digest-pinned (or reference an
          # earlier build stage by name).
          # -h suppresses filenames, so a "| grep -v node_modules" filter after it
          # can never match; exclude vendored trees by path with --exclude-dir.
          unpinned=$(grep -rhE '^FROM ' --include="Dockerfile*" \
            --exclude-dir=node_modules --exclude-dir=.venv . \
            | grep -vE '@sha256:' \
            | grep -vE '^FROM [A-Za-z0-9_.-]+ AS ' \
            | grep -vE '^FROM (base|builder|deps|runner)\b' || true)
          if [ -n "$unpinned" ]; then
            echo "❌ Dockerfile base images are not digest-pinned:"
            echo "$unpinned"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ Compose images carry no :latest tag and all Dockerfile base images are digest-pinned"

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-validation-report
          path: security-validation-results.txt
          retention-days: 30
