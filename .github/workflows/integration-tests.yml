name: Integration Tests
permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # SECURITY: All secrets sourced from GitHub Secrets.
  # Configure these in repo Settings > Secrets and variables > Actions.
  # For initial setup, generate random values with: openssl rand -hex 32
  #
  # Every reference carries a `|| 'ci-fallback-...'` default: fork PRs and
  # dependabot runs never receive repo Actions secrets, so without a fallback
  # this job fails deterministically for every external contribution (empty
  # JWT_SECRET_KEY fails identity's min_length=32 validation during alembic
  # migrations — same class as the POSTGRES_HOST_AUTH_METHOD: trust
  # accommodation below). The stack is ephemeral CI-only, like the hardcoded
  # test SECRET_KEYs already used for the data/cspm services. Fallbacks meet
  # the services' validators: >=32 chars, and tools' API_KEY must not contain
  # password/secret/key/admin/test/demo/123/abc/default/wildbox/api-key.
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-fallback-jwt-signing-string-for-fork-runs' }}
  API_KEY: ${{ secrets.API_KEY || 'ci-fallback-tools-auth-value-for-fork-runs' }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci-fallback-postgres-pw' }}
  DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.POSTGRES_PASSWORD || 'ci-fallback-postgres-pw' }}@postgres:5432/identity
  REDIS_URL: redis://redis:6379/0
  GATEWAY_INTERNAL_SECRET: ${{ secrets.GATEWAY_INTERNAL_SECRET || 'ci-fallback-gateway-proof-of-origin-value' }}
  N8N_BASIC_AUTH_USER: admin
  N8N_BASIC_AUTH_PASSWORD: ${{ secrets.N8N_BASIC_AUTH_PASSWORD || 'ci-fallback-n8n-pw' }}
  GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD || 'ci-fallback-grafana-pw' }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-fallback-nextauth-string-for-fork-runs' }}

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The whole stack, through docker compose, instead of five services started
    # by hand with pip.
    #
    # The old shape started identity, tools, data, responder and cspm as bare
    # processes and no gateway, with GATEWAY_URL pointing at a port nothing
    # listened on. Every test that goes through the gateway -- which is most of
    # them, because the services answer 403 GATEWAY_AUTH_REQUIRED to a direct
    # connection -- was skipped by the reachability guard. That is how the suite
    # stayed green for months while asserting against endpoints no service had
    # ever published.
    #
    # It costs more: ten images build here. `cache-from: type=gha` in the build
    # step below keeps the common case to a pull of cached layers.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install --quiet pytest pytest-asyncio requests httpx python-dotenv psycopg2-binary

      - name: Generate secrets
        # Every required variable, generated the way a fresh install does it.
        # There is no fallback secret here on purpose: a run that cannot make
        # its own secrets should fail rather than test a half-configured stack.
        run: |
          cp .env.example .env
          python3 scripts/generate_secrets.py --force
          python3 scripts/validate_secrets.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start the stack
        # No `. ./.env`: docker compose reads it from the project directory by
        # itself, and sourcing it as shell makes every secret a potential
        # syntax error.
        run: docker compose up -d --wait --wait-timeout 600

      - name: Show what came up
        if: always()
        run: docker compose ps

      - name: Run Integration Tests
        run: |
          # Read the two values this step needs out of .env rather than sourcing
          # the file: `. ./.env` executes it, and a generated secret is not
          # shell syntax.
          env_value() { sed -n "s/^$1=//p" .env | head -1; }
          export INITIAL_ADMIN_EMAIL="$(env_value INITIAL_ADMIN_EMAIL)"
          export INITIAL_ADMIN_PASSWORD="$(env_value INITIAL_ADMIN_PASSWORD)"
          export GATEWAY_INTERNAL_SECRET="$(env_value GATEWAY_INTERNAL_SECRET)"
          export SENSOR_API_KEY="$(env_value SENSOR_API_KEY)"
          # ${{ env.* }} is evaluated before any step runs, so it cannot carry a
          # value this job generated.
          export DATA_DB_DSN="postgresql://postgres:$(env_value POSTGRES_PASSWORD)@localhost:5432/data"
          python -m pytest tests/integration/ \
            -v -rs \
            --tb=short \
            --junit-xml=pytest-results.xml \
            -o addopts=""
        env:
          # The API is served over HTTPS only: port 80 answers /health and
          # 301-redirects everything else, so authentication cannot happen in
          # clear. The gateway's development certificate is generated at
          # start-up and trusted here rather than turning verification off --
          # otherwise the suite would also pass against a gateway presenting no
          # valid certificate, which is one of the things it exists to catch.
          GATEWAY_URL: https://localhost
          REQUESTS_CA_BUNDLE: ${{ github.workspace }}/open-security-gateway/ssl/wildbox.crt
          IDENTITY_SERVICE_URL: http://localhost:8001
          TOOLS_SERVICE_URL: http://localhost:8000
          DATA_SERVICE_URL: http://localhost:8002
          RESPONDER_SERVICE_URL: http://localhost:8018
          CSPM_SERVICE_URL: http://localhost:8019
          AGENTS_SERVICE_URL: http://localhost:8006
          GUARDIAN_SERVICE_URL: http://localhost:8013
          SENSOR_SERVICE_URL: http://localhost:8004
          DASHBOARD_URL: http://localhost:3000
        timeout-minutes: 20

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: pytest-results.xml
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v

  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Security Validation Script
        run: |
          chmod +x scripts/shell-scripts/security_validation_v2.sh
          ./scripts/shell-scripts/security_validation_v2.sh

      - name: Check for hardcoded secrets
        run: |
          # Fail if any hardcoded passwords found
          if grep -r "PASSWORD=.*[^$]" docker-compose.yml open-security-*/docker-compose.yml | grep -v "\${" | grep -v "^#"; then
            echo "❌ Hardcoded secrets detected!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Check for unpinned dependencies
        run: |
          # This step used to grep only for ":latest" in the compose files and
          # then print "All Docker images pinned" -- a conclusion it had not
          # checked, and one that was false: every Dockerfile FROM used a
          # floating tag (WILDBO-TEST-02). It now verifies both, and its message
          # matches what it verified.
          fail=0

          if grep -r "image:.*:latest" docker-compose.yml open-security-*/docker-compose.yml | grep -v "^#"; then
            echo "❌ :latest image tag found in a compose file"
            fail=1
          fi

          # Every FROM in a Dockerfile must be digest-pinned (or reference an
          # earlier build stage by name).
          # -h suppresses filenames, so a "| grep -v node_modules" filter after it
          # can never match; exclude vendored trees by path with --exclude-dir.
          unpinned=$(grep -rhE '^FROM ' --include="Dockerfile*" \
            --exclude-dir=node_modules --exclude-dir=.venv . \
            | grep -vE '@sha256:' \
            | grep -vE '^FROM [A-Za-z0-9_.-]+ AS ' \
            | grep -vE '^FROM (base|builder|deps|runner)\b' || true)
          if [ -n "$unpinned" ]; then
            echo "❌ Dockerfile base images are not digest-pinned:"
            echo "$unpinned"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✅ Compose images carry no :latest tag and all Dockerfile base images are digest-pinned"

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-validation-report
          path: security-validation-results.txt
          retention-days: 30
