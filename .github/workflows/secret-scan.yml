name: Secret Scan

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# One run per pull request: a new push cancels the run it supersedes. Any
# other event (push to main, schedule, dispatch) gets a group of its own,
# so it is never cancelled -- not even while pending, which a shared group
# with cancel-in-progress: false would still do to a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    # Server-side backstop for secret leaks. The repo already ships
    # .githooks/pre-commit and .pre-commit-config.yaml, but hooks are opt-in
    # per clone (they need `git config core.hooksPath .githooks`), so nothing
    # stopped three high-entropy keys from being committed. This job cannot be
    # skipped by forgetting a local setup step.
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run gitleaks
        # --no-git scans the checked-out tree rather than replaying history:
        # the goal is to keep NEW secrets out. Three dead keys were committed
        # before any scanning existed; history is deliberately not rewritten
        # (10 public forks — a rewrite breaks them all and un-leaks nothing),
        # so a history scan would fail forever and teach everyone to ignore
        # this job.
        run: |
          VERSION=8.30.0
          # The linux_x64 line of the release's gitleaks_8.30.0_checksums.txt;
          # change it together with VERSION. The archive used to be unpacked
          # and run as downloaded: a version in a URL does not say which
          # bytes are behind it (#726).
          SHA256=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 30
