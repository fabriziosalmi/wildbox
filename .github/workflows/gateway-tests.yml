name: Gateway Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# NOTE: Lua linting (luacheck + .luacheckrc) lives in gateway-lint.yml
# (PR #258) — this workflow covers the behavioral auth tests only, so the
# two PRs stay orthogonal and mergeable in either order.
# One run per pull request: a new push cancels the run it supersedes. Any
# other event (push to main, schedule, dispatch) gets a group of its own,
# so it is never cancelled -- not even while pending, which a shared group
# with cancel-in-progress: false would still do to a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auth-tests:
    name: Gateway Auth Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ephemeral CI-only proof-of-origin value shared by the mock identity
      # and the correctly-configured gateway; gateway-wrong-secret gets a
      # different one to prove the rejection path (#133/#134).
      CI_GATEWAY_SECRET: ci-gateway-proof-of-origin-fixture-value
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build gateway test image
        run: docker build -f open-security-gateway/Dockerfile.test -t wildbox-gateway-test open-security-gateway

      - name: Start mock identity and gateways
        run: |
          docker network create gwtest
          docker run -d --name identity-test --network gwtest -p 8001:8001 \
            -e EXPECTED_GATEWAY_SECRET="$CI_GATEWAY_SECRET" \
            -v "$PWD/open-security-gateway/test/mock_identity.py:/mock_identity.py:ro" \
            python:3.12-alpine python /mock_identity.py
          # 8081 is the internal listener (auth-cache purge). Published on the
          # loopback here only, for revocation_tests.sh; never in compose.
          docker run -d --name gateway --network gwtest -p 8080:80 -p 127.0.0.1:8082:8081 \
            -e GATEWAY_INTERNAL_SECRET="$CI_GATEWAY_SECRET" \
            -e IDENTITY_SERVICE_URL=http://identity-test:8001 \
            wildbox-gateway-test
          docker run -d --name gateway-wrong-secret --network gwtest -p 8081:80 \
            -e GATEWAY_INTERNAL_SECRET=not-the-right-proof-of-origin \
            -e IDENTITY_SERVICE_URL=http://identity-test:8001 \
            wildbox-gateway-test
          # A low per-team budget: 120 an hour is 2 requests a minute, which
          # ci_auth_tests.sh exhausts (#627).
          docker run -d --name gateway-low-limit --network gwtest -p 8083:80 \
            -e GATEWAY_INTERNAL_SECRET="$CI_GATEWAY_SECRET" \
            -e IDENTITY_SERVICE_URL=http://identity-test:8001 \
            -e RATE_LIMIT_PER_HOUR=120 \
            wildbox-gateway-test

      - name: Wait for services
        run: |
          for url in http://localhost:8001/health http://localhost:8080/health http://localhost:8081/health http://localhost:8083/health; do
            for i in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "$url ready"
                break
              fi
              if [ "$i" = 30 ]; then
                echo "$url never became ready"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run gateway auth tests
        run: bash open-security-gateway/test/ci_auth_tests.sh

      # What the gateway tells a service about the credential: its type and
      # an API key's scopes, and never a client's own headers (#637). Before
      # the revocation tests, which flush the auth cache this script counts
      # on for its cached cases.
      - name: Run gateway scope forwarding tests
        run: bash open-security-gateway/test/scope_forwarding_tests.sh

      # The scope hierarchy, row by row, against the table the shared
      # package's tests use: the gateway and the services decide alike.
      - name: Run gateway scope vector tests
        run: bash open-security-gateway/test/scope_vector_tests.sh

      # Logout must hold on every worker even with an authorization in flight
      # (#571). Strict: no retries, many iterations.
      - name: Run gateway revocation tests
        run: bash open-security-gateway/test/revocation_tests.sh

      # A RATE_LIMIT_PER_HOUR that is not a positive integer stops the
      # gateway from starting (#627).
      - name: Run gateway start-up configuration tests
        run: bash open-security-gateway/test/startup_config_tests.sh wildbox-gateway-test gwtest

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== gateway ====="
          docker logs gateway 2>&1 | tail -100 || true
          echo "===== gateway-wrong-secret ====="
          docker logs gateway-wrong-secret 2>&1 | tail -50 || true
          echo "===== gateway-low-limit ====="
          docker logs gateway-low-limit 2>&1 | tail -50 || true
          echo "===== identity-test ====="
          docker logs identity-test 2>&1 | tail -50 || true
