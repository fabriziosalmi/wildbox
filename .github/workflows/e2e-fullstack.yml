name: E2E Full-Stack

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

# No workflow-level env: block, for the reason integration-tests.yml gives:
# shell variables win over .env in compose interpolation, and a stack whose
# services read half their configuration from each disagrees with itself.

# One run per pull request: a new push cancels the run it supersedes. Any
# other event (push to main, schedule, dispatch) gets a group of its own,
# so it is never cancelled -- not even while pending, which a shared group
# with cancel-in-progress: false would still do to a queued run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-fullstack:
    # The backend-dependent Playwright specs (#103), against the whole stack as
    # `docker compose up` gives it to a user: every service, the generated
    # .env, and the dashboard served by the gateway at https://localhost. The
    # browser loads the dashboard and calls the API from that one origin, as in
    # a deployment -- the previous harness served the dashboard from a second
    # origin and quarantined every test past the login form because of it.
    name: E2E Full-Stack (Playwright @backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # observed 9.3 min green (stack build 7.1, specs 0.7)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: open-security-dashboard/package-lock.json

      - name: Generate secrets
        # As in integration-tests.yml: every required value, generated the way
        # a fresh install generates it, and no fallback secret.
        run: |
          cp .env.example .env
          python3 scripts/generate_secrets.py --force
          python3 scripts/validate_secrets.py

      - name: Raise the rate limit for the suite
        # The per-team API budget (RATE_LIMIT_PER_HOUR/60 a minute) is not what
        # these specs test, and the suite drives one admin team through every
        # page. Replaced in place: .env.example already defines the key.
        run: sed -i "s/^RATE_LIMIT_PER_HOUR=.*/RATE_LIMIT_PER_HOUR=1000000/" .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install dashboard dependencies
        # For Playwright on the runner. The compose dashboard no longer sees
        # this node_modules: it bind-mounts only src/ and public/ and keeps
        # the image's own dependencies. (It used to mount the whole directory
        # with an anonymous volume on node_modules, which made Docker create
        # node_modules here as root, so npm ci had to run first.)
        working-directory: open-security-dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: open-security-dashboard
        # Usually under a minute; once 8.0 min on apt mirrors. Bounded so a
        # stalled mirror fails here, not at the job's limit.
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        timeout-minutes: 20
        run: docker compose up -d --wait --wait-timeout 600

      - name: Show what came up
        if: always()
        run: docker compose ps

      - name: Seed threat-intel indicators
        # The data service has no API that creates indicators; see the comment
        # at the top of the SQL file. Everything else the specs need is created
        # through the gateway by tests/e2e/backend.setup.ts.
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d data -v ON_ERROR_STOP=1 \
            < open-security-dashboard/tests/e2e/fixtures/threat-intel-seed.sql

      - name: Warm up the dashboard routes
        # The compose dashboard is `next dev`, which compiles a route on its
        # first request. Doing that here, once, keeps compile time out of the
        # tests' own timeouts. A route that does not answer 200 fails the job.
        run: |
          for route in /auth/login / /dashboard /admin /settings /settings/profile \
                       /settings/api-keys /settings/team /threat-intel/lookup \
                       /toolbox /toolbox/hash_generator; do
            for i in $(seq 1 20); do
              code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 120 \
                       -H 'Cookie: auth_token=warmup' "https://localhost$route" || true)
              if [ "$code" = 200 ]; then echo "$route -> 200"; break; fi
              if [ "$i" = 20 ]; then echo "$route never answered 200 (last: $code)"; exit 1; fi
              sleep 3
            done
          done

      - name: Run the @backend Playwright specs
        working-directory: open-security-dashboard
        timeout-minutes: 15
        env:
          CI: 'true'
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: https://localhost
        run: |
          # Read the admin out of .env rather than sourcing it: a generated
          # secret is not shell syntax.
          env_value() { sed -n "s/^$1=//p" ../.env | head -1; }
          export TEST_EMAIL="$(env_value INITIAL_ADMIN_EMAIL)"
          export TEST_PASSWORD="$(env_value INITIAL_ADMIN_PASSWORD)"
          echo "::add-mask::$TEST_PASSWORD"
          # One retry, not the config's two: a red run with two retries per
          # test outlives the job timeout before it reports anything.
          npx playwright test --project=backend-chromium --retries=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-fullstack-report
          path: open-security-dashboard/playwright-report/
          retention-days: 30

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=150 gateway identity data dashboard

      - name: Collect stack diagnostics on failure
        # What a failed request needs to be traced (#609): the gateway's own
        # access and error logs (files under the bind-mounted logs/, not in
        # `docker compose logs`), every container's state and restart count,
        # and the full, timestamped logs of the services on the request
        # path. The access log carries $request_id, $upstream_status and
        # $upstream_addr, so a 5xx shows whether the gateway answered it or
        # an upstream did. docker inspect is asked for named fields only: its
        # full output includes each container's environment.
        if: failure()
        run: |
          out=e2e-diagnostics
          mkdir -p "$out"
          docker compose ps -a > "$out/compose-ps.txt" 2>&1 || true
          for id in $(docker compose ps -aq); do
            docker inspect --format \
              '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
              "$id"
          done > "$out/container-state.txt" 2>&1 || true
          for svc in gateway identity data; do
            docker compose logs --timestamps --no-color "$svc" > "$out/$svc.log" 2>&1 || true
          done
          # Written by the container's nginx user; copy them out as root.
          sudo cp -r open-security-gateway/logs "$out/gateway-nginx" || true
          sudo chown -R "$(id -u):$(id -g)" "$out"
          cat "$out/container-state.txt"
          echo "--- gateway 5xx (access.log) ---"
          grep -E '" 5[0-9]{2} ' "$out/gateway-nginx/access.log" | tail -50 || true
          echo "--- gateway error.log (tail) ---"
          tail -100 "$out/gateway-nginx/error.log" || true

      - name: Upload stack diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-fullstack-diagnostics
          path: e2e-diagnostics/
          retention-days: 30
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
