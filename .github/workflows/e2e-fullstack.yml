name: E2E Full-Stack

permissions:
  contents: read

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Ephemeral CI-only values (same pattern as integration-tests.yml —
  # this stack never leaves the runner).
  JWT_SECRET_KEY: ci-fallback-jwt-signing-string-for-e2e-runs
  GATEWAY_INTERNAL_SECRET: ci-gateway-proof-of-origin-e2e-value
  POSTGRES_PASSWORD: ci-e2e-postgres-pw
  ADMIN_EMAIL: superadmin@wildbox.com
  ADMIN_PASSWORD: wildbox123

jobs:
  e2e-fullstack:
    # Restores the backend-dependent Playwright flows (#103) on a real stack:
    # postgres + redis + identity (its production image, which migrates and
    # seeds the admin) + gateway (production OpenResty image) as containers,
    # dashboard as a host process built with NEXT_PUBLIC_* pointing at the
    # gateway (those vars are inlined at `next build` time).
    name: E2E Full-Stack (login flows)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: open-security-dashboard/package-lock.json

      - name: Create docker network + data services
        run: |
          docker network create wildbox-e2e
          docker run -d --name postgres-e2e --network wildbox-e2e \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB=identity \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:15
          docker run -d --name redis-e2e --network wildbox-e2e redis:7-alpine

      - name: Build identity image
        run: |
          docker build \
            --build-context shared=open-security-shared \
            -t wildbox-identity-e2e open-security-identity

      - name: Build gateway image
        run: docker build -t wildbox-gateway-e2e open-security-gateway

      - name: Start identity (migrations + admin seed)
        # Container name MUST be open-security-identity: the gateway's static
        # upstream resolves that exact name at nginx boot.
        run: |
          docker run -d --name open-security-identity --network wildbox-e2e \
            -p 8001:8001 \
            -e DATABASE_URL="postgresql+asyncpg://postgres:$POSTGRES_PASSWORD@postgres-e2e:5432/identity" \
            -e REDIS_URL=redis://redis-e2e:6379/0 \
            -e JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            -e GATEWAY_INTERNAL_SECRET="$GATEWAY_INTERNAL_SECRET" \
            -e CREATE_INITIAL_ADMIN=true \
            -e INITIAL_ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e INITIAL_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            wildbox-identity-e2e

      - name: Start upstream stand-ins + gateway
        # nginx refuses to boot if any static upstream hostname is
        # unresolvable, so every absent service gets a DNS alias:
        # - blackhole (connection refused) for services these flows don't use;
        # - socat forwarding :3000 to the runner host for the dashboard
        #   (which runs as a host process), plus the host.docker.internal
        #   backup already present in the upstream block.
        run: |
          docker run -d --name upstream-blackhole --network wildbox-e2e \
            --network-alias open-security-data \
            --network-alias open-security-guardian \
            --network-alias open-security-responder \
            --network-alias open-security-agents \
            --network-alias open-security-tools \
            alpine:3.20 sleep infinity
          docker run -d --name dashboard-fwd --network wildbox-e2e \
            --network-alias open-security-dashboard \
            --network-alias dashboard \
            --add-host host.docker.internal:host-gateway \
            alpine/socat tcp-listen:3000,fork,reuseaddr tcp-connect:host.docker.internal:3000
          docker run -d --name wildbox-gateway --network wildbox-e2e \
            --add-host host.docker.internal:host-gateway \
            -p 443:443 -p 8090:80 \
            -e GATEWAY_INTERNAL_SECRET="$GATEWAY_INTERNAL_SECRET" \
            -e IDENTITY_SERVICE_URL=http://open-security-identity:8001 \
            wildbox-gateway-e2e

      - name: Wait for identity and gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8001/health >/dev/null 2>&1; then
              echo "identity ready"; break
            fi
            if [ "$i" = 60 ]; then echo "identity never became ready"; exit 1; fi
            sleep 3
          done
          for i in $(seq 1 30); do
            if curl -fsSk https://localhost/health >/dev/null 2>&1; then
              echo "gateway ready"; break
            fi
            if [ "$i" = 30 ]; then echo "gateway never became ready"; exit 1; fi
            sleep 2
          done

      - name: Verify seeded admin can log in through the gateway
        # identity's init.sh swallows admin-seed failures and still starts the
        # service — so prove the whole chain (gateway TLS -> auth route
        # rewrite -> identity -> seeded admin) works before spending minutes
        # on the dashboard build. This is the harness's own smoke test.
        run: |
          status=$(curl -sk -o /tmp/login.json -w "%{http_code}" \
            -X POST https://localhost/auth/jwt/login \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "username=$ADMIN_EMAIL" \
            --data-urlencode "password=$ADMIN_PASSWORD")
          if [ "$status" != "200" ] || ! grep -q access_token /tmp/login.json; then
            echo "login through gateway failed (HTTP $status):"
            head -c 400 /tmp/login.json; echo
            exit 1
          fi
          echo "admin login through gateway OK"

      - name: Install dashboard dependencies
        working-directory: open-security-dashboard
        run: npm ci

      - name: Install Playwright browsers
        working-directory: open-security-dashboard
        run: npx playwright install --with-deps chromium

      - name: Build dashboard (gateway-wired)
        # NEXT_PUBLIC_* are inlined at build time — they must be set HERE,
        # not only when the tests run.
        working-directory: open-security-dashboard
        env:
          NEXT_PUBLIC_USE_GATEWAY: 'true'
          NEXT_PUBLIC_GATEWAY_URL: https://localhost
        run: npm run build

      - name: Run backend-dependent Playwright specs
        working-directory: open-security-dashboard
        env:
          CI: 'true'
          NEXT_PUBLIC_USE_GATEWAY: 'true'
          NEXT_PUBLIC_GATEWAY_URL: https://localhost
          # Drive the browser through the gateway, which proxies both the
          # dashboard and the APIs — the production topology, and the only one
          # that works: the gateway emits no CORS headers (its
          # includes/cors_params.conf is a comment-only stub), so a dashboard
          # served from a different origin than the API has every XHR blocked
          # by the browser. Playwright's webServer still starts Next on :3000
          # for the gateway (via socat) to proxy to.
          PLAYWRIGHT_BASE_URL: https://localhost
          TEST_EMAIL: superadmin@wildbox.com
          TEST_PASSWORD: wildbox123
          # `next start` (spawned by Playwright's webServer) may fetch the
          # gateway server-side over the self-signed CI cert.
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npx playwright test --project=backend-chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fullstack-report
          path: open-security-dashboard/playwright-report/
          retention-days: 30

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== identity ====="
          docker logs open-security-identity 2>&1 | tail -120 || true
          echo "===== gateway ====="
          docker logs wildbox-gateway 2>&1 | tail -80 || true
          echo "===== postgres ====="
          docker logs postgres-e2e 2>&1 | tail -30 || true
