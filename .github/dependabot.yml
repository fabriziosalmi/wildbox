# Dependabot configuration — https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  # No "pip" entry: Dependabot regenerates the hash-pinned requirements.txt
  # with pip-compile, not the uv command compile_requirements.sh runs, so its
  # PRs could never pass the Dependency Integrity gate (#420). Python security
  # upgrades come from .github/workflows/pip-security-upgrades.yml.

  - package-ecosystem: "npm"
    directories:
      - "/open-security-dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node describes the runtime, and the runtime is the node major
      # pinned in open-security-dashboard/Dockerfile and the CI workflows (24).
      # A newer major types APIs that node 24 does not have. Move it by hand
      # together with the base image.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directories:
      - "/open-security-*"
      - "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # The dashboard runs on the active Node.js LTS line. A major bump of the
    # node image is a runtime upgrade (and @types/node follows it), decided by
    # hand when a line becomes LTS, not a weekly digest refresh.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"
