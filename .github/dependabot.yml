# Dependabot configuration — https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  # No "pip" entry: Dependabot regenerates the hash-pinned requirements.txt
  # with pip-compile, not the uv command compile_requirements.sh runs, so its
  # PRs could never pass the Dependency Integrity gate (#420). Python security
  # upgrades come from .github/workflows/pip-security-upgrades.yml.

  - package-ecosystem: "npm"
    directories:
      - "/open-security-dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/node describes the runtime, and the runtime is the node major
      # pinned in open-security-dashboard/Dockerfile and the CI workflows (24).
      # A newer major types APIs that node 24 does not have. Move it by hand
      # together with the base image.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 is the native compiler and its npm package no longer
      # exposes the JS compiler API. typescript-eslint 8.71 (pulled in by
      # eslint-config-next 16.3) declares typescript ">=4.8.4 <6.1.0" and
      # exits with "typescript-eslint does not support TS 7.0", so
      # `npm run lint` cannot run (#668). Upstream tracking issue:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # Revisit when a typescript-eslint release accepts typescript 7 in
      # its peer range. TypeScript 6.x is still allowed through.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

      # eslint 10 is blocked by eslint-config-next 16.3.8, which pulls in
      # eslint-plugin-react 7.37.5 (peer eslint up to ^9.7). Under eslint 10
      # every react/* rule crashes with "contextOrFilename.getFilename is not
      # a function" (#670). Upstream: jsx-eslint/eslint-plugin-react#3977 and
      # vercel/next.js#89764; eslint-plugin-jsx-a11y 6.10.2 and
      # eslint-plugin-import 2.32.0 also stop their peer range at ^9. Drop
      # this rule once eslint-config-next ships plugins that support 10.
      - dependency-name: "eslint"
        versions:
          - "10.x"

  - package-ecosystem: "docker"
    directories:
      - "/open-security-*"
      - "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # The dashboard runs on the active Node.js LTS line. A major bump of the
    # node image is a runtime upgrade (and @types/node follows it), decided by
    # hand when a line becomes LTS, not a weekly digest refresh.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"

  # The images the Compose files run without building them: PostgreSQL, Redis,
  # n8n, Prometheus, Alertmanager, nginx, curl, alpine. Each is pinned by tag
  # and by the digest of its image index (`redis:7-alpine@sha256:...`), which
  # scripts/check_container_hygiene.py requires. Nothing moved them before: a
  # tag was whatever the registry served on the day of the pull, and the
  # "docker" entry above reads Dockerfiles only (#726). This entry proposes
  # the new digest when a tag is published again, and newer minor and patch
  # tags.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/.github"
      - "/open-security-*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # A new major of PostgreSQL is a dump and restore, of Redis, n8n or
      # Prometheus a migration with its own notes. In one grouped pull
      # request with the weekly digests it would hold all of them back, as
      # the node 26 proposal did for the base images. Decided by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 3.13 is the long-term support line of Prometheus (until 2027-07-31):
      # patch releases come through, the move to the next line is a decision.
      - dependency-name: "prom/prometheus"
        update-types: ["version-update:semver-minor"]
      # nginx alternates stable (even) and mainline (odd) minors: after 1.30
      # the next tag is 1.31, which is mainline.
      - dependency-name: "nginx"
        update-types: ["version-update:semver-minor"]
    groups:
      docker-compose:
        patterns:
          - "*"
