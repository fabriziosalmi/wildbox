# Dependabot configuration — https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  # No "pip" entry: Dependabot regenerates the hash-pinned requirements.txt
  # with pip-compile, not the uv command compile_requirements.sh runs, so its
  # PRs could never pass the Dependency Integrity gate (#420). Python security
  # upgrades come from .github/workflows/pip-security-upgrades.yml.

  - package-ecosystem: "npm"
    directories:
      - "/open-security-dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/open-security-*"
      - "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns:
          - "*"
