# Docker Compose Production Configuration
# Override file for production deployments
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires Docker Compose 2.24.4 or later, for the `!override` tag below.
#
# Every service's `networks:` here carries `!override`. Without it Compose
# MERGES a service's networks with the base file's, so each service stayed on
# the flat `wildbox` network as well as the segmented ones, and the dashboard
# and gateway could reach PostgreSQL and Redis directly (#494). `!override`
# replaces the base list instead. Older Compose rejects the tag outright
# rather than silently merging, so it cannot quietly fall back to flat.
#
# A service that is removed from `wildbox` loses the network aliases defined
# there, so the aliases the gateway's upstreams resolve (open-security-tools,
# open-security-data, open-security-cspm, dashboard) are declared again on the
# network the gateway reaches them through. Names set with container_name
# resolve on every network the container joins and need nothing extra.
#
# Network map, and the connection each attachment exists for:
#
#   frontend  gateway, dashboard, sensor
#             browser -> gateway; dashboard SSR -> open-security-gateway:8080
#             (INTERNAL_GATEWAY_URL); gateway -> open-security-dashboard:3000;
#             sensor -> open-security-gateway:443 (telemetry ingest, #628:
#             the sensor is a client of the gateway like a browser, and
#             reaches no backend service directly)
#   backend   gateway, identity, api, data, cspm, guardian, responder, agents,
#             automations, prometheus, alertmanager
#             gateway -> every upstream in nginx/conf.d/wildbox_gateway.conf;
#             identity -> open-security-gateway:8081 (auth-cache purge);
#             agents -> api:8000 (WILDBOX_API_URL) for its tools and, when
#             AGENT_TEAM_DATA_TOOLS enables them, open-security-data:8002
#             (WILDBOX_DATA_URL) and open-security-guardian:8013
#             (WILDBOX_GUARDIAN_URL); prometheus ->
#             the /metrics targets in monitoring/prometheus.yml and
#             alertmanager:9093 (alerts, and its /metrics); alertmanager ->
#             the mail server or webhook it notifies, outside the stack
#   data      postgres, wildbox-redis, and only the services whose
#   (internal) DATABASE_URL / REDIS_URL / CELERY_BROKER_URL name them, plus backup.
#             guardian-beat is on data alone: it reads its schedule from
#             PostgreSQL and publishes to Redis, and needs nothing else
#   egress   tools-worker, tools-flower, guardian-worker, cspm-worker,
#             data-scheduler, backup: the services on `data` alone, which
#             would otherwise have no outbound internet (tool execution, port
#             scans, cloud provider APIs, threat feeds, `apk add` in backup)
#             and no loopback port (flower). Inter-container communication is
#             disabled on it, so it is never a path between two services.
#
# backend is NOT internal. Docker neither routes out nor publishes ports for a
# container whose networks are all internal, and the API services need both:
# tools scan the internet, agents call Anthropic, cspm calls cloud APIs, data
# and guardian fetch feeds, and every service keeps its 127.0.0.1 port. What
# segmentation removes is which containers share a network, and that is
# unchanged by backend having a route out.
#
# Why egress is not simply shared by every service: when two containers share
# several networks, Docker's DNS answers a name with the address on one of
# them -- with an internal network and egress, the egress one (observed on
# Engine 28.0 and 29.5), where ICC is disabled and that address cannot be
# reached. A first version of this change put every
# service on egress; with PostgreSQL also on it, identity, data and guardian
# resolved the database to its egress address and never connected. So no name
# that a service looks up may be on egress: only the services above are,
# and nothing looks them up.
#
# Not reachable, by construction: dashboard -> postgres/redis/any backend
# service; gateway -> postgres/redis. CI asserts both, and the whole map
# above, with scripts/check_network_segmentation.py (workflow
# "Production Stack").

services:
  # PostgreSQL - Production Settings
  postgres:
    restart: always
    environment:
      # Production connection limits
      - POSTGRES_MAX_CONNECTIONS=200
      - POSTGRES_SHARED_BUFFERS=256MB
    networks: !override
      - data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis - Production Settings
  #
  # No `command` and no memory limit here: both come from docker-compose.yml.
  # This block used to set `--maxmemory-policy allkeys-lru` with 512mb, which
  # let Redis silently evict the token blacklist (a revoked token worked
  # again), the failed-login lockout counters, Celery/Dramatiq queues and
  # results, and the scan and run state the base file keeps under noeviction
  # (#530). Size it with REDIS_MAXMEMORY and REDIS_MEMORY_LIMIT (at least
  # twice REDIS_MAXMEMORY); scripts/check_redis_config.py checks both.
  wildbox-redis:
    restart: always
    networks: !override
      - data
    deploy:
      resources:
        limits:
          cpus: '1'
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Identity Service - Production
  identity:
    restart: always
    networks: !override
      - backend
      - data
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      # Comma-separated, like the other services; identity also accepts a
      # JSON list. It used to read JSON only and crash-looped on this value
      # (#531). Empty allows no cross-origin requests: the browser reaches
      # identity through the gateway, on the dashboard's own origin.
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ENABLE_METRICS=true
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Required in production: identity refuses to start without it (#648).
      # Repeated from the base file so the overlay states it on its own.
      - API_KEY_HASH_SECRET=${API_KEY_HASH_SECRET:?API_KEY_HASH_SECRET is required; see UPGRADING.md before setting it on an existing deployment}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 5

  # API Service - Production
  api:
    restart: always
    networks: !override
      backend:
        aliases:
          # The gateway's api_service upstream and prometheus use this name.
          - open-security-tools
      data: {}
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ENABLE_METRICS=true
      - WORKERS=4
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Guardian Service - Production
  guardian:
    restart: always
    networks: !override
      - backend
      - data
    environment:
      # No DJANGO_SETTINGS_MODULE: this used to name
      # config.settings.production, a module that does not exist, so gunicorn
      # failed to import the app. guardian.settings reads every production
      # value from the environment.
      - DEBUG=false
      - LOG_LEVEL=INFO
      # open-security-guardian is appended because the gateway sends it as the
      # Host header (wildbox_gateway.conf); without it Django answers 400 to
      # every proxied request.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1},open-security-guardian
      - CORS_ALLOWED_ORIGINS=${CORS_ORIGINS}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Responder Service - Production
  # backend carries its playbooks' calls to tools, data, guardian and agents
  # (WILDBOX_*_URL in docker-compose.yml, #616); data carries Redis.
  responder:
    restart: always
    networks: !override
      - backend
      - data
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS}
      - WORKER_CONCURRENCY=4
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Agents Service - Production
  # backend carries its tools' calls to the tools service and, when
  # AGENT_TEAM_DATA_TOOLS enables them, to the data and guardian services
  # (WILDBOX_*_URL in docker-compose.yml, #652); data carries Redis. The
  # service URLs and the analysis rate limits come from the base file, which
  # an operator sets through AGENTS_WILDBOX_DATA_URL,
  # AGENTS_WILDBOX_GUARDIAN_URL, ANALYZE_RATE_LIMIT and
  # ANALYZE_TEAM_RATE_LIMIT in .env.
  agents:
    restart: always
    networks: !override
      - backend
      - data
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS}
      - WORKER_CONCURRENCY=4
      - CELERY_WORKER_PREFETCH_MULTIPLIER=2
      # Off unless the operator opts in (#652): no team-data tool is given
      # to the model, so no team data is sent to the model provider.
      # Repeated from the base file so the overlay states it on its own.
      - AGENT_TEAM_DATA_TOOLS=${AGENT_TEAM_DATA_TOOLS:-}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Gateway - Production (frontend + backend, NO data access)
  gateway:
    restart: always
    networks: !override
      - frontend
      - backend
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=warn
      # As for the services below: only what the operator lists, and nothing
      # when it is empty (the dashboard on the gateway's own origin).
      - CORS_ORIGINS=${CORS_ORIGINS}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # No nginx config override. This used to bind-mount
    # ./open-security-gateway/nginx/nginx.prod.conf, a file that does not
    # exist in the repo: Docker creates an empty DIRECTORY at a missing bind
    # source, nginx finds a directory where it expects nginx.conf and refuses
    # to start, so the gateway crash-looped on every production deploy. The
    # image already ships the reviewed nginx.conf — which is also where the
    # limit_req_zone definitions live, so silently replacing it would have
    # taken the rate limiting with it.

  # Dashboard - Production (frontend only, NO direct backend/data access)
  dashboard:
    restart: always
    networks: !override
      frontend:
        aliases:
          # Backup server of the gateway's dashboard_service upstream.
          - dashboard
    # The base file bind-mounts the source tree over /app for `next dev`. In
    # this image /app holds the standalone build (server.js), so the mount
    # left nothing to run.
    volumes: !reset []
    build:
      context: ./open-security-dashboard
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* is compiled into the browser bundle, so it is a build
      # argument, read from .env here; the environment of the running
      # container cannot change it. Without these the image fell back to
      # http://localhost:80 (#559). An empty NEXT_PUBLIC_GATEWAY_URL -- the
      # default -- makes the dashboard call the gateway on its own origin,
      # which is how this stack serves it. Rebuild the image after changing
      # any of them (docs/guides/deployment.md).
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL:-}
        - NEXT_PUBLIC_USE_GATEWAY=${NEXT_PUBLIC_USE_GATEWAY:-true}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Services with no other production settings: networks only (see the map at
  # the top of this file).
  # ---------------------------------------------------------------------------
  tools-worker:
    networks: !override
      data:
        aliases:
          - open-security-tools-worker
      egress: {}

  tools-flower:
    networks: !override
      - data
      - egress

  # The broker and the database are on data; egress for what the tasks
  # reach outside the stack: port scans of asset addresses, threat-intel
  # URLs, SMTP and chat webhooks. Nothing looks the worker up by name.
  guardian-worker:
    restart: always
    networks: !override
      - data
      - egress
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # The scheduler reads PeriodicTask rows from PostgreSQL and publishes to
  # Redis; it runs no task itself, so it has no reason to reach anything
  # outside data. One instance only (see docker-compose.yml).
  guardian-beat:
    restart: always
    networks: !override
      - data
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  data:
    networks: !override
      backend:
        aliases:
          # The gateway's data_service upstream and prometheus.
          - open-security-data
      data: {}

  data-scheduler:
    networks: !override
      - data
      - egress

  cspm:
    networks: !override
      backend:
        aliases:
          # The gateway's cspm_service upstream and prometheus.
          - open-security-cspm
      data: {}

  # The broker is on data; egress for the cloud provider APIs the scans
  # call (AWS, GCP, Azure). Nothing looks the worker up by name (#601).
  cspm-worker:
    restart: always
    networks: !override
      - data
      - egress
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # A client of the gateway, as a sensor on another host would be (#628):
  # frontend reaches the gateway's HTTPS listener and no backend service.
  sensor:
    networks: !override
      - frontend

  automations:
    networks: !override
      - backend

  backup:
    networks: !override
      - data
      - egress

  prometheus:
    networks: !override
      - backend

  # The same segment as prometheus, which sends it the alerts and scrapes it
  # (#658). backend has a route out, which is how a notification reaches a
  # mail server or a webhook; it has no path to PostgreSQL or Redis.
  alertmanager:
    networks: !override
      - backend

# Production network segmentation; see the map at the top of this file.
networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
    # Not internal; see the note at the top of this file.
    ipam:
      config:
        - subnet: 172.20.1.0/24
  data:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.2.0/24
  egress:
    driver: bridge
    driver_opts:
      # Inter-container communication off: outbound traffic and published
      # ports only, never a path between two services.
      com.docker.network.bridge.enable_icc: "false"
    ipam:
      config:
        - subnet: 172.20.3.0/24

# Production volumes with backup labels
volumes:
  postgres-data:
    labels:
      - "backup=true"
      - "backup.frequency=daily"
  redis-data:
    labels:
      - "backup=true"
      - "backup.frequency=hourly"
