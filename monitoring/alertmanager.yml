# Alertmanager configuration shipped with the `monitoring` profile.
#
# OUT OF THE BOX THIS NOTIFIES NOBODY. Every alert goes to the receiver
# `no-notifications`, which has no integration: Alertmanager groups the alert,
# shows it in its UI (http://127.0.0.1:9093) and lets you silence it, and
# Prometheus shows it on its /alerts page (http://127.0.0.1:9090/alerts), but
# no e-mail, webhook or chat message is sent. Until a real receiver is
# configured, somebody has to be looking at one of those two pages.
#
# To be notified, do not edit this file. Copy one of
#
#   monitoring/examples/alertmanager-email.yml
#   monitoring/examples/alertmanager-webhook.yml
#
# outside the tracked tree, point ALERTMANAGER_CONFIG_FILE at the copy in
# .env, and put the secret it reads in ALERTMANAGER_SECRETS_DIR. The steps,
# and how to send a test alert, are in docs/guides/deployment.md, section 7.
#
# CI validates this file and the examples with `amtool check-config`
# (scripts/check_monitoring_config.py).

route:
  receiver: no-notifications
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # No *_configs entry: this receiver sends nowhere, and is named for it.
  - name: no-notifications
