# Alert rules for the Wildbox stack.
#
# Prometheus evaluates these and sends what fires to Alertmanager
# (monitoring/prometheus.yml, `alerting:`). Whether anybody is then notified
# depends on the Alertmanager configuration: the one shipped notifies nobody
# (monitoring/alertmanager.yml).
#
# Every expression reads a metric a scraped target really exports, with labels
# it really has:
#
#   up                                     Prometheus itself, per scrape target
#   wildbox_http_requests_total            open-security-shared/observability.py
#                                          {service, method, path, status}
#   wildbox_tool_executions_total          open-security-tools/app/execution_manager.py
#                                          {tool, outcome}; synchronous runs
#   wildbox_tool_async_executions_total    open-security-tools/app/async_metrics.py
#                                          {tool, outcome}; asynchronous runs
#   wildbox_tool_async_queue_length        the same file: tasks no worker has taken
#   wildbox_tool_async_tasks_consumed_total  the same file: tasks a worker took
#   wildbox_tool_async_metrics_up          the same file: 1 when the three above
#                                          could be read
#   alertmanager_notifications_failed_total  Alertmanager {integration, reason}
#
# The four wildbox_tool_async_* metrics are exported by the tools api, which
# is a scrape target, and not by tools-worker, which runs the tasks and is
# not one: Prometheus cannot reach it on the production networks. The worker
# counts in Redis and the api reads the counts on every scrape.
#
# open-security-tools/tests/unit/test_alert_rule_metrics.py fails if a
# wildbox_* selector here names a metric or a label the code does not export.
# monitoring/alert_rules.test.yml holds the unit tests (`promtool test
# rules`); scripts/check_monitoring_config.py runs them in CI.
groups:
  - name: wildbox-availability
    rules:
      - alert: WildboxServiceDown
        expr: up{job="wildbox-services"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not answering Prometheus scrapes"
          description: >-
            Prometheus has not been able to scrape /metrics on
            {{ $labels.instance }} for two minutes: the service is stopped,
            restarting, or unreachable on the Compose network. Check
            `docker compose ps` and the service's logs.

      - alert: WildboxHighErrorRate
        expr: |
          sum by (service) (rate(wildbox_http_requests_total{status=~"5.."}[5m]))
          /
          sum by (service) (rate(wildbox_http_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} answers more than 5% of its requests with a 5xx"
          description: >-
            Over the last five minutes {{ $value | humanizePercentage }} of the
            HTTP requests the {{ $labels.service }} service handled ended in a
            5xx status, and it has stayed above 5% for ten minutes. The count
            includes health checks and Prometheus scrapes, and every request
            is counted by the service itself, so requests the gateway refused
            or could not forward are not in it.

  - name: wildbox-outcomes
    rules:
      # Synchronous runs only. wildbox_tool_executions_total is incremented by
      # the api process for POST /api/v1/tools/{tool}; runs submitted to
      # /api/v1/tools/{tool}/async execute in tools-worker and have a counter
      # and an alert of their own, WildboxAsyncToolFailureRate below. Two
      # alerts and not one ratio over both, so that a worker that fails every
      # task is not hidden by synchronous runs that succeed.
      #
      # outcome="failed" is a tool that raised an error it does not handle
      # (the caller gets a 500). A tool that reports an unreachable target or
      # a bad answer in its result (`success: false`) is "completed", a run
      # that exceeded its time limit is "timeout", and one the caller may not
      # start is "refused": none of the three is a failure here.
      #
      # rate() cannot see the first run of a tool with a given outcome after
      # the api process starts: the series is created at 1, with no earlier
      # sample to compare with.
      - alert: WildboxSyncToolFailureRate
        expr: |
          sum(rate(wildbox_tool_executions_total{outcome="failed"}[15m]))
          /
          sum(rate(wildbox_tool_executions_total[15m])) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Over a quarter of synchronous tool runs are failing"
          description: >-
            Over the last fifteen minutes {{ $value | humanizePercentage }} of
            the synchronous tool runs (POST /api/v1/tools/<tool>) raised an
            error the tool does not handle, and the share has stayed above 25%
            for fifteen minutes. Asynchronous runs (the tools-worker) are
            measured by WildboxAsyncToolFailureRate: this alert neither fires
            for them nor clears because of them. Timeouts, refused runs and
            failures a tool reports in its result count as runs, not as
            failures.

      # The same question for the runs submitted to
      # /api/v1/tools/{tool}/async. The counter is kept in Redis by the worker
      # and exported by the api (see the top of this file), one count per
      # task when Celery settles its state:
      #
      #   failed     the tool raised, or the task failed in the worker after
      #              its retries (a task that is retried is counted once), or
      #              the task was given up after its worker process died
      #              three times while running it;
      #   completed  the tool returned, `success: false` included;
      #   timeout    stopped at the soft time limit or killed at the hard one;
      #   cancelled  revoked, while it waited or while it ran;
      #   refused    ended before the tool was started: the caller may not run
      #              it, or the worker's check refuses what the submission
      #              accepted (the target now resolves to an address that is
      #              not allowed). An unknown tool, invalid input and a
      #              refused target are answered with a 4xx when the task is
      #              submitted, as on the synchronous path, and are no task.
      #
      # The counter lives as long as the Redis data, not as long as a
      # process, so restarting the api or the worker does not reset it. A
      # count the worker could not write (Redis did not answer it) is lost:
      # the counter can be short, never long.
      - alert: WildboxAsyncToolFailureRate
        expr: |
          sum(rate(wildbox_tool_async_executions_total{outcome="failed"}[15m]))
          /
          sum(rate(wildbox_tool_async_executions_total[15m])) > 0.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Over a quarter of asynchronous tool runs are failing"
          description: >-
            Over the last fifteen minutes {{ $value | humanizePercentage }} of
            the asynchronous tool runs (POST /api/v1/tools/<tool>/async,
            executed by tools-worker) failed: the tool raised an error it does
            not handle, or the task failed in the worker after its retries.
            The share has stayed above 25% for fifteen minutes. Timeouts,
            canceled and refused tasks and failures a tool reports in its
            result count as runs, not as failures. Synchronous runs are
            measured by WildboxSyncToolFailureRate.

      # The queue has not been empty for fifteen minutes and in that time no
      # worker took a task from it. Both numbers are needed: a queue alone is
      # a backlog, which a busy worker has too. A worker that is alive cannot
      # go fifteen minutes without starting a task while one waits, because
      # no task runs for more than ten (task_time_limit in
      # open-security-tools/app/celery_app.py; a tools test fails if that
      # limit reaches this window). So this is tools-worker stopped,
      # restarting, or unable to reach Redis.
      #
      # It cannot fire on an idle stack: an empty queue is 0, and the
      # consumed counter is exported as 0 before the first task, not absent.
      # It does not see tasks a worker has already taken: a worker killed
      # while it ran some keeps them out of the queue until the broker's
      # visibility timeout returns them, an hour later.
      - alert: WildboxAsyncToolTasksNotConsumed
        expr: |
          wildbox_tool_async_queue_length > 0
          and on ()
          increase(wildbox_tool_async_tasks_consumed_total[15m]) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Asynchronous tool tasks are queued and no worker is taking them"
          description: >-
            {{ $value }} asynchronous tool task(s) are waiting in the queue,
            the queue has not been empty for fifteen minutes and no worker has
            taken a task in that time. Callers of
            POST /api/v1/tools/<tool>/async get a task that stays pending.
            Check `docker compose ps tools-worker` and its logs: the worker is
            stopped, restarting, or cannot reach Redis.

      # The two alerts above read numbers the tools api gets from Redis on
      # each scrape. When it cannot, it exports none of them (a zero would
      # read as a counter that was reset), so neither alert can fire and
      # neither says why. This one does.
      - alert: WildboxAsyncToolMetricsUnreadable
        expr: wildbox_tool_async_metrics_up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The tools service cannot read the asynchronous run counters"
          description: >-
            For ten minutes the tools api on {{ $labels.instance }} has not
            been able to read the counters of asynchronous runs from Redis.
            While this lasts WildboxAsyncToolFailureRate and
            WildboxAsyncToolTasksNotConsumed cannot fire. Asynchronous
            execution itself needs the same Redis: check `wildbox-redis` and
            the api's logs.

  - name: wildbox-alerting
    rules:
      # The two alerts below are about the path every other alert takes. When
      # they fire, that path is broken, so do not expect them to arrive: they
      # are for whoever opens Prometheus's /alerts page or the Alertmanager UI
      # to find out why nothing arrived.
      - alert: WildboxAlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is not answering Prometheus scrapes"
          description: >-
            Prometheus has not been able to scrape Alertmanager at
            {{ $labels.instance }} for five minutes. While it is down no alert
            is delivered, this one included: it is visible on Prometheus's
            /alerts page only. Check `docker compose ps alertmanager` and its
            logs; an invalid configuration file keeps it restarting.

      # The counter is of notifications Alertmanager gave up on, not of
      # attempts: it moves at once when the error cannot be retried (a secret
      # file it cannot read) and after the route's group_interval of retries
      # otherwise (a wrong password, an unreachable server). Counting
      # attempts instead would fire for a notification that was delivered at
      # the second try.
      - alert: WildboxAlertNotificationsFailing
        expr: |
          sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager cannot deliver notifications by {{ $labels.integration }}"
          description: >-
            Alertmanager failed to send notifications through its
            {{ $labels.integration }} integration in the last fifteen minutes.
            If that is the only receiver, this alert cannot be delivered
            either: it is visible in the Alertmanager UI and on Prometheus's
            /alerts page. The reason is in the Alertmanager logs; a secret
            file that is missing or not readable by UID 65534, a wrong
            password and an unreachable server are the usual ones.
