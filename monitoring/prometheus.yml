# Prometheus scrape configuration for the Wildbox stack.
#
# The deployment used to contain no monitoring at all, and the one prometheus.yml
# in the repository (open-security-data/prometheus/prometheus.yml) was a zero-byte
# file -- a configuration that configured nothing (WILDBO-OBS-03/OBS-04).
#
# Every service now exposes Prometheus exposition format at /metrics via
# open_security_shared.observability.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    stack: wildbox

rule_files:
  - /etc/prometheus/alert_rules.yml

# Where a firing alert goes. This block did not exist: the rules were
# evaluated and nothing was ever sent, so an alert was visible on this
# server's /alerts page and nowhere else (#658). `alertmanager` is the
# Compose service of the same profile; what it does with an alert is decided
# by its own configuration (monitoring/alertmanager.yml, which notifies
# nobody until a receiver is configured).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: wildbox-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - open-security-identity:8001
          - open-security-tools:8000
          - open-security-data:8002
          - open-security-responder:8018
          - open-security-cspm:8019
          - open-security-agents:8006
        labels:
          stack: wildbox

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager's own metrics: whether it is up and whether its
  # notifications are being delivered (the wildbox-alerting rules).
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
