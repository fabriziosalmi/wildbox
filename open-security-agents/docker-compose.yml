# Open Security Agents - Docker Compose Configuration
# 
# NOTE: This file is for standalone development of the agents service.
# When running the full Wildbox stack, use the main docker-compose.yml 
# which provides a shared Redis instance (wildbox-redis:6379/4).

services:
  # Local Redis for standalone development
  # When using main stack, agents service connects to wildbox-redis:6379/4
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --databases 16
    healthcheck:
      # redis-cli exits 0 on an error reply: the reply has to be PONG (#740).
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 5

  agents-api:
    build:
      context: .
    # additional_contexts is required: this service's Dockerfile does
    # `COPY --from=shared`, which is a named build context, not a stage. Without
    # this line `docker compose up` in this directory fails on that instruction
    # -- which it did, for eight of the services (WILDBO-BLD-02).
      additional_contexts:
        shared: ../open-security-shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8006 --reload
    volumes:
      - .:/app
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8006:8006"
    environment:
      - DEBUG=true
      # For standalone development (uses local Redis)
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # For integration with main stack, use:
      # - REDIS_URL=redis://wildbox-redis:6379/4
      # - CELERY_BROKER_URL=redis://wildbox-redis:6379/4
      # - CELERY_RESULT_BACKEND=redis://wildbox-redis:6379/4
      - WILDBOX_API_URL=http://localhost:8000
      - WILDBOX_DATA_URL=http://localhost:8002
      - WILDBOX_GUARDIAN_URL=http://localhost:8013
      # Claude (Anthropic). Optional: without a key the service starts and
      # analysis tasks fail until one is set.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      # Required for tool calls: sent with the caller's X-Wildbox-* identity.
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET must be set}
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: .
    # additional_contexts is required: this service's Dockerfile does
    # `COPY --from=shared`, which is a named build context, not a stage. Without
    # this line `docker compose up` in this directory fails on that instruction
    # -- which it did, for eight of the services (WILDBO-BLD-02).
      additional_contexts:
        shared: ../open-security-shared
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - ./logs:/app/logs
    environment:
      - DEBUG=true
      # For standalone development (uses local Redis)
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # For integration with main stack, use:
      # - REDIS_URL=redis://wildbox-redis:6379/4
      # - CELERY_BROKER_URL=redis://wildbox-redis:6379/4
      # - CELERY_RESULT_BACKEND=redis://wildbox-redis:6379/4
      - WILDBOX_API_URL=http://localhost:8000
      - WILDBOX_DATA_URL=http://localhost:8002
      - WILDBOX_GUARDIAN_URL=http://localhost:8013
      # The worker runs the analysis: it calls Claude and the tools.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET:?GATEWAY_INTERNAL_SECRET must be set}
    depends_on:
      - redis
      - agents-api

  celery-flower:
    build:
      context: .
    # additional_contexts is required: this service's Dockerfile does
    # `COPY --from=shared`, which is a named build context, not a stage. Without
    # this line `docker compose up` in this directory fails on that instruction
    # -- which it did, for eight of the services (WILDBO-BLD-02).
      additional_contexts:
        shared: ../open-security-shared
    command: celery -A app.worker flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD must be set}
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - celery-worker

volumes:
  redis_data:
  celery_logs:

networks:
  default:
    name: wildbox-network
