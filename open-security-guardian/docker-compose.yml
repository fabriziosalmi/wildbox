# Open Security Guardian - Docker Compose Configuration
#
# NOTE: This file is for standalone development of the guardian service.
# When running the full Wildbox stack, use the main docker-compose.yml 
# which provides shared database and Redis instances.

version: '3.8'

services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Local Redis for standalone development
  # When using main stack, guardian service connects to wildbox-redis:6379/1
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --databases 16 --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      # For the health check: redis-cli reads the password from here, so it
      # is in no argument list (#740).
      - REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      # redis-cli exits 0 on an error reply: the reply has to be PONG (#740).
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 5

  guardian:
    build:
      context: .
    # additional_contexts is required: this service's Dockerfile does
    # `COPY --from=shared`, which is a named build context, not a stage. Without
    # this line `docker compose up` in this directory fails on that instruction
    # -- which it did, for eight of the services (WILDBO-BLD-02).
      additional_contexts:
        shared: ../open-security-shared
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8013"
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "127.0.0.1:8013:8013"
    security_opt:
      - no-new-privileges:true
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://guardian:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/guardian
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      # Internal ranges a discovery or a port scan may reach; empty refuses
      # every internal target (#748). The celery service gets the same value.
      - GUARDIAN_ALLOWED_INTERNAL_TARGETS=${GUARDIAN_ALLOWED_INTERNAL_TARGETS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
    # additional_contexts is required: this service's Dockerfile does
    # `COPY --from=shared`, which is a named build context, not a stage. Without
    # this line `docker compose up` in this directory fails on that instruction
    # -- which it did, for eight of the services (WILDBO-BLD-02).
      additional_contexts:
        shared: ../open-security-shared
    command: celery -A guardian worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://guardian:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/guardian
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      # The worker is what scans: the same list as the guardian service (#748).
      - GUARDIAN_ALLOWED_INTERNAL_TARGETS=${GUARDIAN_ALLOWED_INTERNAL_TARGETS:-}
    depends_on:
      - db
      - redis
      - guardian

  celery-beat:
    build:
      context: .
    # additional_contexts is required: this service's Dockerfile does
    # `COPY --from=shared`, which is a named build context, not a stage. Without
    # this line `docker compose up` in this directory fails on that instruction
    # -- which it did, for eight of the services (WILDBO-BLD-02).
      additional_contexts:
        shared: ../open-security-shared
    command: celery -A guardian beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://guardian:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/guardian
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
    depends_on:
      - db
      - redis
      - guardian

  flower:
    build:
      context: .
    # additional_contexts is required: this service's Dockerfile does
    # `COPY --from=shared`, which is a named build context, not a stage. Without
    # this line `docker compose up` in this directory fails on that instruction
    # -- which it did, for eight of the services (WILDBO-BLD-02).
      additional_contexts:
        shared: ../open-security-shared
    command: celery -A guardian flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://guardian:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/guardian
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
    depends_on:
      - redis
      - celery

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  default:
    name: guardian-network
    external: false
